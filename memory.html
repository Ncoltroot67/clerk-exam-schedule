  {id:651,front:"CPLR 4012 \"Marked pleadings\" means those pleadings which are:",back:"marked to show the court what is admitted and what is at issue",subject:"CPLR",article:"CPLR Art. 40",statute:"CPLR 4012"},
  {id:652,front:"CPLR 4012 Marked pleadings are furnished to the court by:",back:"the party who filed the note of issue.",subject:"CPLR",article:"CPLR Art. 40",statute:"CPLR 4012"},
  {id:653,front:"CPLR 4013 Select the correct statement.",back:"If the parties stipulate, the trial judge may conduct the trial away from the courthouse.",subject:"CPLR",article:"CPLR Art. 40",statute:"CPLR 4013"},
  {id:654,front:"CPLR 4014 Select the correct statement.",back:"A trial shall continue until it is completed.",subject:"CPLR",article:"CPLR Art. 40",statute:"CPLR 4014"},
  {id:655,front:"CPLR 4016 At the close of all the evidence on the issues tried, closing statements are made by the attorneys:",back:"in inverse order to opening statements were made",subject:"CPLR",article:"CPLR Art. 40",statute:"CPLR 4016"},
  {id:656,front:"CPLR 4016 Abe sues Bob and Chris. At trial Abe opens first, then Bob, and then Chris. According to the CPLR, what order should closing statements be made in:",back:"Chris, Bob, Abe",subject:"CPLR",article:"CPLR Art. 40",statute:"CPLR 4016"},
  {id:657,front:"CPLR 4019 A court shall not conduct an \"in camera\" interview of an infant in any action to fix custody or other specified marital issues unless",back:"a stenographic record of such interview is made.",subject:"CPLR",article:"CPLR Art. 40",statute:"CPLR 4019"},
  {id:658,front:"CPLR 4101 Select the correct answer with respect to civil actions.",back:"With respect to some issues of fact, there is no right to a jury trial.",subject:"CPLR",article:"CPLR",statute:"CPLR Art. 41"},
  {id:659,front:"CPLR 4102 When a right to a jury trial exists, failure of the parties to file a demand for a trial by jury:",back:"means the judge may hear the action without a jury",subject:"CPLR",article:"CPLR Art. 41",statute:"CPLR 4102(a"},
  {id:660,front:"CPLR 4102 Select the correct statement pertaining to the ability of a party to withdraw his demand for a trial by jury:",back:"Consent of the other parties is required.",subject:"CPLR",article:"CPLR Art. 41",statute:"CPLR 4102"},
  {id:661,front:"CPLR 4104 A jury in a civil action is composed of _______ persons.",back:"six",subject:"CPLR",article:"CPLR Art. 41",statute:"CPLR 4104"},
  {id:662,front:"CPLR 4106 The maximum number of alternate jurors in a civil action is:",back:"two",subject:"CPLR",article:"CPLR Art. 41",statute:"CPLR 4106"},
  {id:663,front:"CPLR 4107 In civil actions, when a jury is being chosen:",back:"a judge shall be present if requested by a party",subject:"CPLR",article:"CPLR Art. 41",statute:"CPLR 4107"},
  {id:664,front:"CPLR 4108 An objection to the qualifications of a juror is called a(n):",back:"challenge",subject:"CPLR",article:"CPLR Art. 41",statute:"CPLR 4108"},
  {id:665,front:"CPLR 4109 In a civil action in which no alternate jurors are to be chosen, what is the combined total number of peremptory challenges allowed to the plaintiff or plaintiffs:",back:"three",subject:"CPLR",article:"CPLR Art. 41",statute:"CPLR 4109"},
  {id:666,front:"CPLR 4109 In a civil action, what is the combined total number of peremptory challenges allowed plaintiffs for every two alternate jurors:",back:"one",subject:"CPLR",article:"CPLR Art. 41",statute:"CPLR 4109"},
  {id:667,front:"CPLR 4110 In a civil action, the number of challenges for cause that each party has is:",back:"(a), (b) and (c) are all correct.",subject:"CPLR",article:"CPLR",statute:"CPLR Art. 41"},
  {id:668,front:"CPLR 4111 Select the best answer.",back:"Both (a) and (b) are correct.",subject:"CPLR",article:"CPLR Art. 41",statute:"CPLR 4111(a"},
  {id:669,front:"CPLR 4113 In a civil action, how many jurors out of six must concur in a verdict:",back:"five",subject:"CPLR",article:"CPLR Art. 41",statute:"CPLR 4113(a"},
  {id:670,front:"CPLR 4213 Generally, the decision of the court must be rendered within days after a matter is finally submitted.",back:"sixty",subject:"CPLR",article:"CPLR Art. 42",statute:"CPLR 4213(c"},
  {id:671,front:"CPLR 4301 Select the best answer: A referee appointed to determine an issue or to perform an act may:",back:"neither (a), (b) nor (c) is correct.",subject:"CPLR",article:"CPLR Art. 43",statute:"CPLR 4301"},
  {id:672,front:"CPLR 4312 How many referees may a court appoint with regard to a matter:",back:"one or three",subject:"CPLR",article:"CPLR Art. 43",statute:"CPLR 4312"},
  {id:673,front:"CPLR 4312 Which of the following are not permitted to serve as a referee in a case other than an uncontested matrimonial action.",back:"all of the above.",subject:"CPLR",article:"CPLR Art. 43",statute:"CPLR 4312 (3"},
  {id:674,front:"CPLR 4315 Unless waived on consent of all the parties, a referee generally must be sworn. The oath may be administered by:",back:"any person authorized by the real property law to take acknowledgments of deeds.",subject:"CPLR",article:"CPLR Art. 43",statute:"CPLR 4315"},
  {id:675,front:"CPLR 4318 According to the CPLR, a referee shall conduct a trial:",back:"in the same manner as a court trying an issue without a jury",subject:"CPLR",article:"CPLR Art. 43",statute:"CPLR 4318"},
  {id:676,front:"CPLR 4319 Ordinarily a referee shall file his decision within:",back:"thirty days after the matter is submitted for decision",subject:"CPLR",article:"CPLR Art. 43",statute:"CPLR 4319"},
  {id:677,front:"CPLR 4320 In a trial conducted by a referee to report:",back:"a transcript of the testimony is filed with the referee's report",subject:"CPLR",article:"CPLR Art. 43",statute:"CPLR 4320"},
  {id:678,front:"CPLR 4321 The fees of a referee are generally:",back:"determined by order or stipulation.",subject:"CPLR",article:"CPLR Art. 43",statute:"CPLR 4321"},
  {id:679,front:"CPLR 4402 Select the best answer.",back:"Both (a) and (b) are correct.",subject:"CPLR",article:"CPLR Art. 44",statute:"CPLR 4402"},
  {id:680,front:"CPLR 4404 Select the best answer. After trial of a cause of action triable of right by jury, the court may upon the motion of any party or on its own initiative",back:"Both (a) and (b) are correct.",subject:"CPLR",article:"CPLR Art. 44",statute:"CPLR 4404(a"},
  {id:681,front:"CPLR 4405 A post-trial motion for a new trial must be made within ______ days after decision, verdict or discharge of the jury.",back:"fifteen",subject:"CPLR",article:"CPLR Art. 44",statute:"CPLR 4405"},
  {id:682,front:"CPLR 4406 As to written post-trial motions made after decision, verdict or discharge of the jury",back:"there may be only one motion, to include all available grounds",subject:"CPLR",article:"CPLR Art. 44",statute:"CPLR 4406"},
  {id:683,front:"CPLR 5001 If a plaintiff is successful on a cause of action for breach of contract, what is the earliest date from which he may recover interest on the sum awarded?",back:"The date of breach.",subject:"CPLR",article:"CPLR Art. 50",statute:"CPLR 5001(b"},
  {id:684,front:"CPLR 5002 Who computes the amount of interest included in the judgment?",back:"The clerk of the court.",subject:"CPLR",article:"CPLR Art. 50",statute:"CPLR 5002"},
  {id:685,front:"CPLR 5003 Interest is recoverable for the period between the entry of the judgment and satisfaction of the judgment:",back:"with respect to any money judgment.",subject:"CPLR",article:"CPLR Art. 50",statute:"CPLR 5003"},
  {id:686,front:"CPLR 5003-b Special rules pertain to non-disclosure agreements related to _____________ claims such that plaintiff has 21 days to consider whether such non-disclosure agreement is his or her preference.",back:"discrimination",subject:"CPLR",article:"CPLR Art. 50",statute:"CPLR 5003-b"},
  {id:687,front:"CPLR 5004 Except where otherwise provided by statute, interest upon a judgment is computed at which of the following rates:",back:"nine percent per year",subject:"CPLR",article:"CPLR Art. 50",statute:"CPLR 5004"},
  {id:688,front:"CPLR 5011 Select the best answer.",back:"(a), (b) and (c) are all correct.",subject:"CPLR",article:"CPLR Art. 50",statute:"CPLR 5011"},
  {id:689,front:"CPLR 5012 and 5013 Select the best answer.",back:"(a), (b) and (c) are all correct.",subject:"CPLR",article:"CPLR Art. 50",statute:"CPLR 5012"},
  {id:690,front:"CPLR 5015 Select the best answer. Which of the following is a proper ground to vacate a judgment?",back:"(a), (b) and (c) are all correct.",subject:"CPLR",article:"CPLR Art. 50",statute:"CPLR 5015(a"},
  {id:691,front:"CPLR 5016 A judgment is entered when:",back:"signed and filed by the clerk of the court",subject:"CPLR",article:"CPLR Art. 50",statute:"CPLR 5016(a"},
  {id:692,front:"CPLR 5017 Select the best answer. A judgment roll may be prepared by:",back:"both (a) and (b) are correct",subject:"CPLR",article:"CPLR Art. 50",statute:"CPLR 5017(a"},
  {id:693,front:"CPLR 5021 Upon filing of the satisfaction piece, the clerk of the court should:",back:"make an entry of the satisfaction on the docket",subject:"CPLR",article:"CPLR Art. 50",statute:"CPLR 5021(a"},
  {id:694,front:"CPLR 5102 An execution on a judgment awarding possession of real property should be:",back:"delivered to the sheriff.",subject:"CPLR",article:"CPLR Art. 50",statute:"CPLR 5102"},
  {id:695,front:"CPLR 5201 Select the best answer.",back:"Both (a) and (b) are correct",subject:"CPLR",article:"CPLR Art. 52",statute:"CPLR 5201(a"},
  {id:696,front:"CPLR 5201(b) In an action arising from a medical debt, brought by a health care professional,",back:"no property lien shall be entered or enforced against a debtor's primary residence;",subject:"CPLR",article:"CPLR",statute:"CPLR Art. 52"},
  {id:697,front:"CPLR 5205 Which of the following is entitled to a \"trust exemption\" from application to the satisfaction of a money judgment:",back:"all of the above.",subject:"CPLR",article:"CPLR Art. 52",statute:"CPLR 5205(c"},
  {id:698,front:"CPLR 5205(1)(2) Under state and federal law, which of the following is not exempt from judgment:",back:"life insurance proceeds.",subject:"CPLR",article:"CPLR",statute:"CPLR Art. 52"},
  {id:699,front:"CPLR 5205 Which of the following is not personal property exempt from the satisfaction of a money judgment:",back:"a dishwasher.",subject:"CPLR",article:"CPLR",statute:"CPLR Art. 52"},
  {id:700,front:"CPLR 5206 Which of the following is correct?",back:"None of the above.",subject:"CPLR",article:"CPLR Art. 52",statute:"CPLR 5206(a"},
  {id:701,front:"CPLR 5207 Select the best statement(s).",back:"Both (a) and (b) are correct.",subject:"CPLR",article:"CPLR Art. 52",statute:"CPLR 5207"},
  {id:702,front:"CPLR 5211 In relation to the taking of testimony in an enforcement proceeding relating to the disposition of property in which a judgment debtor has an interest:",back:"immunity can be conferred on any witness",subject:"CPLR",article:"CPLR Art. 52",statute:"CPLR 5211"},
  {id:703,front:"CPLR 5221 Enforcement procedures as to a judgment entered in the New York City Civil Court, where the respondent resides in New York City, shall be commenced in the:",back:"New York City Civil Court, only",subject:"CPLR",article:"CPLR Art. 52",statute:"CPLR 5221(a)(3"},
  {id:704,front:"CPLR 5222(c) A judgment creditor must not serve more than _______ restraining notices per year upon a natural person's banking institution:",back:"two",subject:"CPLR",article:"CPLR Art. 52",statute:"CPLR 5222(c"},
  {id:705,front:"CPLR 5223 At any time before a judgment is satisfied or vacated, the judgment creditor may compel disclosure of all matter relevant to the satisfaction of the judgment, by serving upon any person a(n):",back:"subpoena.",subject:"CPLR",article:"CPLR Art. 52",statute:"CPLR 5223"},
  {id:706,front:"CPLR 5227 Select the best answer. A judgment creditor may enforce a judgment against:",back:"(a), (b) and (c) are all correct.",subject:"CPLR",article:"CPLR",statute:"CPLR Art. 52"},
  {id:707,front:"CPLR 5229 A judge of which court, before a judgment is entered, upon motion of the party in whose favor a verdict or decision has been rendered, may order a losing party restrained from disposing of assets:",back:"the trial court",subject:"CPLR",article:"CPLR Art. 52",statute:"CPLR 5229"},
  {id:708,front:"CPLR 5232 If personal property capable of delivery is levied upon by a sheriff in execution of a judgment, the sheriff shall:",back:"take the property into his custody",subject:"CPLR",article:"CPLR Art. 52",statute:"CPLR 5232(b"},
  {id:709,front:"CPLR 5234 If the proceeds of a sheriff's sale of personal property are in excess of the debt, fees, expenses and taxes, the excess shall:",back:"be paid over to the judgment debtor",subject:"CPLR",article:"CPLR Art. 52",statute:"CPLR 5234"},
  {id:710,front:"CPLR 5236 If real property is sold at public auction by a sheriff pursuant to an execution on a judgment, the property shall be sold:",back:"within the county where it is situated",subject:"CPLR",article:"CPLR Art. 52",statute:"CPLR 5236(a"},
  {id:711,front:"CPLR 5250 If it appears that a judgment debtor is about to depart from the State and there is reason to believe that he has in his possession property in which he has an interest, the court may:",back:"issue a warrant directing the sheriff to arrest the judgment debtor",subject:"CPLR",article:"CPLR Art. 52",statute:"CPLR 5250"},
  {id:712,front:"CPLR 5501 Upon appeal, the Appellate Division reviews:",back:"questions of law and fact",subject:"CPLR",article:"CPLR Art. 55",statute:"CPLR 5501(c"},
  {id:713,front:"CPLR 5511 On an appeal the parties are designated as:",back:"appellant-respondent",subject:"CPLR",article:"CPLR Art. 55",statute:"CPLR 5511"},
  {id:714,front:"CPLR 5513 An appeal as of right must be taken within _______ days after service of a copy of the judgment or order appealed from with written notice of its entry.",back:"thirty",subject:"CPLR",article:"CPLR Art. 55",statute:"CPLR 5513(a"},
  {id:715,front:"CPLR 5514 If the attorney for an aggrieved party dies or becomes physically or mentally incapacitated before the expiration of the time limited for taking an appeal, the appeal may be taken:",back:"within sixty days from the date of death or commencement of the incapacity",subject:"CPLR",article:"CPLR Art. 55",statute:"CPLR 5514"},
  {id:716,front:"CPLR 5519 Select the best answer. Service upon the adverse party of a notice of appeal stays all proceedings to enforce the judgment appealed from pending the appeal where:",back:"only (a) and (c) are correct",subject:"CPLR",article:"CPLR Art. 55",statute:"CPLR 5519(a)(l) & (2"},
  {id:717,front:"CPLR 5521 Preferences in the hearing of an appeal:",back:"are within the discretion of the court to which the appeal is taken",subject:"CPLR",article:"CPLR Art. 55",statute:"CPLR 5521"},
  {id:718,front:"CPLR 5522 A court to which an appeal is taken may:",back:"modify any judgment or order before it, as to any party.",subject:"CPLR",article:"CPLR Art. 55",statute:"CPLR 5522(a"},
  {id:719,front:"CPLR 5529 Select the best answer with regard to appellate briefs.",back:"Both (a) and (b) are correct.",subject:"CPLR",article:"CPLR Art. 55",statute:"CPLR 5529(e"},
  {id:720,front:"CPLR 7001 A habeas corpus proceeding is:",back:"a special proceeding.",subject:"CPLR",article:"CPLR Art. 70",statute:"CPLR 7001"},
  {id:721,front:"CPLR 7003 A judge who in refusing to issue a writ of habeas corpus violates CPLR 7003 forfeits to the person detained:",back:"one thousand dollars.",subject:"CPLR",article:"CPLR Art. 70",statute:"CPLR 7003(c"},
  {id:722,front:"CPLR 7004 In a habeas corpus proceeding the respondent is:",back:"the person having custody of the person detained.",subject:"CPLR",article:"CPLR Art. 70",statute:"CPLR 7004(b"},
  {id:723,front:"CPLR 7005 A writ of habeas corpus may be served on:",back:"any day.",subject:"CPLR",article:"CPLR Art. 70",statute:"CPLR 7005"},
  {id:724,front:"CPLR 7006 Select the best answer.",back:"Both (a) and (b) are correct.",subject:"CPLR",article:"CPLR Art. 70",statute:"CPLR 7006(a"},
  {id:725,front:"CPLR 7008 Where a writ of habeas corpus requires that the return to it be filed \"forthwith,\" such return must be filed within ___________ after its service.",back:"twenty-four hours",subject:"CPLR",article:"CPLR Art. 70",statute:"CPLR 7008(a"},
  {id:726,front:"CPLR 7801 Select the best answer. Relief previously obtained by a writ of __________ can now be obtained in a proceeding under Article 78 of the CPLR.",back:"(a), (b) and (c) are all correct.",subject:"CPLR",article:"CPLR Art. 78",statute:"CPLR 7801"},
  {id:727,front:"CPLR 7804 An Article 78 proceeding is:",back:"a special proceeding",subject:"CPLR",article:"CPLR Art. 78",statute:"CPLR 7804"},
  {id:728,front:"CPLR 7804 An Article 78 proceeding:",back:"can only be brought in the Supreme Court",subject:"CPLR",article:"CPLR Art. 78",statute:"CPLR 7804(b"},
  {id:729,front:"CPL 1.20-1 Select the correct answer. Accusatory instruments are used on behalf of the State as plaintiff to charge:",back:"all offenses",subject:"CPL",article:"CPL",statute:"CPL Art. 1"},
  {id:730,front:"CPL 1.20-1 Select the correct answer. The State is designated as the plaintiff in every accusatory instrument:",back:"without exception.",subject:"CPL",article:"CPL",statute:"CPL Art. 1"},
  {id:731,front:"CPL 1.20-3 Select the correct answer. An indictment is an accusation by:",back:"a grand jury",subject:"CPL",article:"CPL",statute:"CPL Art. 1"},
  {id:732,front:"CPL 1.20-4 Select the correct answer. An information in a local criminal court is:",back:"a verified written accusation by a person",subject:"CPL",article:"CPL",statute:"CPL Art. 195"},
  {id:733,front:"CPL 1.20-4 Select the correct answer. An information may serve:",back:"both to commence a criminal action and as a basis for prosecution",subject:"CPL",article:"CPL",statute:"CPL Art. 195"},
  {id:734,front:"CPL 1.20-6 Select the correct answer. A \"prosecutor's information\" can charge a defendant with a:",back:"traffic infraction",subject:"CPL",article:"CPL",statute:"CPL Art. 195"},
  {id:735,front:"CPL 1.20-7 Select the correct answer. A misdemeanor complaint can charge one or more defendants with:",back:"any offense, with at least one being a crime, but none being a felony.",subject:"CPL",article:"CPL",statute:"CPL Art. 195"},
  {id:736,front:"CPL 1.20-9 Select the correct answer. Arraignment refers to a defendant's appearance in:",back:"the court in which the criminal action is pending",subject:"CPL",article:"CPL",statute:"CPL Art. 195"},
  {id:737,front:"CPL 1.20-11 Select the correct answer. Jury trial commences:",back:"with selection of the jury.",subject:"CPL",article:"CPL",statute:"CPL Art. 195"},
  {id:738,front:"CPL 1.20-13 Select the correct answer. Which one of the following constitutes a conviction?",back:"The entry of a plea of guilty upon an indictment.",subject:"CPL",article:"CPL",statute:"CPL Art. 195"},
  {id:739,front:"CPL 1.20-16, 17 Select the correct answer. John is caught while committing a felony. He is arrested and processed through a court. The criminal action commences, according to CPL, when:",back:"the first accusatory instrument is filed against him.",subject:"CPL",article:"CPL",statute:"CPL Art. 195"},
  {id:740,front:"CPL 1.20-27 Select the correct answer. A \"summons\" in a criminal action is served upon:",back:"a defendant against whom a criminal action has commenced",subject:"CPL",article:"CPL",statute:"CPL Art. 195"},
  {id:741,front:"CPL 1.20-27 Select the correct answer. A process of a local criminal court requiring a defendant to appear before it for arraignment upon a filed accusatory instrument by which a criminal action was commenced is known as:",back:"a summons",subject:"CPL",article:"CPL",statute:"CPL Art. 195"},
  {id:742,front:"CPL 1.20-27 Select the correct answer: A summons may be issued by:",back:"a local or superior court",subject:"CPL",article:"CPL",statute:"CPL Art. 195"},
  {id:743,front:"CPL 1.20-28 Select the correct answer. A warrant of arrest is addressed to and can be executed by:",back:"a police officer",subject:"CPL",article:"CPL",statute:"CPL Art. 195"},
  {id:744,front:"CPL 1.20-29 Select the correct answer. A \"superior court warrant of arrest\" directs",back:"a police officer",subject:"CPL",article:"CPL",statute:"CPL Art. 195"},
  {id:745,front:"CPL 1.20-30 Select the correct answer. A process of a criminal court which directs a police officer to take into custody a defendant who has previously been arraigned upon an accusatory instrument by which an action was commenced is:",back:"a bench warrant",subject:"CPL",article:"CPL",statute:"CPL Art. 195"},
  {id:746,front:"CPL 1.20-34(s) Select the correct answer. The State University of New York operates state-wide. For security functions it appoints persons who are designated in CPL as",back:"police officers",subject:"CPL",article:"CPL",statute:"CPL Art. 195"},
  {id:747,front:"CPL 1.20-38 Select the correct answer. According to CPL, an affirmation is most nearly equal to:",back:"an oath",subject:"CPL",article:"CPL",statute:"CPL Art. 195"},
  {id:748,front:"CPL 1.20-39 Select the correct answer. Petty offenses include:",back:"traffic infractions and violations",subject:"CPL",article:"CPL",statute:"CPL Art. 195"},
  {id:749,front:"CPL 1.20-42 Select the correct answer. Which of the following constitutes a juvenile offender?",back:"A fourteen-year old who commits acts constituting the crime of burglary first degree",subject:"CPL",article:"CPL",statute:"CPL Art. 195"},
  {id:750,front:"CPL 10.10-1 Select the correct answer. Smith commits a crime in New York City. His criminal case can be tried, according to the CPL:",back:"only in a local criminal court or superior court",subject:"CPL",article:"CPL",statute:"CPL Art. 10"},
  {id:751,front:"CPL 10.10-2 Select the correct answer. A superior court of criminal jurisdiction refers to:",back:"Supreme Court and County Court.",subject:"CPL",article:"CPL",statute:"CPL Art. 10"},
  {id:752,front:"CPL 10.20-1 Select the correct answer. Superior courts have trial jurisdiction over:",back:"petty offenses, only if there is also a crime charged.",subject:"CPL",article:"CPL",statute:"CPL Art. 10"},
  {id:753,front:"CPL 10.20-l(c) Select the correct answer. Creep has been indicted on a petty offense. The indictment also charges Creep with a crime. Creep's case may be heard only in a:",back:"superior court",subject:"CPL",article:"CPL",statute:"CPL Art. 10"},
  {id:754,front:"CPL 30.10 Select the correct answer. The limiting period within which a prosecution for murder (class A felony) must be commenced is:",back:"none of the foregoing.",subject:"CPL",article:"CPL",statute:"CPL Art. 30"},
  {id:755,front:"CPL 30.10 Select the correct answer. Except as otherwise provided, prosecution for a misdemeanor charge must generally be commenced, after its commission, within:",back:"two years",subject:"CPL",article:"CPL",statute:"CPL Art. 30"},
  {id:756,front:"CPL 30.10-3 Select the correct answer. Prosecution for a crime must generally be commenced:",back:"within five years after commission, for some felonies",subject:"CPL",article:"CPL",statute:"CPL Art. 30"},
  {id:757,front:"CPL 30.20 Select the correct answer. According to New York CPL, a criminal action:",back:"has preference over other criminal actions, if the defendant is in sheriff's custody",subject:"CPL",article:"CPL",statute:"CPL Art. 30"},
  {id:758,front:"CPL 30.20-2 Select the correct answer. Zillions, a rich man, was arraigned and released on bail. Beggar, a poor man, committed a crime, was arraigned and committed to the sheriffs custody while awaiting trial.",back:"Beggar must be brought to trial before Zillions, if practicable",subject:"CPL",article:"CPL",statute:"CPL Art. 30"},
  {id:759,front:"CPL 30.30-l(a) Select the correct answer. Generally for a felony other than certain homicides, the indictment is subject to being dismissed if the People are not ready for trial within:",back:"six months",subject:"CPL",article:"CPL",statute:"CPL Art. 30"},
  {id:760,front:"(New, 2026) CPL 30.30(5) Whenever a prosecutor states or otherwise provides notice that the People are ready for trial, the court shall:",back:"make inquiry on the record as to their actual readiness",subject:"CPL",article:"CPL",statute:"CPL Art. 30"},
  {id:761,front:"CPL 100.05 Select the correct answer. A criminal action may be commenced in a local criminal court:",back:"by filing either an information, misdemeanor complaint or felony complaint.",subject:"CPL",article:"CPL",statute:"CPL Art. 100"},
  {id:762,front:"CPL 100.05 Select the correct answer. A criminal action is generally commenced:",back:"by filing an accusatory instrument",subject:"CPL",article:"CPL",statute:"CPL Art. 100"},
  {id:763,front:"CPL 100.05 Select the correct answer. If more than one accusatory instrument is filed in the course of the same criminal action:",back:"the action is commenced when the first is filed",subject:"CPL",article:"CPL",statute:"CPL Art. 100"},
  {id:764,front:"CPL 100.05 Select the correct answer. A superior court action against an adult defendant who has never been held by a local criminal court on the same matter is commenced by:",back:"a grand jury indictment",subject:"CPL",article:"CPL",statute:"CPL Art. 100"},
  {id:765,front:"CPL 100.07 Select the correct answer. As to specified family offenses, a criminal court's jurisdiction:",back:"is concurrent with that of the family court",subject:"CPL",article:"CPL",statute:"CPL Art. 100"},
  {id:766,front:"CPL 100.10-1 Select the correct answer. An information is an accusation filed with a local criminal court:",back:"charging a person with an offense other than a felony",subject:"CPL",article:"CPL",statute:"CPL Art. 100"},
  {id:767,front:"CPL 100.10-2 Select the correct answer. A simplified traffic information is a written accusation filed with a local criminal court charging a defendant with a traffic offense, and which:",back:"can be made only by a police officer or other authorized person",subject:"CPL",article:"CPL",statute:"CPL Art. 100"},
  {id:768,front:"CPL 100.10-3 Select the correct answer. A prosecutor's information is an accusation by a district attorney, filed with a local criminal court:",back:"which may commence a criminal action in some cases",subject:"CPL",article:"CPL",statute:"CPL Art. 100"},
  {id:769,front:"CPL 100.20 Select the correct answer. A supporting deposition:",back:"is always a written instrument",subject:"CPL",article:"CPL",statute:"CPL Art. 100"},
  {id:770,front:"CPL 100.20 Select the correct answer. A supporting deposition is filed in connection with:",back:"an information or a misdemeanor complaint.",subject:"CPL",article:"CPL",statute:"CPL Art. 100"},
  {id:771,front:"CPL 100.30 Select the correct answer. The fact that an accusatory instrument is verified means:",back:"the statements contained therein are sworn to",subject:"CPL",article:"CPL",statute:"CPL Art. 100"},
  {id:772,front:"CPL 100.55-2 Select the correct answer. A local criminal court accusatory instrument may be filed with the New York Criminal Court:",back:"for an offense allegedly committed in New York City",subject:"CPL",article:"CPL",statute:"CPL Art. 100"},
  {id:773,front:"CPL 100.55-6 Select the correct answer. Conduct in Town S within County A leads to a felony complaint against an adult. This felony complaint against the adult may be filed:",back:"in any town or village court within County A.",subject:"CPL",article:"CPL",statute:"CPL Art. 100"},
  {id:774,front:"CPL 100.55-11 Select the correct answer. A local criminal court accusatory instrument may be filed in the local criminal court where the offense allegedly occurred:",back:"with the court while it is duly operating an off-hours arraignment part",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.55-11"},
  {id:775,front:"CPL 120.10-1 Select the correct answer. The function of a warrant of arrest is:",back:"to bring a defendant into court for arraignment",subject:"CPL",article:"CPL",statute:"CPL Art. 120"},
  {id:776,front:"CPL 120.10.2 Select the correct answer. In a warrant of arrest, a defendant:",back:"may be identified by description, without using a name",subject:"CPL",article:"CPL",statute:"CPL Art. 120"},
  {id:777,front:"CPL 120.55 Select the correct answer. An adult defendant is out on parole from a sentence in an earlier case. The local criminal court has just issued a warrant for his arrest on an unrelated charge. The warrant may be executed by:",back:"a parole officer or police officer",subject:"CPL",article:"CPL",statute:"CPL Art. 120"},
  {id:778,front:"CPL 120.60-3 Select the correct answer. When a police officer delegates another police officer to execute a warrant of arrest, the first police officer may do so:",back:"by mail or telecommunication",subject:"CPL",article:"CPL",statute:"CPL Art. 120"},
  {id:779,front:"CPL 120.70 Select the correct answer. A warrant of arrest issued by the District Court of Nassau County may be executed:",back:"anywhere in the state, without endorsement.",subject:"CPL",article:"CPL",statute:"CPL Art. 120"},
  {id:780,front:"CPL 120.70-2 Select the correct answer. A warrant of arrest issued by the town court of the Town of Hillsdale, New York, (located in Columbia County) may be executed:",back:"in Columbia County or in an adjoining county.",subject:"CPL",article:"CPL",statute:"CPL Art. 120"},
  {id:781,front:"CPL 120.80-1 Select the correct answer. A warrant of arrest may be executed on any day of the week and at any hour of the day or night:",back:"regardless of the offense on which it is based",subject:"CPL",article:"CPL",statute:"CPL Art. 120"},
  {id:782,front:"CPL 120.80-3 Select the correct answer. The use of deadly physical force by a police officer in making an arrest pursuant to a warrant of arrest is:",back:"governed by Penal Law provisions",subject:"CPL",article:"CPL",statute:"CPL Art. 120"},
  {id:783,front:"CPL 120.90-1 Select the correct answer. Except for electronic arraignment, when authorized, when a defendant is arrested on a warrant of arrest, he must be brought before the issuing court:",back:"without unnecessary delay",subject:"CPL",article:"CPL",statute:"CPL Art. 120"},
  {id:784,front:"CPL 120.90-6 Select the correct answer. When a defendant is arrested pursuant to a warrant, fingerprinting and other preliminary police duties should be performed:",back:"without unnecessary delay.",subject:"CPL",article:"CPL",statute:"CPL Art. 120"},
  {id:785,front:"CPL 120.90-7 Select the correct answer. Upon arresting a juvenile offender or adolescent offender, a police officer must notify the parents:",back:"immediately",subject:"CPL",article:"CPL",statute:"CPL Art. 120"},
  {id:786,front:"CPL 160.10-2(a) Select the correct answer. A police officer who arrests a defendant may, according to CPL, take the defendant's fingerprints if the officer:",back:"is unable to ascertain such person's identity.",subject:"CPL",article:"CPL",statute:"CPL Art. 160"},
  {id:787,front:"CPL 160.20 Select the correct answer. According to CPL, upon taking fingerprints from a person arrested, the appropriate police officer or agency must send copies to:",back:"State Division of Criminal Justice Services.",subject:"CPL",article:"CPL",statute:"CPL Art. 160"},
  {id:788,front:"CPL 160.45 Select the correct statement as to a victim of a sexual assault crime concerning submission to a polygraph test or a psychological stress evaluator examination:",back:"Such a test may neither be requested nor required.",subject:"CPL",article:"CPL",statute:"CPL Art. 160"},
  {id:789,front:"CPL 160.57 Assuming that the defendant meets other statutory conditions, convictions for which of the following shall automatically be sealed?",back:"All of the above.",subject:"CPL",article:"CPL",statute:"CPL Art. 160"},
  {id:790,front:"CPL 170.10 Select the correct answer. A defendant in a criminal case in waiving his right to counsel has done so voluntarily and intelligently. Under these circumstances:",back:"he has a right to appear as his own attorney",subject:"CPL",article:"CPL",statute:"CPL Art. 170"},
  {id:791,front:"CPL 170.10-2 Select the correct answer. When a defendant is personally present at arraignment he must be furnished with a copy of the accusatory instrument:",back:"in all cases",subject:"CPL",article:"CPL",statute:"CPL Art. 170"},
  {id:792,front:"CPL 170.10-3(c) Select the correct answer. A defendant who appears at arraignment without counsel has a right to have counsel assigned if he is financially unable to provide his own:",back:"except where he is charged only with one or more traffic infractions",subject:"CPL",article:"CPL",statute:"CPL Art. 170"},
  {id:793,front:"CPL 170.10-7 Select the correct answer. When a defendant appears for arraignment on an information:",back:"bail must be set or defendant released on his own recognizance",subject:"CPL",article:"CPL",statute:"CPL Art. 170"},
  {id:794,front:"CPL 170.20 Select the correct answer. A local criminal court is divested of misdemeanor jurisdiction when:",back:"an indictment for the misdemeanor is filed in a superior court",subject:"CPL",article:"CPL",statute:"CPL Art. 170"},
  {id:795,front:"CPL 170.55-2, 170.56-2 Select the correct answer. The maximum adjournment period involved in an adjournment in contemplation of dismissal:",back:"is longer in marihuana cases than in all others",subject:"CPL",article:"CPL",statute:"CPL Art. 170"},
  {id:796,front:"CPL 170.55-8 Select the correct answer. The effect of an adjournment in contemplation of dismissal upon a defendant's record is that:",back:"it is neither a conviction nor an admission of guilt.",subject:"CPL",article:"CPL",statute:"CPL Art. 170"},
  {id:797,front:"CPL 170.56-2 Select the correct answer. Upon ordering an adjournment in contemplation of dismissal in a case involving marihuana:",back:"the court may require supervision of the defendant by any public or private agency",subject:"CPL",article:"CPL",statute:"CPL Art. 170"},
  {id:798,front:"CPL 170.80 In the case of a 16 year old charged with prostitution, the judge may do the following except:",back:"upon a conviction by plea or verdict, sentence as a Class B misdemeanor",subject:"CPL",article:"CPL",statute:"CPL Art. 170"},
  {id:799,front:"CPL 180.10-1 Select the correct answer. At arraignment on a felony complaint, the defendant:",back:"must be present",subject:"CPL",article:"CPL",statute:"CPL Art. 180"},
  {id:800,front:"CPL 180.10-2 Select the correct answer. Defendant has been arraigned on a felony complaint. According to CPL, he is entitled to a hearing:",back:"to determine whether the defendant is to be held for grand jury action",subject:"CPL",article:"CPL",statute:"CPL Art. 180"},
  {id:801,front:"CPL 180.10-5 Select the correct answer. If a defendant proceeds at an arraignment for a felony without counsel:",back:"he has not waived his right to counsel in further proceedings",subject:"CPL",article:"CPL",statute:"CPL Art. 180"},
  {id:802,front:"CPL 180.50-3 Select the correct answer. If a charge is reduced by a lower criminal court from a felony to a non- felony offense by replacing the felony complaint with a misdemeanor complaint:",back:"upon the filing of the misdemeanor complaint the court must dismiss the felony complaint",subject:"CPL",article:"CPL",statute:"CPL Art. 180"},
  {id:803,front:"CPL 180.60-9 Select the correct answer. According to CPL, at a hearing on a felony complaint in a local criminal court:",back:"the court may exclude the public on application of the defendant",subject:"CPL",article:"CPL",statute:"CPL Art. 180"},
  {id:804,front:"CPL 180.70-1 Select the correct answer. When a defendant is held for action of a grand jury, all pertinent documents must be promptly transmitted from the local criminal court to:",back:"the superior court.",subject:"CPL",article:"CPL",statute:"CPL Art. 180"},
  {id:805,front:"CPL 190.05 Select the correct answer. The grand jury is:",back:"a part of a superior court.",subject:"CPL",article:"CPL",statute:"CPL Art. 190"},
  {id:806,front:"CPL 190.05, 190.25 Select the correct answer. A grand jury to be validly constituted and legally sufficient must be composed of:",back:"not more than twenty-three persons with at least sixteen present at each sitting.",subject:"CPL",article:"CPL",statute:"CPL Art. 190"},
  {id:807,front:"CPL 190.10 Select the correct answer. The authority to promulgate rules regarding the number and the terms for which grand jurors are drawn (other than extraordinary terms) is given by CPL to the:",back:"appellate division in each department",subject:"CPL",article:"CPL",statute:"CPL Art. 190"},
  {id:808,front:"CPL 190.20-1 Select the correct answer. The mode of selection of jurors and their drawing and impaneling for grand jury service is governed by:",back:"the judiciary law",subject:"CPL",article:"CPL",statute:"CPL Art. 190"},
  {id:809,front:"CPL 190.20-3 Select the correct answer. After a grand jury has been impaneled:",back:"the court appoints a foreman and acting foreman, and the jurors choose a secretary",subject:"CPL",article:"CPL",statute:"CPL Art. 190"},
  {id:810,front:"CPL 190.20-5 Select the correct answer. Oral and written instruction given by the court to the grand jury after the grand jury is sworn:",back:"is discretionary with the court",subject:"CPL",article:"CPL",statute:"CPL Art. 190"},
  {id:811,front:"CPL 190.20-6 Select the correct answer. When more than one grand jury is impaneled for the same term of court, jurors may be transferred from one panel to another:",back:"by the court",subject:"CPL",article:"CPL",statute:"CPL Art. 190"},
  {id:812,front:"CPL 190.25-2 Which one of the following statements concerning the grand jury is true?",back:"Any grand juror may administer an oath to any witness appearing before the grand jury.",subject:"CPL",article:"CPL",statute:"CPL Art. 190"},
  {id:813,front:"CPL 190.25-1 Select the correct answer. An affirmative action of the grand jury, such as an indictment, requires the concurrence of at least:",back:"twelve members",subject:"CPL",article:"CPL",statute:"CPL Art. 190"},
  {id:814,front:"CPL 190.25-3-a Select the correct answer. Which of the following persons may be present in the grand jury room at any time:",back:"an interpreter for a deaf or hearing-impaired grand juror",subject:"CPL",article:"CPL",statute:"CPL Art. 190"},
  {id:815,front:"CPL 190.30-3(d) Select the correct answer. The victim of an auto larceny has stated under oath that he is the owner of the vehicle in question and did not give permission to anyone to use the auto. This statement:",back:"may be received in evidence by the grand jury as evidence of the facts therein",subject:"CPL",article:"CPL",statute:"CPL Art. 190"},
  {id:816,front:"CPL 190.32 Select the correct answer. A \"special witness\" is a person whom the district attorney intends to call as a witness in a grand jury proceeding and who is:",back:"unable to testify in person because of a physical illness",subject:"CPL",article:"CPL",statute:"CPL Art. 190"},
  {id:817,front:"CPL 190.32-l(a) Select the correct answer. A \"child witness\" in a grand jury proceeding must be:",back:"twelve years old or less.",subject:"CPL",article:"CPL",statute:"CPL Art. 190"},
  {id:818,front:"CPL 190.32-3, 4 Select the correct answer. The grand jury may receive as evidence:",back:"by court order, the testimony of a special witness on videotape",subject:"CPL",article:"CPL",statute:"CPL Art. 190"},
  {id:819,front:"CPL 190.40 Select the correct answer. A witness who gives evidence in a grand jury proceeding:",back:"receives immunity for the crime he is questioned about if he testifies truthfully.",subject:"CPL",article:"CPL",statute:"CPL Art. 190"},
  {id:820,front:"CPL 190.50-2 Select the correct answer. The district attorney may call as a witness in a grand jury proceeding:",back:"anyone believed by the district attorney to possess relevant information",subject:"CPL",article:"CPL",statute:"CPL Art. 190"},
  {id:821,front:"CPL 190.50-3 Select the correct answer. If the grand jury directs the district attorney to serve a grand jury subpoena upon a witness:",back:"the court may vacate such subpoena upon application by the district attorney to do so",subject:"CPL",article:"CPL",statute:"CPL Art. 190"},
  {id:822,front:"CPL 190.52 Select the correct answer. The attorney for a witness who has signed a waiver of immunity in a grand jury proceeding:",back:"may only advise his client as a witness.",subject:"CPL",article:"CPL",statute:"CPL Art. 190"},
  {id:823,front:"CPL 190.65 Select the correct answer. At a grand jury hearing, the evidence must be legally sufficient and provide:",back:"reasonable cause to believe that the person committed the offense",subject:"CPL",article:"CPL",statute:"CPL Art. 190"},
  {id:824,front:"CPL 190.65-2 Select the correct answer. A grand jury which is examining and hearing evidence in connection with a misdemeanor charge may:",back:"indict the defendant for a felony",subject:"CPL",article:"CPL",statute:"CPL Art. 190"},
  {id:825,front:"CPL 190.75-4 Select the correct answer. When a grand jury has dismissed all charges against a person:",back:"the district attorney must notify such person within ninety days.",subject:"CPL",article:"CPL",statute:"CPL Art. 190"},
  {id:826,front:"CPL 195.10 Select the correct answer. A defendant may waive prosecution by indictment and with the district attorney's consent may be tried on a superior court information for:",back:"any crime except a class A felony punishable by death or life imprisonment.",subject:"CPL",article:"CPL",statute:"CPL Art. 195"},
  {id:827,front:"CPL 195.20 Select the correct answer. A waiver of prosecution by indictment:",back:"must be in writing, signed by the defendant",subject:"CPL",article:"CPL",statute:"CPL Art. 195"},
  {id:828,front:"CPL 200.10 Select the correct statement",back:"The term \"indictment\" includes a superior court information",subject:"CPL",article:"CPL",statute:"CPL Art. 200"},
  {id:829,front:"CPL 200.30 Select the correct answer. When a particular offense may be committed in different ways:",back:"an indictment may charge the different ways, using a separate count for each",subject:"CPL",article:"CPL",statute:"CPL Art. 200"},
  {id:830,front:"CPL 200.60-1 Select the correct answer. Except as to escape in the first or second degree, when a previous conviction raises a charge in an indictment to a higher grade, the indictment:",back:"may not contain any reference to prior conviction",subject:"CPL",article:"CPL",statute:"CPL Art. 200"},
  {id:831,front:"CPL 210.05 Select the correct answer. The only method of prosecuting an offense in a superior court is:",back:"by indictment or superior court information",subject:"CPL",article:"CPL",statute:"CPL Art. 210"},
  {id:832,front:"CPL 210.10 Select the correct answer. On arraignment to answer an indictment:",back:"defendant must appear in person.",subject:"CPL",article:"CPL",statute:"CPL Art. 210"},
  {id:833,front:"CPL 210.10-1 Select the correct answer. The minimum notice required to be given to an attorney to appear on the arraignment of his client on an indictment is:",back:"two days (c) four days",subject:"CPL",article:"CPL",statute:"CPL Art. 210"},
  {id:834,front:"CPL 210.30 Select the correct answer. A motion to dismiss an indictment on the ground that the evidence presented to the grand jury was legally insufficient to establish the offense charged:",back:"must be preceded or accompanied by a motion to inspect the grand jury minutes",subject:"CPL",article:"CPL",statute:"CPL Art. 210"},
  {id:835,front:"CPL 220.10-4 Select the correct answer. In entering a guilty plea to a lesser included offense in an indictment charging two or more offenses:",back:"both the court and the prosecutor must consent",subject:"CPL",article:"CPL",statute:"CPL Art. 220"},
  {id:836,front:"CPL 220.10-6 Select the correct answer. If a defendant enters a plea of not responsible by reason of mental disease or defect:",back:"permission of the court and consent of the prosecutor are both required.",subject:"CPL",article:"CPL",statute:"CPL Art. 220"},
  {id:837,front:"CPL 220.30-2 Select the correct answer. A guilty plea accepted as to part of an indictment:",back:"constitutes a disposition of the entire indictment",subject:"CPL",article:"CPL",statute:"CPL Art. 220"},
  {id:838,front:"CPL 220.50-2 Select the correct answer. A plea to an indictment against a corporation must be entered by:",back:"its counsel.",subject:"CPL",article:"CPL",statute:"CPL Art. 220"},
  {id:839,front:"CPL 220.50-3 Select the correct answer. If a defendant is required to enter a plea to an indictment but refuses to do so:",back:"a plea of not guilty must be entered m his behalf",subject:"CPL",article:"CPL",statute:"CPL Art. 220"},
  {id:840,front:"CPL 220.50-7 Select the correct statement concerning defendants charged with a felony offense who are not United States citizens:",back:"There is a relevant provision in CPL but it applies only to guilty pleas",subject:"CPL",article:"CPL",statute:"CPL Art. 220"},
  {id:841,front:"CPL 220.51 Prior to trial and before accepting a plea charging a felony the court must advise a public official who is a defendant that the guilty plea:",back:"may result in the reduction or revocation of the defendant's pension.",subject:"CPL",article:"CPL Art. 220",statute:"CPL 220.51"},
  {id:842,front:"CPL 260.10 Select the correct answer. In the trial of an indictment, all trials may be non-jury trials:",back:"except for murder in the first degree",subject:"CPL",article:"CPL",statute:"CPL Art. 260"},
  {id:843,front:"CPL 270.10 Select the correct answer. A challenge to the entire panel of prospective jurors:",back:"may be made only by the defendant and must be in writing",subject:"CPL",article:"CPL",statute:"CPL Art. 270"},
  {id:844,front:"CPL 270.15-1 Select the correct statement concerning the examination of prospective jurors.",back:"In questioning by the parties the prosecutor shall be first.",subject:"CPL",article:"CPL",statute:"CPL Art. 270"},
  {id:845,front:"CPL 270.15-3 Select the correct answer. The trial jury foreperson is chosen:",back:"because he or she was the juror whose name was first drawn and called",subject:"CPL",article:"CPL",statute:"CPL Art. 270"},
  {id:846,front:"CPL 270.20 Select the correct statement concerning challenges for cause of an individual juror:",back:"There is no limit on the number that may be exercised by the parties",subject:"CPL",article:"CPL",statute:"CPL Art. 270"},
  {id:847,front:"CPL 270.25 Select the correct answer. A lawyer's objection to a prospective juror for which no reason is given is called a:",back:"peremptory challenge",subject:"CPL",article:"CPL",statute:"CPL Art. 270"},
  {id:848,front:"CPL 270.25-2 Select the correct answer. In a criminal action where the highest crime charged is a class B or C felony, the maximum number of peremptory challenges that a party can make with respect to the regular jurors is:",back:"fifteen",subject:"CPL",article:"CPL",statute:"CPL Art. 270"},
  {id:849,front:"(Amended, 2026) CPL 270.25(3) Select the correct answer. When two or more defendants are tried jointly:",back:"the number of peremptory challenges is the same, regardless of the number of defendants",subject:"CPL",article:"CPL",statute:"CPL Art. 270"},
  {id:850,front:"CPL 270.35 Select the correct answer. A case is on trial in which all the evidence has been presented to the jury. There are no alternate jurors. One juror dies suddenly. This case must be disposed of:",back:"by the court declaring a mistrial and ordering a new trial",subject:"CPL",article:"CPL",statute:"CPL Art. 270"},
  {id:851,front:"CPL 270.40 Select the correct answer. In a criminal case, where the jury is permitted to separate before beginning their deliberations, the jurors, according to the CPL:",back:"may not converse with anyone about the case.",subject:"CPL",article:"CPL",statute:"CPL Art. 270"},
  {id:852,front:"CPL 270.50-3 Select the correct answer. When the court directs that a jury be brought to the place where an offense was allegedly committed, the purpose of such visit is:",back:"to permit visual observation by the Jury of the place in question",subject:"CPL",article:"CPL",statute:"CPL Art. 270"},
  {id:853,front:"CPL 300.50-1, 2 Select the correct answer. In charging a jury, a court finds reason to believe from the evidence that the defendant may have committed a lesser degree of the crime than what he is actually charged with. In this situation:",back:"the court must submit the lesser degree, if requested by either side to do so.",subject:"CPL",article:"CPL",statute:"CPL Art. 300"},
  {id:854,front:"CPL 310.20-1 Select the correct answer. In a criminal action, a letter has been referred to, but not received into evidence. During deliberation, the jury wishes to see the letter. The judge:",back:"cannot allow the jury to have the letter in the jury room under any circumstances",subject:"CPL",article:"CPL",statute:"CPL Art. 310"},
  {id:855,front:"CPL 310.20-2 Select the correct answer. When a jury retires to deliberate, they may take with them a list of the offenses submitted for their consideration, and the possible verdicts thereon, prepared by:",back:"the court",subject:"CPL",article:"CPL",statute:"CPL Art. 310"},
  {id:856,front:"CPL 310.30 Select the correct answer. When a deliberating jury requests further instruction or information, they must be returned to the courtroom and:",back:"as between the parties, only the defendant must be present",subject:"CPL",article:"CPL",statute:"CPL Art. 310"},
  {id:857,front:"CPL 310.80 Select the correct answer as to polling a jury.",back:"Polling is required on request of either side",subject:"CPL",article:"CPL",statute:"CPL Art. 310"},
  {id:858,front:"CPL 320.10-1 Select the correct answer. When a non-jury trial is permissible, the choice between a jury trial and a non-jury trial is made by:",back:"the defendant",subject:"CPL",article:"CPL",statute:"CPL Art. 320"},
  {id:859,front:"CPL 320.10 Select the correct answer. In the trial of an indictment, all trials may be non-jury trials:",back:"except for murder first degree",subject:"CPL",article:"CPL",statute:"CPL Art. 320"},
  {id:860,front:"CPL 320.20 Select the correct answer. In the non-jury trial of an indictment:",back:"either side, or both, may give both an opening address and a summation",subject:"CPL",article:"CPL",statute:"CPL Art. 320"},
  {id:861,front:"CPL 330.20-l(f) Select the correct statement concerning a commitment order.",back:"A commitment order is effective for six months",subject:"CPL",article:"CPL",statute:"CPL Art. 330"},
  {id:862,front:"CPL 330.20-l(o) An order of conditions means an order directing a defendant to",back:"all of the above.",subject:"CPL",article:"CPL Art. 330",statute:"CPL 330.20-l(o"},
  {id:863,front:"CPL 330.20-11 Select the correct statement concerning the transfer of a person confined to a secure facility by court order following a plea or verdict of not responsible by reason of mental disease or defect, to a non-secure facility.",back:"This transfer requires court approval.",subject:"CPL",article:"CPL",statute:"CPL Art. 330"},
  {id:864,front:"CPL 330.30 Select the correct answer. Which one of the following is the time limited to set aside or modify a verdict in a criminal action?",back:"Any time before sentence",subject:"CPL",article:"CPL",statute:"CPL Art. 330"},
  {id:865,front:"CPL 330.30, 330.40 Select the correct statement concerning a motion to set aside a verdict.",back:"CPL provides only for motions made by defendant",subject:"CPL",article:"CPL",statute:"CPL Art. 330"},
  {id:866,front:"CPL 340.20 Select the correct answer. A plea to an information against a corporation must be entered by:",back:"its counsel.",subject:"CPL",article:"CPL",statute:"CPL Art. 340"},
  {id:867,front:"CPL 340.20-2(a) Select the correct answer. A defendant is charged in an information with a misdemeanor. The defendant:",back:"may waive his right to enter a plea in person, subject to the court's approval",subject:"CPL",article:"CPL",statute:"CPL Art. 340"},
  {id:868,front:"CPL 340.30 Select the correct answer. CPL provisions concerning pre-trial notice to the people by a defendant under indictment in a superior court who intends to use alibi or mental disease as a defense:",back:"apply equally to a prosecution by information in a local criminal court",subject:"CPL",article:"CPL",statute:"CPL Art. 340"},
  {id:869,front:"CPL 340.40 Select the correct statement as to jury trials in non-felony cases.",back:"In all class A misdemeanor cases there is a right to a jury trial.",subject:"CPL",article:"CPL",statute:"CPL Art. 340"},
  {id:870,front:"CPL 350.10 Select the correct statement as to a non-jury trial of an information.",back:"The court's determination as to guilt is called a verdict",subject:"CPL",article:"CPL",statute:"CPL Art. 350"},
  {id:871,front:"CPL 360.10 Select the correct answer. A trial jury in a local criminal court consists of ________ jurors, not including alternate jurors,",back:"six",subject:"CPL",article:"CPL",statute:"CPL Art. 360"},
  {id:872,front:"CPL 360.15 Select the correct statement concerning a challenge to the jury panel in the trial of an information:",back:"The challenge may be made only by the defendant.",subject:"CPL",article:"CPL",statute:"CPL Art. 360"},
  {id:873,front:"CPL 360.20 If no challenge is made to the panel of prospective jurors, the court must direct how many names of the panel to be drawn and called?",back:"not less than 6 members",subject:"CPL",article:"CPL Art. 360",statute:"CPL 360.20"},
  {id:874,front:"CPL 360.30 Select the correct statement as to peremptory challenges in a jury trial in a local criminal court:",back:"Each side is allowed three challenges",subject:"CPL",article:"CPL",statute:"CPL Art. 360"},
  {id:875,front:"CPL 380.20 Select the correct statement concerning the imposition of sentence:",back:"The court must sentence defendant on each count on which he was convicted",subject:"CPL",article:"CPL",statute:"CPL Art. 380"},
  {id:876,front:"CPL 380.60 Select the correct answer. Which one of the following papers is authority for the execution of sentence?",back:"Certificate of conviction.",subject:"CPL",article:"CPL",statute:"CPL Art. 380"},
  {id:877,front:"CPL 380.85 Whenever a person who is a licensed physician is sentenced for a crime, the sentencing court must deliver a copy of the certificate of conviction and provide notification of the conviction and sentence to:",back:"the office of professional medical conduct",subject:"CPL",article:"CPL",statute:"CPL Art. 380"},
  {id:878,front:"CPL 390.20-2 Select the correct answer. In the case of a misdemeanor conviction where there is no presentence report, a judge may impose which one of the following sentences?",back:"Sixty days imprisonment",subject:"CPL",article:"CPL",statute:"CPL Art. 390"},
  {id:879,front:"CPL 390.20-3 Select the correct answer. For the purpose of sentencing, the court may order a presentence investigation and report:",back:"in any case",subject:"CPL",article:"CPL",statute:"CPL Art. 390"},
  {id:880,front:"CPL 390.40 Select the correct statement concerning pre-sentence reports to a court:",back:"Both defendant and the people may file pre-sentence memoranda with the court",subject:"CPL",article:"CPL",statute:"CPL Art. 390"},
  {id:881,front:"CPL 410.20 Select the correct answer. When a defendant is sentenced to probation or conditional discharge, the court specifies conditions to be complied with by the defendant. During the period of the sentence, these conditions:",back:"may be increased, relaxed or eliminated.",subject:"CPL",article:"CPL",statute:"CPL Art. 410"},
  {id:882,front:"CPL 410.40-1 Select the correct answer. If the court has ordered a person who is on probation to appear before it, failure to appear without reasonable cause:",back:"constitutes a violation of the conditions of the sentence",subject:"CPL",article:"CPL",statute:"CPL Art. 410"},
  {id:883,front:"CPL 420.05 Select the correct answer. When a fine is imposed as a sentence, it may be paid:",back:"by credit card, for any offense",subject:"CPL",article:"CPL",statute:"CPL Art. 420"},
  {id:884,front:"CPL 420.30 Which of the following may be subject to remission?",back:"a fine",subject:"CPL",article:"CPL Art. 420",statute:"CPL 420.30"},
  {id:885,front:"CPL 430.10 Select the correct statement concerning a change, suspension or interruption of a sentence imposed according to law for a term of imprisonment once the period of imprisonment has commenced.",back:"The sentence may not be changed, suspended or interrupted",subject:"CPL",article:"CPL",statute:"CPL Art. 430"},
  {id:886,front:"CPL 430.20-3 Select the correct answer. In the case of a definite sentence of imprisonment by a New York City court, the defendant must be committed to the custody of the:",back:"City Department of Correction",subject:"CPL",article:"CPL",statute:"CPL Art. 430"},
  {id:887,front:"CPL 430.30 Select the correct answer. In counties outside New York City which do not have a Commissioner of Correction, the responsibility for delivering sentenced defendants to the proper institution for commitment is on the:",back:"county sheriff",subject:"CPL",article:"CPL",statute:"CPL Art. 430"},
  {id:888,front:"CPL 440.20 Select the correct answer. After the entry of a judgment, the court in which it was entered may set aside the sentence on the ground that it was invalid as a matter of law:",back:"at any time, upon the motion of the defendant",subject:"CPL",article:"CPL",statute:"CPL Art. 440"},
  {id:889,front:"CPL 440.40 Select the correct answer. A motion by the people to set aside a sentence:",back:"may be considered by a trial court",subject:"CPL",article:"CPL",statute:"CPL Art. 440"},
  {id:890,front:"CPL 500.10(1) Under CPL 500.10, a defendant should now be referred to as the:",back:"principal;",subject:"CPL",article:"CPL",statute:"CPL Art. 500"},
  {id:891,front:"(New, 2023) CPL 500.10(5) In issuing a \"securing order,\" the court can:",back:"Any or all of the above.",subject:"CPL",article:"CPL",statute:"CPL Art. 500"},
  {id:892,front:"CPL 500.10-12 Select the correct answer. A surety is:",back:"an obligor who is not a principal",subject:"CPL",article:"CPL",statute:"CPL Art. 500"},
  {id:893,front:"CPL 500.10-18 Select the correct answer. A partially secured bail bond is secured only by money not exceeding a percentage of the total amount of the undertaking. The percentage is:",back:"ten",subject:"CPL",article:"CPL",statute:"CPL Art. 500"},
  {id:894,front:"CPL 510.10(4)(u) For the purposes of assessing bail on a defendant, a charge of Criminal Possession of a Weapon in the third degree, Penal Law 265.02(3),or Criminal Sale of a Firearm to a Minor, Penal Law 265.16, are:",back:"qualifying offenses without other requirements;",subject:"CPL",article:"CPL",statute:"CPL Art. 510"},
  {id:895,front:"CPL 510.20 Select the correct answer. An application for bail may be made:",back:"at any time defendant is in custody pursuant to court order.",subject:"CPL",article:"CPL",statute:"CPL Art. 510"},
  {id:896,front:"CPL 510.30-2 Select the correct statement concerning bail for a defendant whose pending appeal is obviously without merit.",back:"Denial of bail is justified on this sole ground",subject:"CPL",article:"CPL",statute:"CPL Art. 510"},
  {id:897,front:"CPL 520.10-1 Select the correct answer. Bail may be posted by credit card for:",back:"any case in which bail is authorized and ordered",subject:"CPL",article:"CPL Art. 520",statute:"CPL 520.10"},
  {id:898,front:"CPL 520.20-3 Select the correct answer. A bail bond is effective and binding:",back:"until sentence is imposed or other termination of the action.",subject:"CPL",article:"CPL",statute:"CPL Art. 520"},
  {id:899,front:"CPL 520.20-4 Select the correct answer. An indemnitor on a bail bond is:",back:"liable only to the surety",subject:"CPL",article:"CPL",statute:"CPL Art. 520"},
  {id:900,front:"CPL 530.40-1, 3 and 4 Select the correct statement concerning bail or recognizance in a superior court.",back:"Bail or recognizance is not available after conviction for a class A felony",subject:"CPL",article:"CPL",statute:"CPL Art. 530"},
  {id:901,front:"CPL 530.50 Select the correct answer. An order of recognizance or bail pending determination of an appeal may be reviewed by an appropriate judge:",back:"except for class A felony cases and certain felony sex offenses against minors.",subject:"CPL",article:"CPL",statute:"CPL Art. 530"},
  {id:902,front:"CPL 720.15-2 Select the correct answer. Generally, when a youth is initially arraigned upon an accusatory instrument, the arraignment and all proceedings thereafter:",back:"may, in the court's discretion, be conducted in private, with defendant's consent",subject:"CPL",article:"CPL",statute:"CPL Art. 720"},
  {id:903,front:"CPL 720.20-1 Select the correct answer. The determination of whether an eligible youth is a youthful offender is made:",back:"at sentencing",subject:"CPL",article:"CPL",statute:"CPL Art. 720"},
  {id:904,front:"CPL 722.00(4)&(5) Statements made by the juvenile or adolescent offender to a probation officer are:",back:"are not to be disclosed to the youth part or the district attorney",subject:"CPL",article:"CPL",statute:"CPL Art. 722"},
  {id:905,front:"CPL 722.20(6) Which are the conditions precedent to the youth part removing a felony charge against a juvenile offender to family court?",back:"Both a and b, above",subject:"CPL",article:"CPL",statute:"CPL Art. 722"},
  {id:906,front:"CPL 722.21(3)(a) If the youth part holds a hearing upon a felony complaint against an adolescent offender and there is reasonable cause to believe that the defendant committed a felony, the youth part:",back:"must order that the defendant be held for the action of a grand jury",subject:"CPL",article:"CPL",statute:"CPL Art. 722"},
  {id:907,front:"CPL 722.21(6) Which are the conditions precedent to the youth part removing a felony charge against an adolescent offender to family court?",back:"Both a and b, above",subject:"CPL",article:"CPL",statute:"CPL Art. 722"},
  {id:908,front:"CPL 722.23(1)(e) If a hearing is held to remove a adolescent offender to family court, the court shall make a determination in writing or on the record. Such determination shall include:",back:"findings of fact and to the extent practicable conclusions of law",subject:"CPL",article:"CPL",statute:"CPL Art. 722"},
  {id:909,front:"CPL 722.23(2)(e) Where all parties agree to a removal of an adolescent offender case to family court, the youth part:",back:"may order the removal to family court",subject:"CPL",article:"CPL",statute:"CPL Art. 722"},
  {id:910,front:"CPL 722.24 ## Article 722 of the criminal procedure law, as it affects actions and matters involving juvenile offenders or adolescent offenders, applies to:",back:"Both a and b",subject:"CPL",article:"CPL",statute:"CPL Art. 722"},
  {id:911,front:"FCA 153-a According to the family court act, a warrant of arrest may be executed:",back:"on any day of the week.",subject:"FCA",article:"FCA Art. 1",statute:"FCA 153-"},
  {id:912,front:"FCA 153-a (b),(c),(d),(e) In order to effect an arrest pursuant to a Family Court warrant, a police officer:",back:"may use such physical force as justifiable pursuant to section 35.30 of the penal law.",subject:"FCA",article:"FCA Art. 1",statute:"FCA 153-"},
  {id:913,front:"FCA 154 (a),(c) Which of the following is correct regarding the process of the family court?",back:"process may be sent into any county in the state.",subject:"FCA",article:"FCA Art. 1",statute:"FCA 154 (a),(c)"},
  {id:914,front:"FCA 154-c Any order of protection or temporary order of protection issued under articles three, four, five, six, seven, eight, ten and ten-A of the Family Court Act:",back:"shall plainly state the date that such order expires.",subject:"FCA",article:"FCA Art. 1",statute:"FCA 154-"},
  {id:915,front:"FCA 158 (b) The family court may place in protective custody a person under the age 16 years who is a material witness, as provided by law. No order of protective custody may extend for a period of more than how many days?",back:"14 days",subject:"FCA",article:"FCA Art. 1",statute:"FCA 158 (b)"},
  {id:916,front:"FCA 114 The family court has no appellate jurisdiction.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 1"},
  {id:917,front:"FCA 115 (f) The family court has jurisdiction to suspend the driving privileges of persons who are delinquent in their child or combined child and spousal support.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 1"},
  {id:918,front:"FCA 117 (a), (b) There is established in the family court a \"child abuse part\" to be held separate and apart from all other proceedings.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 1"},
  {id:919,front:"FCA 134 In order to serve in the office of family court judge a person must be admitted to the practice of law in New York State for at least 10 years as of the date he or she commences the duties of the office of judge.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 10"},
  {id:920,front:"FCA 153-b The summons and petition and, if one has been issued, the temporary order of protection or a copy or copies thereof may be served on any day of the week between the hours of 8 a.m. and 5 p.m.",back:"False",subject:"FCA",article:"FCA Art. 1",statute:"FCA 153-"},
  {id:921,front:"FCA 169 A court order or temporary order of protection issued under Article 3, 4, 5, 6, 7, 8 or 10 shall be translated in writing into the appropriate language for a party to a proceeding when requested.",back:"False",subject:"FCA",article:"FCA Art. 1",statute:"FCA 169"},
  {id:922,front:"FCA 155 If an adult respondent is arrested under this act when the family court is not in session he or she shall be detained until the court resumes at its next scheduled session.",back:"False",subject:"FCA",article:"FCA Art. 1",statute:"FCA 155"},
  {id:923,front:"FCA 156 The provision of the judiciary law relating to civil contempt only shall apply to the family court.",back:"False",subject:"FCA",article:"FCA Art. 1",statute:"FCA 156"},
  {id:924,front:"FCA 168 1.,2. In any case where an order of protection or temporary order of protection has been made by the family court, the clerk of the court shall issue a copy of such order to the petitioner and the respondent.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 10"},
  {id:925,front:"FCA 174 The family court in a county shall transfer a proceeding to a county where the proceeding might have been originated when it is determined that venue has been placed in the wrong county.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 10"},
  {id:926,front:"FCA 176 Where a person placed on probation resides in another jurisdiction within the state at the time of the order of disposition, the family court which placed him or her on probation shall retain supervision of such person.",back:"False",subject:"FCA",article:"FCA Art. 1",statute:"FCA 176"},
  {id:927,front:"FCA 214 Administrative forms for use in the family court shall be promulgated by:",back:"the chief administrator of the courts.",subject:"FCA",article:"FCA Art. 2",statute:"FCA 214"},
  {id:928,front:"FCA 214(f) Papers and documents which are electronically filed in the family court:",back:"are not available for public inspection online.",subject:"FCA",article:"FCA Art. 2",statute:"FCA 214(f)"},
  {id:929,front:"FCA 217 The court shall file or direct the filing of an order within how many days of the decision of the court?",back:"20 days",subject:"FCA",article:"FCA Art. 2",statute:"FCA 217"},
  {id:930,front:"FCA 242 Under the family court act the term \"attorney for the child\" refers to:",back:"an attorney admitted to practice in New York state.",subject:"FCA",article:"FCA Art. 2",statute:"FCA 242"},
  {id:931,front:"FCA 249(b) In making an appointment of an attorney for a child in a proceeding under articles three, seven, ten, ten-A or ten-C of the FCA, the court to the extent practicable and appropriate shall:",back:"Chief administrator of the courts",subject:"FCA",article:"FCA Art. 2",statute:"FCA 249(b)"},
  {id:932,front:"FCA 254 (b) In all cases involving abuse, the corporation counsel of the city of New York and outside of the city of New York, the appropriate county attorney shall be a necessary party to the proceeding.",back:"False",subject:"FCA",article:"FCA Art. 2",statute:"FCA 254 (b)"},
  {id:933,front:"FCA 262 In a proceeding under Article 10-C Re: Destitute Children, a \"parent\" or \"caretaker\" does not have the right to the assistance of counsel.",back:"False",subject:"FCA",article:"FCA Art. 2",statute:"FCA 262 (a)"},
  {id:934,front:"FCA 262 Both the respondent and the petitioner in any family offense proceeding have the right to counsel assigned by the court when financially unable to obtain same.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 2"},
  {id:935,front:"FCA 301.2 1. Select the least correct statement. A Juvenile Delinquent under Article 3 of the Family Court Act is a person:",back:"Who is not criminally responsible by reason of infancy.",subject:"FCA",article:"FCA Art. 3",statute:"FCA 301.2"},
  {id:936,front:"FCA 301.2 12. Which of the following may originate a juvenile delinquency proceeding:",back:"a presentment agency",subject:"FCA",article:"FCA Art. 3",statute:"FCA 301.2"},
  {id:937,front:"FCA 302.1/2 In determining the jurisdiction of the court over an alleged juvenile delinquent, which of the following is the controlling time factor?",back:"at the time the delinquent act allegedly was committed",subject:"FCA",article:"FCA Art. 3",statute:"FCA 302.1/2"},
  {id:938,front:"FCA 304.1(3) True or False: The detention of a child under 13 years of age in a secure detention facility, shall not be directed under any provisions of Article 3.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 3"},
  {id:939,front:"FCA 307.1 2. If the crime alleged to have been committed by a child is a designated felony under FCA 301.2, the return date of the family court appearance ticket shall be:",back:"72 hours excluding Saturdays, Sundays and public holidays.",subject:"FCA",article:"FCA Art. 3",statute:"FCA 307.1"},
  {id:940,front:"FCA 308.1 9. Efforts at adjustment in a juvenile delinquency case by the probation service may not extend for what period of time without leave of the court?",back:"3 months",subject:"FCA",article:"FCA Art. 3",statute:"FCA 308.1"},
  {id:941,front:"FCA 311.3 When two or more respondents are charged in separate petitions with the same crime or crimes the court shall conduct:",back:"a single or a consolidated fact finding hearing.",subject:"FCA",article:"FCA Art. 3",statute:"FCA 311.3"},
  {id:942,front:"FCA 312.1 Service of a summons and petition shall be made by delivery of a true copy thereof to the person summoned at least how many hours before the time stated in the summons for appearance?",back:"24 hours",subject:"FCA",article:"FCA Art. 3",statute:"FCA 312.1"},
  {id:943,front:"FCA 315.3 An adjournment in contemplation of dismissal (ACD) may not exceed which period of time?",back:"6 months",subject:"FCA",article:"FCA Art. 3",statute:"FCA 315.3"},
  {id:944,front:"FCA 320.2/320.3 Which of the following is least correct regarding the initial appearance of an alleged juvenile delinquent?",back:"the court may appoint an attorney to represent the respondent.",subject:"FCA",article:"FCA Art. 3",statute:"FCA 320.2/320.3"},
  {id:945,front:"FCA 325.1 The probable cause hearing in a juvenile delinquency proceeding may be adjourned for good cause shown, for how many court days?",back:"3 court days",subject:"FCA",article:"FCA Art. 3",statute:"FCA 325.1"},
  {id:946,front:"FCA 330.1 3. A request for a bill of particulars by a respondent shall be timely if made within how many days after the conclusion of the initial appearance?",back:"30 days",subject:"FCA",article:"FCA Art. 3",statute:"FCA 330.1"},
  {id:947,front:"FCA 331.7 2. If the respondent is not in detention, a demand to produce discoverable material by a party shall be made within how many days after the initial appearance?",back:"15 days",subject:"FCA",article:"FCA",statute:"FCA Art. 3"},
  {id:948,front:"FCA 342.1 Which of the following is least correct as to the order of procedure at the fact finding hearing?",back:"respondent must offer evidence in his defense.",subject:"FCA",article:"FCA Art. 3",statute:"FCA 342.1"},
  {id:949,front:"FCA 310.1 & 254-a A proceeding to adjudicate a person a juvenile delinquent is originated by a presentment agency.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 3"},
  {id:950,front:"FCA 320.5 At the initial appearance of the respondent, the court may release the respondent or direct his or her detention.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 3"},
  {id:951,front:"FCA 325.2 Only non-hearsay evidence shall be admissible at the probable cause hearing to demonstrate reasonable cause to believe that the respondent committed a crime.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 3"},
  {id:952,front:"FCA 325.2 4. The probable cause hearing should be completed in one day.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 3"},
  {id:953,front:"FCA 330.1 If the respondent is detained, the court may direct the filing of the bill of particulars on an expedited basis.",back:"False",subject:"FCA",article:"FCA Art. 3",statute:"FCA 330.1"},
  {id:954,front:"FCA 344.2 4. A child may not be found to be delinquent based on commission of any crime solely upon evidence of a commission or admission made without additional proof that the crime charged has been committed.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 3"},
  {id:955,front:"FCA 330.1 5. A bill of particulars can be obtained only by court order.",back:"False",subject:"FCA",article:"FCA Art. 3",statute:"FCA 330.1"},
  {id:956,front:"FCA 330 1.(a) A bill of particulars is a tool of, and a method of discovery.",back:"False",subject:"FCA",article:"FCA Art. 3",statute:"FCA 330.1"},
  {id:957,front:"FCA 332.1 A respondent may move to dismiss the petition or any count thereof on the ground that the proceeding is barred by FCA 303.2 which applies article 40 of the CPL-double jeopardy.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 3"},
  {id:958,front:"FCA 340.2 The judge who presides at the fact finding hearing shall also preside at the dispositional hearing.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 3"},
  {id:959,front:"FCA 342.2 2. The standard of proof in a fact finding hearing is proof beyond a reasonable doubt.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 3"},
  {id:960,front:"FCA 340.2,3(a)&(c) The rules of the Family Court shall provide for the assignment of the Juvenile Delinquency Proceedings to another judge of the court because it is not practicable for the appropriate judge to preside.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 3"},
  {id:961,front:"FCA 350.1 3. The court may adjourn the dispositional hearing:",back:"on the motion of the presentment agency for good cause shown for not more than 10 days.",subject:"FCA",article:"FCA Art. 3",statute:"FCA 350.1"},
  {id:962,front:"FCA 353.1 3. At the conclusion of the dispositional hearing the court enters a disposition of conditional discharge, the maximum period of which shall not exceed:",back:"1 year",subject:"FCA",article:"FCA Art. 3",statute:"FCA 353.1"},
  {id:963,front:"FCA 353.2 6. The maximum period of probation ordered by the court shall not exceed:",back:"two years",subject:"FCA",article:"FCA Art. 3",statute:"FCA 353.2"},
  {id:964,front:"FCA 353.6 Restitution in conjunction with a disposition of probation, conditional discharge or placement may be ordered when the respondent is over the age of:",back:"to be determined by the court",subject:"FCA",article:"FCA Art. 3",statute:"FCA 353.6"},
  {id:965,front:"FCA 355.3 1. A petition to the court by the commissioner of social services, or the office of children and family services or the person with whom the respondent has been placed, to extend such placement shall be filed:",back:"60 days prior to the expiration of the period of placement.",subject:"FCA",article:"FCA Art. 3",statute:"FCA 355.3"},
  {id:966,front:"FCA 360.2 1.,2. Which of the following statements is least correct regarding a petition of violation of probation?",back:"hearsay allegations may support the violation charged.",subject:"FCA",article:"FCA Art. 3",statute:"FCA 360.2"},
  {id:967,front:"FCA 360.1 Which of the following is least correct with respect to post-dispositional procedures whereby the respondent is placed on probation?",back:"a police officer shall not assist in the execution of any search order.",subject:"FCA",article:"FCA Art. 3",statute:"FCA 360.1"},
  {id:968,front:"FCA 352.1 At the conclusion of the dispositional hearing, if the court finds that the respondent does not require confinement, treatment or supervision, it shall dismiss the petition.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 3"},
  {id:969,front:"FCA 352.2(b) At the conclusion of the dispositional hearing the court may order continued placement of the respondent in his or her home.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 3"},
  {id:970,front:"FCA 352.3(1) Under an order of protection a respondent may be required to refrain from intentionally injuring or killing any companion animal owned or possessed by the petitioner.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 3"},
  {id:971,front:"FCA 352.3 2. An order of protection issued by the court shall not exceed the period of time specified in any order of disposition.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 3"},
  {id:972,front:"FCA 353.2 5. A copy of the conditions of probation may not be filed with or become a part of the record of the juvenile delinquency case.",back:"False",subject:"FCA",article:"FCA Art. 3",statute:"FCA 353.2"},
  {id:973,front:"FCA 353.5 3. The court may order restrictive placement in any case where the respondent committed a designated felony act in which the respondent inflicted serious physical injury upon a person who is 62 years of age or older.",back:"False",subject:"FCA",article:"FCA Art. 3",statute:"FCA 353.5"},
  {id:974,front:"FCA 353.6 At the conclusion of the dispositional hearing involving a respondent over ten years of age, the court may recommend restitution in an amount not to exceed $500.00.",back:"False",subject:"FCA",article:"FCA Art. 3",statute:"FCA 353.6"},
  {id:975,front:"FCA 380.1 An adjudication in a juvenile delinquency case may not be denominated a criminal conviction nor can a person adjudicated a juvenile delinquent be denominated a criminal.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 3"},
  {id:976,front:"FCA 380.1(3) Except where required by statute, no person shall be required to divulge information pertaining to the arrest of the respondent or any subsequent proceeding.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 3"},
  {id:977,front:"FCA 712 (a) A person in need of supervision (PINS) is:",back:"a person less than 18 years of age",subject:"FCA",article:"FCA Art. 7",statute:"FCA 712 (a)"},
  {id:978,front:"FCA 716 On its own motion the court may substitute which petition for a person in need of supervision petition?",back:"child neglect",subject:"FCA",article:"FCA Art. 7",statute:"FCA 716"},
  {id:979,front:"FCA 717 The venue of a PINS proceeding shall be:",back:"in the county where the alleged act or acts occurred.",subject:"FCA",article:"FCA Art. 7",statute:"FCA 717"},
