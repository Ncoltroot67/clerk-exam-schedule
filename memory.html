  {id:980,front:"FCA 732 (a) (ii) A proceeding to adjudicate a person to be in need of supervision is originated by filing a petition alleging that the respondent was under eighteen years of age:",back:"at the time of the specified acts",subject:"FCA",article:"FCA Art. 7",statute:"FCA 732(a) (ii)"},
  {id:981,front:"FCA 735 (a), (b) With respect to the preliminary procedure diversion services, which of the following may be designated the lead agency? (1) Probation Service (2) County Attorney (3) Social Service (4) State Department of Youth",back:"1 & 3 only",subject:"FCA",article:"FCA Art. 7",statute:"FCA 735(a), (b)"},
  {id:982,front:"FCA 735 (c) Which of the following statements is incorrect with respect to a person or agency seeking to file a petition that does not have the required documentation attached thereto:",back:"the clerk of the court may then accept the petition for filing.",subject:"FCA",article:"FCA Art. 7",statute:"FCA 735(c)"},
  {id:983,front:"FCA 737 (a) Service of a summons and petition shall be made within what time before the time stated for appearance?",back:"24 hours",subject:"FCA",article:"FCA Art. 7",statute:"FCA 737 (a)"},
  {id:984,front:"FCA 742(b) True or False: Regarding a petition filed in a diversion proceeding, the court shall review any termination of services at the initial appearance of the respondent.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 7"},
  {id:985,front:"FCA 755 (b) The maximum duration of a suspended judgment of a person in need of supervision is:",back:"1 year",subject:"FCA",article:"FCA Art. 7",statute:"FCA 755 (b)"},
  {id:986,front:"FCA 756 (b) Placement of a person adjudicated a PINS may be in the child's own home or in the custody of a suitable relative or other suitable private person or a commissioner of social services. Placement with social services may be for:",back:"an initial period of up to 60 days",subject:"FCA",article:"FCA Art. 7",statute:"FCA 756(b)"},
  {id:987,front:"FCA 756-a (d) An extension of placement of a person adjudicated a PINS may not be for:",back:"more than six months",subject:"FCA",article:"FCA Art. 7",statute:"FCA 756-"},
  {id:988,front:"FCA 782-a When placing a person in need of supervision with an authorized agency the family court shall transmit: (1) the fact finding record. (2) disposition. (3) probation report. (4) diagnostic reports.",back:"1,2,3 & 4",subject:"FCA",article:"FCA Art. 7",statute:"FCA 782-"},
  {id:989,front:"FCA 712 (a) One of the standards of a person in need of supervision is that he or she is habitually disobedient.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 7"},
  {id:990,front:"FCA 712 (f) A permanency hearing is held for the purpose of reviewing the foster care status of a respondent and the appropriateness of the permanency plan developed by the social service official on behalf of such respondent.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 7"},
  {id:991,front:"FCA 712 (c) The fact finding hearing is held to determine whether a respondent requires supervision or treatment.",back:"False",subject:"FCA",article:"FCA Art. 7",statute:"FCA 712 (c)"},
  {id:992,front:"FCA 712 (g) Diversion services is a preliminary procedure designed to avoid the need to file a petition or direct the detention of a child.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 7"},
  {id:993,front:"FCA 713 The family court has concurrent jurisdiction with the criminal court over any proceeding involving a person in need of supervision.",back:"False",subject:"FCA",article:"FCA Art. 7",statute:"FCA 713"},
  {id:994,front:"FCA 714 In determining jurisdiction, the age of the respondent at the time the need for supervision allegedly arose is controlling.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 7"},
  {id:995,front:"FCA 717 Proceedings regarding whether a person is in need of supervision are originated in the county where the subject resides.",back:"False",subject:"FCA",article:"FCA Art. 7",statute:"FCA 717"},
  {id:996,front:"FCA 720 1. No child shall be detained in any lockup used for adults convicted of a crime.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 7"},
  {id:997,front:"FCA 733 (e) The presentment agency may consent to substitute a petition alleging a person in need of supervision for a petition alleging a person to be a juvenile delinquent.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 7"},
  {id:998,front:"FCA 739 (b) When a respondent is detained, the court must order a probable cause hearing.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 7"},
  {id:999,front:"FCA 743 (a) Before accepting an admission, the court shall advise the respondent of his or her right to a fact-finding hearing.",back:"False",subject:"FCA",article:"FCA Art. 7",statute:"FCA 734 (a)"},
  {id:1000,front:"FCA 735 (f) Efforts to prevent the filing of a petition by the diversion service lead agency may not extend for more than a period of 90 days without the leave of the court.",back:"False",subject:"FCA",article:"FCA Art. 7",statute:"FCA 735 (f)"},
  {id:1001,front:"FCA 737 (b) If personal service of a summons cannot be made after reasonable effort, the court may order substituted service as provided in civil process.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 7"},
  {id:1002,front:"FCA 740 (b) A temporary order of protection is not a finding of wrongdoing.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 7"},
  {id:1003,front:"FCA 741 (b) The general public may be excluded from an initial appearance proceeding.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 7"},

  {id:1005,front:"FCA 749 (a) An adjournment in contemplation of dismissal (ACD) ordered by the court may not exceed six months.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 7"},

  {id:1007,front:"FCA 757 (b) The maximum period of probation under FCA article 7 shall not exceed 2 years.",back:"False",subject:"FCA",article:"FCA Art. 7",statute:"FCA 757 (b)"},
  {id:1008,front:"FCA 758-a Restitution in the amount not to exceed $1,000.00 may be ordered by the court involving repair or damage caused by the respondent who is over 10 years of age and less than 16 years of age.",back:"False",subject:"FCA",article:"FCA Art. 7",statute:"FCA 758-"},
  {id:1009,front:"FCA 759(h) An order of protection, where applicable, may require the respondent to refrain from intentionally injuring or killing, without justification, certain animals.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 7"},

  {id:1013,front:"FCA 812 2.(d) The proceeding for a family offense is initiated:",back:"at the time of filing a petition",subject:"FCA",article:"FCA Art. 8",statute:"FCA 812"},
  {id:1014,front:"FCA 813 1. The court on its own initiative, may transfer a family offense matter to an appropriate criminal court:",back:"with the consent of the petitioner and notice to the district attorney",subject:"FCA",article:"FCA Art. 8",statute:"FCA 813"},

  {id:1018,front:"FCA 821-a 4. A respondent held in custody pending a hearing in the family court can be held no longer than what period of time after the arrest if arrested on a Saturday, Sunday or legal holiday?",back:"144 hours",subject:"FCA",article:"FCA Art. 8",statute:"FCA 821-"},
  {id:1019,front:"FCA 823 (c) Efforts by the probation service at adjustment under article 8 may not extend for more than what period of time without leave of the court?",back:"2 months",subject:"FCA",article:"FCA Art. 8",statute:"FCA 823 (c)"},
  {id:1020,front:"FCA 826 In the absence of a warrant issued by the court for the production of the respondent, service of a summons and petition shall be made upon the person summoned how many hours before the time stated therein for appearance?",back:"24 hours",subject:"FCA",article:"FCA Art. 8",statute:"FCA 826"},
  {id:1021,front:"FCA 827 (c) A certificate of a warrant expires how many days from the date of issue?",back:"90 days",subject:"FCA",article:"FCA Art. 8",statute:"FCA 827 (c)"},

  {id:1024,front:"FCA 841 (c) The court may enter an order at the conclusion of the dispositional hearing placing the respondent on probation for a period:",back:"not to exceed one year",subject:"FCA",article:"FCA Art. 8",statute:"FCA 841 (c)"},
  {id:1025,front:"FCA 841 (e) An order of restitution may be made by the court in conjunction with the court ordered disposition of, suspended judgment, probation or order of protection, in an amount not to exceed:",back:"$10,000",subject:"FCA",article:"FCA Art. 8",statute:"FCA 841 (e)"},
  {id:1026,front:"FCA 842 Upon a finding by the court that aggravating circumstances exist, the order of protection shall be for a period not in excess of:",back:"five years",subject:"FCA",article:"FCA Art. 8",statute:"FCA 842"},
  {id:1027,front:"FCA 812 1. (e) Members of the same family or household for the purposes of this article shall mean persons who are not related and who are or have been in an intimate relationship.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 8"},
  {id:1028,front:"FCA 812 2.(g) A complainants election to proceed in the family court shall not divest the criminal court of jurisdiction to hear a family offense proceeding.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 8"},
  {id:1029,front:"FCA 812 2.(b) A family offense proceeding in the family court is a civil proceeding.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 8"},
  {id:1030,front:"FCA 813 2. Upon the transfer of a matter from the family court to the criminal court, the temporary order of protection issued by the family court must be reissued by the criminal court.",back:"False",subject:"FCA",article:"FCA Art. 8",statute:"FCA 813"},
  {id:1031,front:"FCA 813 3. A petitioner may proceed directly with a petition under article 8 FCA in either the family court or criminal court or both without court referral.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 8"},
  {id:1032,front:"FCA 821-a 3.(c) When a respondent is brought before the court pursuant to a summons or a warrant, the court shall provide the respondent with a copy of the petition.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 8"},

  {id:1035,front:"FCA 823 (d) The probation service is authorized to compel any person to appear at any conference, produce any papers or visit any place.",back:"False",subject:"FCA",article:"FCA Art. 8",statute:"FCA 823 (d)"},
  {id:1036,front:"FCA 824 Certain qualified statements made during a probation service preliminary conference may be admitted into evidence at a fact finding hearing.",back:"False",subject:"FCA",article:"FCA Art. 8",statute:"FCA 824"},
  {id:1037,front:"FCA 827 (b) The petitioner may serve a warrant upon the respondent without court permission.",back:"False",subject:"FCA",article:"FCA Art. 8",statute:"FCA 827"},
  {id:1038,front:"FCA 827 (c) A certificate of a warrant after expiration may only be renewed by the court.",back:"False",subject:"FCA",article:"FCA Art. 8",statute:"FCA 827 (c)"},
  {id:1039,front:"FCA 828 3. The court may issue or extend a temporary order of protection on ex parte application or on notice simultaneously with the issuance of a warrant.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 8"},
  {id:1040,front:"FCA 828 4. The court may together with a temporary order of protection, issue an order for temporary child support.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 8"},
  {id:1041,front:"FCA 828 5. The court may not consider issuance of an order for temporary spousal support when a temporary Order of Protection has not been issued and is pending before the court.",back:"False",subject:"FCA",article:"FCA Art. 8",statute:"FCA 828"},
  {id:1042,front:"FCA 834 Only competent, material and relevant evidence may be admitted at the fact finding hearing and the dispositional hearing.",back:"False",subject:"FCA",article:"FCA Art. 8",statute:"FCA 834"},
  {id:1043,front:"FCA 835 Upon the completion of the fact finding hearing and the required findings are made, the dispositional hearing may commence immediately.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 8"},
  {id:1044,front:"FCA 841 (c) At the conclusion of the dispositional hearing the court may, as a condition of probation, require the respondent to participate in a batterer's education program.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 8"},
  {id:1045,front:"FCA 841 (c) The cost of such programs as mentioned above in question #162, shall be paid by the state.",back:"False",subject:"FCA",article:"FCA Art. 8",statute:"FCA 841 (c)"},
  {id:1046,front:"FCA 842 An order of protection under article 8 FCA, may set forth reasonable conditions of behavior to be observed by the parties to the proceeding.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 8"},
  {id:1047,front:"FCA 844 The court may, after a hearing, reconsider an order of disposition other than one dismissing the petition.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 8"},
  {id:1048,front:"FCA 413 Parents are chargeable with the support of:",back:"a child under 21 years of age",subject:"FCA",article:"FCA Art. 4",statute:"FCA 413"},
  {id:1049,front:"FCA 413 1.(b)(3) Child support percentage based on a combined parental income for one child shall be:",back:"17 %",subject:"FCA",article:"FCA Art. 4",statute:"FCA 413"},
  {id:1050,front:"FCA 413 1.(b)(4) Combined parental income shall mean:",back:"the sum of the \"income\" of both parents.",subject:"FCA",article:"FCA Art. 4",statute:"FCA 413"},

  {id:1052,front:"FCA 413 1.(c)(5) Upon proof by either party that cash medical support would be unjust or inappropriate, the court shall:",back:"follow all or none of the above considerations",subject:"FCA",article:"FCA Art. 4",statute:"FCA 413"},

  {id:1054,front:"FCA 413-a 3. An objection to a cost of living adjustment shall be submitted to the court within how many days from the date of the mailing of the adjusted order?",back:"35 days",subject:"FCA",article:"FCA Art. 4",statute:"FCA 413-"},
  {id:1055,front:"FCA 413-a 3.(d) The court shall conduct the hearing and make its determination on an objection to a cost of living adjustment no later than how many days from the date it receives the objection?",back:"45 days",subject:"FCA",article:"FCA Art. 4",statute:"FCA 413-"},
  {id:1056,front:"FCA 418 (a) A rebuttable presumption of paternity shall be created by what percent of probability of paternity as a result of a genetic marker test or DNA test?",back:"95 %",subject:"FCA",article:"FCA Art. 4",statute:"FCA 418 (a)"},
  {id:1057,front:"FCA 421 Venue in proceedings to compel support may be originated:",back:"in the county of residence of any party",subject:"FCA",article:"FCA Art. 4",statute:"FCA 421"},

  {id:1060,front:"(New, 2026) FCA 425 An agreement for the support of the petitioner is not effective unless",back:"it is reduced to writing and submitted to the family court or a support magistrate",subject:"FCA",article:"FCA Art. 4",statute:"FCA 425"},
  {id:1061,front:"FCA 427 (a) - (c) Personal service of a summons and petition may be made by delivery of these papers to the person summoned at least how many days before the time stated therein for appearance?",back:"8 days",subject:"FCA",article:"FCA Art. 4",statute:"FCA 427"},
  {id:1062,front:"FCA 427 (b) Under Article 4 FCA, which of the following methods of service of a summons requires an order of the court?",back:"substituted service",subject:"FCA",article:"FCA Art. 4",statute:"FCA 427"},
  {id:1063,front:"FCA 428 A certificate of a warrant expires how many days after the date of issue?",back:"90 days",subject:"FCA",article:"FCA Art. 4",statute:"FCA 428"},

  {id:1072,front:"FCA 413 1.(c)(2) The court shall multiply the combined parental income up to $80,000 by the appropriate child support percentage to determine the basic child support obligation.",back:"False",subject:"FCA",article:"FCA Art. 4",statute:"FCA 413"},
  {id:1073,front:"FCA 413 1.(e) The court may allocate a portion of lottery winnings to child support.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 5-B"},

  {id:1075,front:"FCA 413 1.(g) Where the court finds that the non-custodial parent's pro rata share is unjust or inappropriate, the court shall order such parent to pay an amount the court finds just and appropriate.",back:"False",subject:"FCA",article:"FCA Art. 4",statute:"FCA 413"},
  {id:1076,front:"FCA 413 3.b.(6) If the court receives no specific written objections to an adjusted order of support, within 35 days of the mailing of the proposed order, the clerk of the court shall immediately issue the order without any further review.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 5-B"},
  {id:1077,front:"FCA 413 4. Any party to a child support order issued prior to September 15, 1989, on behalf of a child in receipt of public assistance may request a review of the order for a cost of living adjustment.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 5-B"},
  {id:1078,front:"FCA 413-a 3. An objection to a cost of living adjustment, as reflected in an adjusted order by the support collection unit, shall be submitted to the court within 45 days from the mailing date of the adjusted order.",back:"False",subject:"FCA",article:"FCA Art. 4",statute:"FCA 413-"},
  {id:1079,front:"FCA 417 A child born of parents prior to their entering into a ceremonial marriage shall not be deemed the legitimate child of both parents.",back:"False",subject:"FCA",article:"FCA Art. 4",statute:"FCA 417"},
  {id:1080,front:"FCA 418 (a) If the results of a DNA or genetic marker test indicate at least a 95% probability of paternity, the admission of such shall create a rebuttable presumption of paternity.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 5-B"},
  {id:1081,front:"FCA 424-a In all support proceedings in family court there shall be compulsory disclosure of their financial states by both parties. This requirement shall not apply to a social service official who is a party in a support proceeding.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 5-B"},
  {id:1082,front:"FCA 424-a Financial compulsory disclosure may be waived by the court.",back:"False",subject:"FCA",article:"FCA Art. 4",statute:"FCA 424-"},

  {id:1084,front:"FCA 425 An agreement by and between the petitioner and the respondent for support may only be approved by the court.",back:"False",subject:"FCA",article:"FCA Art. 4",statute:"FCA 425"},
  {id:1085,front:"FCA 428 (b) The petitioner may not serve a warrant on the respondent unless the court grants permission upon application of the petitioner.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 5-B"},
  {id:1086,front:"FCA 428 (d) The family court rules shall provide that a record of all unserved warrants be kept and periodic reports of unserved warrants be made.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 5-B"},
  {id:1087,front:"FCA 429 Should income and profits from sequestered property be insufficient to pay sums of money required, the court may direct the mortgage or sale of such real estate to pay such sums.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 5-B"},
  {id:1088,front:"FCA 433 (a) If the initial return of a summons or a warrant is before a judge of the court when support is an issue, the judge may make an immediate order either temporary or permanent with regard to support.",back:"False",subject:"FCA",article:"FCA Art. 4",statute:"FCA 433 (a)"},
  {id:1089,front:"FCA 433 (c) & (d) A deposition or testimony under FCA article 4 taken by electronic means shall be recorded and may be preserved for transcription.",back:"False",subject:"FCA",article:"FCA Art. 4",statute:"FCA 433 (c) & (d)"},
  {id:1090,front:"FCA 436 Wives and husbands are competent witnesses against each other and may testify as to non-access at a hearing on the return of a summons or warrant.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 5-B"},
  {id:1091,front:"FCA 437 A respondent is not presumed to have sufficient means to support a child under 21 years of age.",back:"False",subject:"FCA",article:"FCA Art. 4",statute:"FCA 437"},
  {id:1092,front:"FCA 438 (a) In any proceeding under article 4, the court may allow counsel fees to the attorney representing spouse, former spouse or person on behalf of children.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 5-B"},
  {id:1093,front:"FCA 439 (b) Where an order of filiation is issued by a judge in a paternity proceeding and child support is in issue, only the judge shall make a temporary or final order of support.",back:"False",subject:"FCA",article:"FCA Art. 4",statute:"FCA 439 (b)"},
  {id:1094,front:"FCA 441 If a neglect petition was filed in a support proceeding and the court dismisses the support petition, the court retains jurisdiction over the neglect petition.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 5-B"},
  {id:1095,front:"FCA 449 Any order of spousal support shall be effective as of the date of the filing of the petition.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 5-B"},
  {id:1096,front:"FCA 453(a) A violation of a court order of support may only be originated by the original petitioner, or any person to whom order is expressly payable.",back:"False",subject:"FCA",article:"FCA Art. 4",statute:"FCA 453 (a)"},
  {id:1097,front:"FCA 454 2 Upon a finding that a respondent has failed to comply with any lawful order of support, the court has limited options.",back:"False",subject:"FCA",article:"FCA Art. 4",statute:"FCA 454"},
  {id:1098,front:"FCA 460 2. A certified copy of the order directing the entry of a money judgment shall be entered in the office of the clerk of the county in which the proceeding was commenced.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 5-B"},
  {id:1099,front:"FCA 462 When the supreme court makes an order for support in a matrimonial action, the family court order of support terminates unless the supreme court continues the family court order.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 5-B"},
  {id:1100,front:"FCA 463 A supreme court separation order precludes the filing of a family court petition for support of a spouse who is likely to become in need of public assistance or care.",back:"False",subject:"FCA",article:"FCA Art. 4",statute:"FCA 463"},
  {id:1101,front:"FCA 464 (a) The supreme court in a matrimonial action may, on its own motion or motion of either spouse, refer an application for support to the family court.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 5-B"},
  {id:1102,front:"FCA 465 After a final adjudication of an action for separation by the supreme court denying support, the family court may not entertain a petition for support of such spouse.",back:"False",subject:"FCA",article:"FCA Art. 4",statute:"FCA 465"},
  {id:1103,front:"FCA 514 Which of the following statements is least correct? The father is liable for reasonable expenses...",back:"all of the above as determined by the relevant hospital and attending physician",subject:"FCA",article:"FCA Art. 5",statute:"FCA 514"},
  {id:1104,front:"FCA 516-a How many days after the expiration of the execution of the acknowledgment may a party who has attained the age of 18 challenge the agreement?",back:"60 days",subject:"FCA",article:"FCA Art. 5",statute:"FCA 516-"},
  {id:1105,front:"FCA 521 One of the following statements is least correct as to venue under article 5. Proceedings may be originated:",back:"in the county as selected by the social service office.",subject:"FCA",article:"FCA Art. 5",statute:"FCA 521"},
  {id:1106,front:"FCA 525 Personal service of a summons and petition shall be made by delivery of a true copy thereof at least how many days before the time stated therein for appearance?",back:"8 days",subject:"FCA",article:"FCA Art. 5",statute:"FCA 525"},
  {id:1107,front:"FCA 527 (b) When a respondent is taken into custody pursuant to a warrant issued by a family court outside of New York city, the respondent shall be:",back:"taken before the court issuing the warrant if apprehended in that county",subject:"FCA",article:"FCA Art. 5",statute:"FCA 527 (a),(b)"},
  {id:1108,front:"FCA 550 A temporary order of protection may be issued:",back:"either on notice or by ex parte application",subject:"FCA",article:"FCA Art. 5",statute:"FCA 550"},
  {id:1109,front:"FCA 551 An order of protection may set forth reasonable conditions of behavior:",back:"to be observed by both the petitioner and the respondent",subject:"FCA",article:"FCA Art. 5",statute:"FCA 551"},
  {id:1110,front:"FCA 512 As it pertains to paternity proceedings, the phrase \"child born out of wedlock\" refers to a child who is begotten or born out of lawful matrimony.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 5"},
  {id:1111,front:"FCA 512 The word \"child\" refers to a child born out of wedlock.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 5"},
  {id:1112,front:"FCA 513 Each parent of a child born out of wedlock is chargeable with the support of such child including the child's funeral expenses.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 5"},
  {id:1113,front:"FCA 514 Under article 5 the father is not liable for medical expenses so expended in connection with the mother's pregnancy.",back:"False",subject:"FCA",article:"FCA Art. 5",statute:"FCA 514"},
  {id:1114,front:"FCA 516 An agreement or compromise made by the mother and putative father for support does not bar other remedies for support.",back:"False",subject:"FCA",article:"FCA Art. 5",statute:"FCA 516"},
  {id:1115,front:"FCA 516-a The court shall vacate an acknowledgment of parentage if it finds that the acknowledgment was executed on the basis of fraud.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 5"},
  {id:1116,front:"FCA 516-a A signed acknowledgment of parentage abates upon the death or mental illness of either signatory.",back:"False",subject:"FCA",article:"FCA Art. 5",statute:"FCA 516-"},
  {id:1117,front:"FCA 516-a A legal determination of parentage made by any other state must be accorded full faith and credit only if an acknowledgment of parentage meets the requirements of the social security act.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 5"},
  {id:1118,front:"FCA 517 Proceedings to establish paternity of a child may be brought after the child reaches the age of 21 years, if paternity has been acknowledged by the father in writing or by furnishing support.",back:"True",subject:"FCA",article:"FCA",statute:"FCA Art. 5"},

  {id:20076,front:"REVIEW OF COST OF LIVING ADJUSTMENT OF SUPPORT ORDERS (C.O.L.A.) S.C.U. SHALL SEND ADJUSTED ORDER TO PARTIES AND FILE WITH CLERK WITHIN DAYS EITHER PARTY CAN OBJECT WITHIN DAYS OF MAILING COURT DECISION DUE WITHIN DAYS, IF NO OBJECTION COURT SHALL SIGN ORDER WITHIN DAYS AFTER END OF PEIOD",back:"WILL BE MADE IF ANNUAL AVERAGE CHANGE IN (CPI-U) IS AT LEAST 10%, AND 24 MONTHS SINCE LAST ORDER/ADJUSTMENT. 10 DAYS 35 DAYS 45 DAYS; 10 DAYS",subject:"FCA",article:"FCA",statute:""},

  {id:20089,front:"IF MOTHER DIES (OR MENTALLY ILL, OR CAN’T BE FOUND) §518 IF FATHER DIES, DOES NOT PROHIBIT THE FILING OR CONTINUATION OF PROCEEDING  §519",back:"CASE MAY BE MAINTAINED BY AUTHORIZED PERSONS WHERE HE WAS PETITIONER; DNA TEST WAS DONE PRIOR TO DEATH; HE ACKNOWLEDGED PATERNITY IN OPEN COURT, OR “OPENLY AND NOTORIOUSLY”",subject:"FCA",article:"FCA §518",statute:""},

  {id:20122,front:"COURT SHALL REVOKE LICENSE OR ORDER SURRENDER OF FIREARMS WHERE COURT FINDS THAT CONDUCT WHICH RESULTED IN ISSUANCE OF TOP INVOLVED ONE OF (3) CRITERIA …-> COURT SHALL ALSO REVOKE FOR WILLFUL FAILURE TO OBEY OP.",back:"INFLICTION OF SERIOUS PHYSICAL INJURY USE OR THREATENED USE OF DEADLY WEAPON OF DANGEROUS INSTRUMENT BEHAVIOR CONSTITUTING ANY VIOLENT FELONY OFFENSE",subject:"FCA",article:"FCA",statute:""},

  {id:20130,front:"AGGRAVATED CIRCUMSTANCES WHERE CHILD IS SEVERELY/REPEATEDLY ABUSED WITHIN YEARS AFTER RETURNING HOME FROM FOSTER CARE PARENT HAS FOR A PERIOD OF MONTHS TO ENGAGE IN SERVICES TO PREVENT NEGLECT/ABUSE PARENT HAS ABANDONED CHILD UNDER DAYS OLD",back:"1. 5 FAILED, FOR A PERIOD OF AT LEAST 6 MONTHS FROM DATE OF REMOVAL 5",subject:"FCA",article:"FCA",statute:""},

  {id:20132,front:"TEMPORARY REMOVAL OF CHILD WITH CONSENT §1021 PEACE OFFICER*, POLICE OFFICER OR AGENT OF AUTHORIZED AGENCY MAY TEMPORARILY REMOVE CHILD W/O COURT ORDER IF: (3)",back:"WRITTEN CONSENT OF GUARDIAN IS OBTAINED CHILD IS SUSPECTED OF BEING NEGLECTED/ABUSED AND OFFICER GIVES WRITTEN NOTICE TO GUARDIAN OF RIGHT TO APPLY FOR RETURN OF CHILD AND COUNSEL",subject:"FCA",article:"FCA §1021",statute:""},
  {id:20133,front:"§ 1022 | PRELIMINARY ORDERS BEFORE PETITION IS FILED DUE TO CERTAIN CIRCUMSTANCES (IMMINENT DANGER) FAMILY COURT CAN ORDER TEMP. REMOVAL FROM HOME IF: (3) > PETITION MUST BE FILED WITHIN 3 COURT DAYS OF ISSUANCE OF REMOVAL ORDER.",back:"PARENT/PLR IS NOT HOME OR DOES NOT GIVE CONSENT IMMINENT DANGER TO CHILD, & NOT ENOUGH TIME TO FILE PETITION OR HOLD PRELIMINARY HEARING* PERSON REMOVING CHILD MUST GIVE WRITTEN NOTICE TO PARENT OF RIGHT TO APPLY TO FC FOR RETURN OF CHILD AND IF PERSON IS NOT PARENT, MUST AFFIX A NOTICE TO DOOR AND MAIL WITHIN 24 HOURS",subject:"FCA",article:"FCA §1022",statute:""},
  {id:20134,front:"RESPONDENT DOES/DOES NOT HAVE RIGHT TO COUNSEL UNDER ARTICLE 10?",back:"DOES",subject:"FCA",article:"FCA",statute:""},

  {id:20136,front:"ACTION UPON REMOVAL OF CHILD WITHOUT A COURT ORDER",back:"IF CHILD IS NOT RETURNED TO PARENTS, A PETITION MUST BE FILED NEXT COURT DAY AFTER REMOVAL (COURT MAY EXTEND 3 COURT DAYS) HEARING: NO LATER THAN NEXT COURT DAY AFTER PETITION IS FILED",subject:"FCA",article:"FCA",statute:""},
  {id:20137,front:"§ 1028 | APPLICATION TO RETURN CHILD TEMPORARILY REMOVED PARENT/PLR MAY MAKE APPLICATION. HEARING SHALL BE HELD WITHIN COURTS DAYS OF APPLICATION .",back:"3 COURT DAYS AND HEARING SHALL NOT BE ADJOURNED",subject:"FCA",article:"FCA §1028",statute:""},
  {id:20138,front:"§ 1028-A | APPLICATION TO BECOME A FOSTER PARENT 1. MUST BE RELATED WITHIN RD DEGREE CONSANGUINITY",back:"1. 3RD",subject:"FCA",article:"FCA §1028",statute:""},
  {id:20139,front:"2. APPLICATION MUST BE FILED WITHIN MONTHS OF RECEIVING NOTICE FOR FOSTER CARE PLACEMENT BUT NO LATER THAN MONTHS AFTER REMOVAL",back:"2. 6; 12 - INVESTIGATION OF HOME MUST TAKE PLACE WITHIN 24 HOURS IF QUALIFIED AND IN CHILD’S BEST INTEREST.",subject:"FCA",article:"FCA",statute:""},
  {id:20140,front:"TEMP. ORDER OF PROTECTION IF T.O.P. IS GRANTED BEFORE FILING OF PETITON AND PETITION IS NOT FILED WITHIN DAYS, ORDER SHALL BE VACATED.",back:"10 DAYS",subject:"FCA",article:"FCA",statute:""},
  {id:20141,front:"PETITION DETAILS PETITION SHALL CONTAIN NOTICE THAT UPON A FINDING OF SEVERE OF REPEATED ABUSE BY CLEAR AND CONVICING EVIDENCE, PARENTAL RIGHTS MAY BE TERMINATED",back:"COURT MAY ON ITS OWN MOTION AND AT ANY TIME IN THE PROCEEDINGS, SUBSTITUTE A NEGLECT PETITION FOR AN ABUSE PETITION. [SIMILARLY IN ARTICLE 7, THE COURT MAY OWN ITS ON MOTION SUBSTITUTE A P.I.N.S. PETITON FOR A NEGLECT PETITION]",subject:"FCA",article:"FCA",statute:""},

  {id:20195,front:"100.25 - SIMPLIFIED INFORMATION  DEFENDANT IS ENTITLED TO SUPPORTING DEPOSITION IF HE REQUESTS. NOTICE OF RIGHTS MUST APPEAR ON APPEARANCE TICKET. TIMEFRAME FOR REQUEST: 30 DAYS TIMEFRAME FOR SERVICE: 30 DAYS OF REQUEST OR AT LEAST 5 DAYS BEFORE TRIAL. IF ONE CHARGE IS MISDEMEANOR, COURT MAY EXTEND LIMIT, BUT NOT MORE THAN 90 DAYS.",back:"PARK, ENVIRONMENTAL AND TRAFFIC",subject:"CPL",article:"CPL",statute:""},

  {id:20217,front:"§195.10 WHAT ARE THE 3 CRITERIA FOR WAIVER OF INDICTMENT?  ADDTN’L NOTES: A WAIVER OF INDICTMENT MUST BE IN WRITING & MUST BE SIGNED IN OPEN COURT BY DEFENDANT IN PRESENCE OF HIS ATTORNEY.",back:"LCC HAS HELD DEFENDANT FOR ACTION OF GRAND JURY NOT CHARGE WITH CLASS A FELONY PUNISHABLE BY DEATH OF LIFE IMPRISONMENT DA MUST CONSENT WHEN INDICTMENT IS WAVIED IN SUPERIOR COURT, D.A. MUST FILE S.C.I. AT TIME OF WAVIER. WHEN WAIVED IN LCC, DA MUST FILE S.C.I. WITHIN 10 DAYS.",subject:"CPL",article:"CPL §195.10",statute:""},

  {id:20219,front:"MUST CHARGE AT LEAST ONE CRIME OR AT LEAST TWO OR MORES OFFENSES FOR ONE OF WHICH IS A CRIME EACH COUNT MAY CHARGE ONE OFFENSE ONLY BY THE GRAND JURY SIGNED BY THE DA SIGNED BY FOREMAN OR ACTING FOREMAN OF GRAND JURY AMENDMENT OF INDICTMENT MAY NOT BE FOR “FML”: ",back:"GENERALLY ALLEGATIONS OF PREVIOUS CONVICTIONS ARE PROHIBITED. SUCH ALLEGATIONS SHALL BE FILED BY MEANS OF SPECIAL INFORMATION: FOR-HIRE VEHICLES SEX ASSAULT OFFENDER (LESS THAN 15) AGGRAVATED FAMILY OFFENSE F – FAILURE TO CHARGE OR STATE AN OFFENSE M - MISJOINDER L – LEGAL INSUFFICIENCY",subject:"CPL",article:"CPL",statute:""},
  {id:20220,front:"§200.95 – BILL OF PARTICULARS A BILL OF PARTICULARS IS A WRITTEN REQUEST SERVED BY THE DEFENDANT UPON THE PEOPLE, WITHOUT LEAVE OF COURT. A B.O.P. REQUEST IS TIMELY IF MADE WITHIN DAYS AFTER ARRAIGNMENT AND BEFORE COMMENCEMENT OF TRIAL. THE PROSECUTOR SHALL SERVE WITHIN DAYS AFTER SERVICE OF THE REQUEST OF AS SOON AS PRACTICABLE, THE BILL OF PARTICULARS",back:"30 DAYS 15 DAYS",subject:"CPL",article:"CPL §200.95",statute:""},

  {id:20230,front:"A PLEA MUST BE ENTERED ORALLY BY THE DEFENDANT. A PLEA BY A CORPORATION MUST BE ENTERED BY COUNSEL. A PLEA TO AN INDICTMENT THAT DOES NOT CHARGE A FELONY MAY BE ENTERED BY COUNSEL. AT ANY TIME PRIOR TO IMPOSITION OF SENTENCE, COURT MAY IN IT’S DISCRETION PERMIT DEFENDANT TO WITHDRAW GUILTY PLEA",back:"IF DEFENDANT REFUSES TO ENTER A PLEA, A PLEA OF NOT GUILTY MUST BE ENTERED BY THE COURT. DEFENDANT MAY AS A MATTER OF RIGHT CHANGE A PLEA OF NOT GUILTY TO THE INDICTMENT TO A PLEA OF GUILTY TO THE ENTIRE INDICTMENT AT ANY TIME PRIOR TO RENDITION OF VERDICT.",subject:"CPL",article:"CPL",statute:""},
  {id:20231,front:"A DEFENDANT MAY WAIVE JURY TRIAL EXCEPT FOR MURDER 1 §260.20 DEFENDANT MUST BE PERSONALLY PRESENT AT TRIAL OF INDICTMENT, HOWEVER, IF DISORDERLY, COURT MAY REMOVE IF HE HAS BE WARNED AND CONTINUES CONDUCT.",back:"§260.30 – IN WHAT ORDER TO PROCEED JURY MUST BE SELECTED AND SWORN COURT MUST DELIVER PRELIMINARY INSTRUCTIONS TO JURY PEOPLE MUST DELIVER OPENING ADDRESS PEOPLE MUST OFFER EVIDENCE PEOPLE MAY DELIVER SUMMATION TO JURY COURT MUST DELIVER CHARGE TO JURY JURY MUST RETIRE TO DELIBERATE AND IF POSSIBLE, RENDER A VERDICT",subject:"CPL",article:"CPL §260.20",statute:""},

  {id:20253,front:"THE COURT MAY SENTENCE THE DEFENDANT AT TIME THE CONVICTION IS ENTERED IF: A OR IS NOT REQUIRED. WHERE SUCH REPORT IS REQUIRED, THE REPORT HAS BEEN . COURT HAS ASKED DEEFENDANT IF HE WISHES FOR ADJOURNMENT AND HAS RULED ON REQUEST.",back:"PRE-SENTENCE REPORT OR FINGERPRINT REPORT (RAP-SHEET) (380.30) RECEIVED (380.30)",subject:"CPL",article:"CPL",statute:""},
  {id:20254,front:"SENTENCE MAY BE PRONOUNCED AGAINST A IN THE ABSENCE OF COUNSEL IF COUNSEL FAILS TO APPEAR ON DATE OF SENTENCE AND AFTER REASONABLE NOTICE 1. DEFENDANT MUST BE PRESENT AT SENTENCE. HOWEVER FOR OR OFFENSE, COURT MAY UPON MOTION OF DEFENDANT DISPENSE WITH REQUIREMENT.",back:"CORPORATION (380.40) 1. MISDEMEANOR OR PETTY OFFENSE (380.40) THE MOTION MUST INCLUDE WAIVER SIGNED AND ACKNOWLEDGED BY THE DEFENDANT WHICH RECITES THE MAXIMUM SENTENCE THAT MAY BE IMPOSED.",subject:"CPL",article:"CPL",statute:""},
  {id:20255,front:"(390.10) A FINGERPRINT REPORT IS REQUIRED FOR SENTENCING WHERE DEFENDANT IS CONVICTED OF ANY OF THE FOLLOWING: ANY FELONY MISDEMEANOR DEFINED IN THE PENAL LAW MISDEMEANOR DEFINED OUTSIDE PENAL LAW WHICH CONSTITUTES A FELONY IF PERSON HAD A PREVIOUS CRIME CONVICTION ​ LOITERING FOR PURPOSES OF PROSTITUTION *repealed*",back:"A PRE-SENTENCE REPORT IS REQUIRED FOR A FELONY CONVICTION. (390.20) ON A MISDEMEANOR CONVICTION PRE-SENTENCE REPORT IS NOT REQUIRED, EXCEPT: A SENTENCE OF PROBATION A SENTENCE OF IMPRISONMENT FOR A TERM IN EXCESS OF 180 DAYS CONSECUTIVE SENTENCES OF IMPRISONMENT TOTALING MORE THAN 90 DAYS",subject:"CPL",article:"CPL",statute:""},
  {id:20256,front:"HIV TESTING (390.15) UPON REQUESTED BY VICTIM, COURT MUST ORDER HIV TESTING OF THE DEFENDANT. REQUEST MUST BE IN WRITING. TESTING IS DONE IN-CAMERA. TEST RESULTS ARE NOT DISCLOSED TO THE COURT REQUEST MUST BE MADE WITHIN 10 DAYS AFTER ENTRY OF CONVICTION. HIV TESTING MUST BE DONE WITHIN _ 15 DAYS OF ORDER",back:"WHO CAN SEE A PRE-SENTENCE REPORT: ANY COURT WITHIN NYS THAT HAS JURISDICTION FOR PRONOUNCING SENTENCE ANY NYS AGENCY TO WHICH HE IS COMMITTED PUBLIC AGENCIES OUTSIDE NYS MAY SEE REPORT (IF THEY ARE PROBATION, PAROLE ETC…) DCJS MAY BE ALLOWED TO SEE REPORT PROFESSIONAL LICENSING SERVICES MUST BE ALLOWED TO SEE REPORT",subject:"CPL",article:"CPL",statute:""},
  {id:20257,front:"WAIVING PRE-SENTENCE REPORTS PRE-SENTENCE REPORT MAY BE WAIVED BY CONSENT OF JUDGE AND PARTIES, STATED OR THE RECORD OR IN WRITING WHERE? (4)  IN A CITY WITH A POPULATION OF MORE THAN 1 MILLION, PRE-SENTENCE REPORT IS NOT REQUIRED WHERE THE PRISON SENTENCE WAS NEGOTIATED (FOR LESS THAN 365 DAYS).",back:"AGREED UPON SENTENCE WILL BE SATISIFIED BY ALREADY SERVED AGREED UPON SENTENCE OF PROBATION REPORT PREPARED IN PRECEDING 12 MONTHS SENTENCE OF PROBATION IS REVOKED (390.20) PRE-SENTENCE REPORT CANNOT BE WAIVED IF INDETERMINATE OR DETERMINATE SENTENCE OF PRISON IS TO BE IMPOSED.",subject:"CPL",article:"CPL",statute:""},
  {id:20258,front:"IF THE COURT DETERMINES THAT THE DEFENDANT IS ELIGIBLE FOR A SENTENCE OF PROBATION, THE COURT MAY ADJOURN THE SENTENCING FOR A PERIOD NOT EXCEEDING AND PLACE THE DEFENDANT ON INTERIM PROBATION SUPERVISION",back:"1 YEAR",subject:"CPL",article:"CPL",statute:""},

  {id:20293,front:"§530.13 – PROTECTION FOR VICTIMS OF CRIMES, OTHER THAN FAMILY OFFENSES THE DURATION OF SUCH AN ORDER SHALL BE FIXED BY THE COURT AND, IN THE CASE OF A FELONY CONVICTION, SHALL NOT EXCEED THE GREATER OF: -- OR IN THE CASE OF A CONVICTION FOR A CLASS A MISDEMEANOR  FOR ANY OTHER OFFENSE ",back:"5/3/1 RULE FOR NON-FAMILY OFFENSES (I) FIVE YEARS FROM THE DATE OF SUCH SENTENCING, OR (II) THREE YEARS FROM THE EXPIRATION OF THE MAXIMUM TERM OF AN INDETERMINATE SENTENCE OF IMPRISONMENT SHALL NOT EXCEED THREE YEARS FROM THE DATE OF SUCH SENTENCING; SHALL NOT EXCEED ONE YEAR FROM THE DATE OF SENTENCING.",subject:"CPL",article:"CPL §530.13",statute:""},

const SUBJECTS = ['CPL','PL','CPLR','FCA','MISC'];
const SUBJECT_LABELS = {CPL:'CPL', PL:'PL', CPLR:'CPLR', FCA:'FCA', MISC:'Misc'};
let activeSubject = 'ALL';
let mode = 'flash';

// ── Flashcard state ──
let deck = [];
let idx = 0;
let knownIds = new Set();

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function filteredCards(){
  if(activeSubject === 'ALL') return CARDS;
  return CARDS.filter(c => c.subject === activeSubject);
}

function renderFilters(){
  const row = document.getElementById('filterRow');
  const counts = {};
  SUBJECTS.forEach(s => counts[s] = CARDS.filter(c => c.subject === s).length);
  let html = `<button class="filter-chip ${activeSubject==='ALL'?'active':''}" onclick="setSubject('ALL')">All (${CARDS.length})</button>`;
  SUBJECTS.forEach(s => {
    html += `<button class="filter-chip ${activeSubject===s?'active':''}" onclick="setSubject('${s}')">${SUBJECT_LABELS[s]} (${counts[s]})</button>`;
  });
  row.innerHTML = html;
}

function setSubject(s){
  activeSubject = s;
  renderFilters();
  if(mode === 'flash') startFlashDeck();
  else startMatchGame();
}

function switchMode(m){
  mode = m;
  document.getElementById('tab-flash').classList.toggle('active', m==='flash');
  document.getElementById('tab-match').classList.toggle('active', m==='match');
  document.getElementById('flashView').style.display = m==='flash' ? 'block' : 'none';
  document.getElementById('matchView').style.display = m==='match' ? 'block' : 'none';
  if(m === 'flash') startFlashDeck();
  else startMatchGame();
}

// ══════════════════ FLASHCARDS ══════════════════
function startFlashDeck(){
  deck = shuffle(filteredCards());
  idx = 0;
  renderFlashCard();
}

function renderFlashCard(){
  const view = document.getElementById('flashView');
  if(deck.length === 0){
    view.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:40px">No cards match this filter.</p>';
    return;
  }
  const c = deck[idx];
  view.innerHTML = `
    <div class="card-stage">
      <div class="flip-card" id="flipCard" onclick="flipCard()">
        <div class="flip-inner">
          <div class="flip-face flip-front">
            <div class="card-article">${c.article}</div>
            <div class="card-text">${c.front}</div>
            <div class="card-hint">Tap to reveal answer</div>
          </div>
          <div class="flip-face flip-back">
            <div class="card-article">${c.statute || c.article}</div>
            <div class="card-text">${c.back}</div>
            <div class="card-hint">Tap to flip back</div>
          </div>
        </div>
      </div>
      <div class="card-progress">${idx+1} of ${deck.length}</div>
      <div class="know-row">
        <button class="know-btn no" onclick="markCard(false)">✗ Still learning</button>
        <button class="know-btn yes" onclick="markCard(true)">✓ Know it</button>
      </div>
      <div class="card-controls">
        <button class="ctrl-btn" onclick="prevCard()">‹</button>
        <button class="ctrl-btn" onclick="nextCard()">›</button>
      </div>
      <button class="shuffle-btn" onclick="startFlashDeck()">🔀 Shuffle new deck</button>
    </div>
  `;
}

function flipCard(){
  document.getElementById('flipCard').classList.toggle('flipped');
}

function nextCard(){
  idx = (idx + 1) % deck.length;
  renderFlashCard();
}
function prevCard(){
  idx = (idx - 1 + deck.length) % deck.length;
  renderFlashCard();
}
function markCard(known){
  if(known) knownIds.add(deck[idx].id);
  nextCard();
}

// ══════════════════ MATCH GAME (two-column: Questions | Answers) ══════════════════
let matchQuestions = [];
let matchAnswers = [];
let matchTotalPairs = 8;
let matchFoundPairs = 0;
let matchStartTime = null;
let matchTimerInterval = null;
let matchLocked = false;
let selQ = null;   // index into matchQuestions currently selected
let selA = null;   // index into matchAnswers currently selected

function startMatchGame(){
  clearInterval(matchTimerInterval);
  const pool = shuffle(filteredCards()).slice(0, matchTotalPairs);
  if(pool.length < 3){
    document.getElementById('matchView').innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:40px">Not enough cards in this filter for a match game — pick a bigger category.</p>';
    return;
  }
  matchTotalPairs = pool.length;
  matchQuestions = shuffle(pool.map(c => ({ pairId: c.id, text: c.front })));
  matchAnswers = shuffle(pool.map(c => ({ pairId: c.id, text: c.back })));
  matchFoundPairs = 0;
  matchLocked = false;
  selQ = null; selA = null;
  matchStartTime = Date.now();

  renderMatchGame();
  matchTimerInterval = setInterval(updateMatchTimer, 100);
}

function renderMatchGame(){
  const view = document.getElementById('matchView');
  let html = `
    <div class="match-header">
      <div class="match-timer" id="matchTimer">0.0s</div>
      <div class="match-stats">${matchFoundPairs} / ${matchTotalPairs} pairs</div>
      <button class="shuffle-btn" onclick="startMatchGame()">🔀 New game</button>
    </div>
    <div class="match-hint">Tap a question, then tap its matching answer.</div>
    <div class="match-columns">
      <div class="match-col">
        <div class="match-col-head col-head-q">Questions</div>
  `;
  matchQuestions.forEach((q, i) => {
    html += `<div class="match-tile tile-q" data-qi="${i}" onclick="tapQuestion(${i})">${q.text}</div>`;
  });
  html += `
      </div>
      <div class="match-col">
        <div class="match-col-head col-head-a">Answers</div>
  `;
  matchAnswers.forEach((a, i) => {
    html += `<div class="match-tile tile-a" data-ai="${i}" onclick="tapAnswer(${i})">${a.text}</div>`;
  });
  html += `
      </div>
    </div>
  `;
  view.innerHTML = html;
}

function updateMatchTimer(){
  const el = document.getElementById('matchTimer');
  if(!el) { clearInterval(matchTimerInterval); return; }
  const elapsed = (Date.now() - matchStartTime) / 1000;
  el.textContent = elapsed.toFixed(1) + 's';
}

function tapQuestion(i){
  if(matchLocked) return;
  const el = document.querySelector(`[data-qi="${i}"]`);
  if(!el || el.classList.contains('matched')) return;
  document.querySelectorAll('[data-qi]').forEach(e => e.classList.remove('selected'));
  selQ = i;
  el.classList.add('selected');
  tryMatch();
}

function tapAnswer(i){
  if(matchLocked) return;
  const el = document.querySelector(`[data-ai="${i}"]`);
  if(!el || el.classList.contains('matched')) return;
  document.querySelectorAll('[data-ai]').forEach(e => e.classList.remove('selected'));
  selA = i;
  el.classList.add('selected');
  tryMatch();
}

function tryMatch(){
  if(selQ === null || selA === null) return;
  matchLocked = true;
  const qEl = document.querySelector(`[data-qi="${selQ}"]`);
  const aEl = document.querySelector(`[data-ai="${selA}"]`);
  const q = matchQuestions[selQ], a = matchAnswers[selA];

  if(q.pairId === a.pairId){
    setTimeout(() => {
      qEl.classList.add('matched'); qEl.classList.remove('selected');
      aEl.classList.add('matched'); aEl.classList.remove('selected');
      matchFoundPairs++;
      document.querySelector('.match-stats').textContent = `${matchFoundPairs} / ${matchTotalPairs} pairs`;
      selQ = null; selA = null;
      matchLocked = false;
      if(matchFoundPairs === matchTotalPairs) finishMatchGame();
    }, 250);
  } else {
    qEl.classList.add('wrong'); aEl.classList.add('wrong');
    setTimeout(() => {
      qEl.classList.remove('selected','wrong');
      aEl.classList.remove('selected','wrong');
      selQ = null; selA = null;
      matchLocked = false;
    }, 600);
  }
}

function finishMatchGame(){
  clearInterval(matchTimerInterval);
  const elapsed = ((Date.now() - matchStartTime) / 1000).toFixed(1);
  if(typeof CLERK_SYNC !== 'undefined'){
    CLERK_SYNC.saveTestScore('Memory Match', `${matchTotalPairs} pairs in ${elapsed}s`, 'memory_match');
  }
  document.getElementById('matchView').innerHTML = `
    <div class="match-complete">
      <h2>🎉 Matched!</h2>
      <p style="font-size:18px;color:var(--text-muted);margin-bottom:20px">${matchTotalPairs} pairs in <strong style="color:var(--navy)">${elapsed}s</strong></p>
      <button class="know-btn yes" onclick="startMatchGame()">Play again</button>
    </div>
  `;
}

// Init
document.getElementById('cardCount').textContent = CARDS.length + ' cards in the bank';
renderFilters();
startFlashDeck();
</script>
