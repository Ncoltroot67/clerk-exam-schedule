  {id:305,front:"T/F: A proceeding to adjudicate a person a JD is originated by a presentment agency.",back:"True",subject:"FCA",article:"FCA Art. 3",statute:"FCA 310.1 & 254-a"},
  {id:306,front:"T/F: At the initial appearance, the court may release the respondent or direct his/her detention.",back:"True",subject:"FCA",article:"FCA Art. 3",statute:"FCA 320.5"},
  {id:307,front:"T/F: When directing detention based on flight risk, the court may consider electronic monitoring as a condition of release.",back:"True",subject:"FCA",article:"FCA Art. 3",statute:"FCA 320.5(3)(b)&(c)"},
  {id:308,front:"T/F: When a respondent is found incapacitated, the respondent, counsel, presentment agency, and the relevant commissioner shall be notified.",back:"True",subject:"FCA",article:"FCA Art. 3",statute:"FCA 322.2"},
  {id:309,front:"T/F: Only non-hearsay evidence shall be admissible at the probable cause hearing to demonstrate reasonable cause.",back:"True",subject:"FCA",article:"FCA Art. 3",statute:"FCA 325.2"},
  {id:310,front:"T/F: The probable cause hearing should be completed in one day.",back:"True",subject:"FCA",article:"FCA Art. 3",statute:"FCA 325.2(4)"},
  {id:311,front:"T/F: If respondent is detained, the court may direct the filing of the bill of particulars on an expedited basis.",back:"False",subject:"FCA",article:"FCA Art. 3",statute:"FCA 330.1"},
  {id:312,front:"T/F: A child may not be found delinquent solely upon evidence of a confession/admission without additional proof that the crime charged was committed.",back:"True",subject:"FCA",article:"FCA Art. 3",statute:"FCA 344.2(4)"},
  {id:313,front:"T/F: A bill of particulars can be obtained only by court order.",back:"False",subject:"FCA",article:"FCA Art. 3",statute:"FCA 330.1(5)"},
  {id:314,front:"T/F: A bill of particulars is a tool of, and a method of, discovery.",back:"False",subject:"FCA",article:"FCA Art. 3",statute:"FCA 330.1(a)"},
  {id:315,front:"T/F: A respondent may move to dismiss the petition on the ground the proceeding is barred by FCA 303.2, applying CPL Article 40 double jeopardy.",back:"True",subject:"FCA",article:"FCA Art. 3",statute:"FCA 332.1"},
  {id:316,front:"T/F: The judge who presides at the fact finding hearing shall also preside at the dispositional hearing.",back:"True",subject:"FCA",article:"FCA Art. 3",statute:"FCA 340.2"},
  {id:317,front:"T/F: The standard of proof in a fact finding hearing is proof beyond a reasonable doubt.",back:"True",subject:"FCA",article:"FCA Art. 3",statute:"FCA 342.2(2)"},
  {id:318,front:"T/F: Family Court rules provide for assignment of JD proceedings to another judge when it's not practicable for the appropriate judge to preside.",back:"True",subject:"FCA",article:"FCA Art. 3",statute:"FCA 340.2,3(a)&(c)"},
  {id:319,front:"T/F: At the request of a sexual-offense victim, the Court may order the respondent to take an HIV test.",back:"True",subject:"FCA",article:"FCA Art. 3",statute:"FCA 347.1(1)"},
  {id:320,front:"If respondent is detained and not found to have committed a designated felony act, the dispositional hearing shall commence:",back:"not more than 10 days after entry of the order establishing commission of the crime.",subject:"FCA",article:"FCA Art. 3",statute:"FCA 350.1(1),(2)"},
  {id:321,front:"The court may adjourn the dispositional hearing:",back:"on motion of the presentment agency for good cause shown for not more than 10 days.",subject:"FCA",article:"FCA Art. 3",statute:"FCA 350.1(3)"},
  {id:322,front:"Regarding the dispositional hearing: (1) only material and relevant evidence admissible (2) adjudication based on beyond reasonable doubt (3) presentment agency shall appear (4) probation service shall appear",back:"1 & 3 only",subject:"FCA",article:"FCA Art. 3",statute:"FCA 350.3"},
  {id:323,front:"At the conclusion of the dispositional hearing, a conditional discharge disposition's maximum period shall not exceed:",back:"1 year",subject:"FCA",article:"FCA Art. 3",statute:"FCA 353.1(3)"},
  {id:324,front:"The maximum period of probation ordered by the court shall not exceed:",back:"two years",subject:"FCA",article:"FCA Art. 3",statute:"FCA 353.2(6)"},
  {id:325,front:"For restrictive placement of a designated felony act other than class A, the initial placement with the office of children and family services shall be:",back:"for an initial period of three years.",subject:"FCA",article:"FCA Art. 3",statute:"FCA 353.5(5)(a)"},
  {id:326,front:"For a designated CLASS A felony act, restrictive placement shall be with:",back:"the office of children and family services for an initial period of 5 years.",subject:"FCA",article:"FCA Art. 3",statute:"FCA 353.5(4)(a)"},
  {id:327,front:"Restitution in conjunction with probation, conditional discharge, or placement may be ordered when the respondent is over the age of:",back:"to be determined by the court",subject:"FCA",article:"FCA Art. 3",statute:"FCA 353.6"},
  {id:328,front:"For nonrestrictive-facility placement with successive extensions, beyond what age can the placement not continue?",back:"age is set in the discretion of the court",subject:"FCA",article:"FCA Art. 3",statute:"FCA 355.3(6)"},
  {id:329,front:"A petition to extend placement (by social services/OCFS/placement person) shall be filed:",back:"60 days prior to expiration of the period of placement.",subject:"FCA",article:"FCA Art. 3",statute:"FCA 355.3(1)"},
  {id:330,front:"Initial permanency hearing (respondent placed 12 or fewer months, in foster home/non-secure facility) shall be held no later than:",back:"12 months",subject:"FCA",article:"FCA Art. 3",statute:"FCA 355.5"},
  {id:331,front:"Which is least correct regarding a violation-of-probation petition?",back:"hearsay allegations may support the violation charged.",subject:"FCA",article:"FCA Art. 3",statute:"FCA 360.2(1),(2)"},
  {id:332,front:"Which is least correct regarding post-dispositional probation procedures?",back:"a police officer shall not assist in executing any search order.",subject:"FCA",article:"FCA Art. 3",statute:"FCA 360.1"},
  {id:333,front:"Termination of a delinquency proceeding in respondent's favor may be by: (1) dismissal of petition (2) successful ACD completion (3) withdrawal of petition (4) probation adjustment",back:"1, 2, 3 & 4",subject:"FCA",article:"FCA Art. 3",statute:"FCA 375.1(2)"},
  {id:334,front:"On how many days notice to respondent must the presentment agency move to preclude sealing of records?",back:"8 days",subject:"FCA",article:"FCA Art. 3",statute:"FCA 375.1(1)"},
  {id:335,front:"T/F: At the conclusion of the dispositional hearing, if the court finds respondent doesn't require confinement/treatment/supervision, it shall dismiss the petition.",back:"True",subject:"FCA",article:"FCA Art. 3",statute:"FCA 352.1"},
  {id:336,front:"T/F: At the conclusion of the dispositional hearing the court may order continued placement of the respondent in his/her home.",back:"True",subject:"FCA",article:"FCA Art. 3",statute:"FCA 352.2(b)"},
  {id:337,front:"T/F: Under an order of protection, a respondent may be required to refrain from intentionally injuring/killing a companion animal owned/possessed by the petitioner.",back:"True",subject:"FCA",article:"FCA Art. 3",statute:"FCA 352.3(1)"},
  {id:338,front:"T/F: An order of protection issued by the court shall not exceed the period of time specified in any order of disposition.",back:"True",subject:"FCA",article:"FCA Art. 3",statute:"FCA 352.3(2)"},
  {id:339,front:"T/F: A copy of the conditions of probation may not be filed with or become part of the record.",back:"False",subject:"FCA",article:"FCA Art. 3",statute:"FCA 353.2(5)"},
  {id:340,front:"T/F: The court MAY order restrictive placement where respondent inflicted serious physical injury on a person 62 or older during a designated felony act.",back:"False",subject:"FCA",article:"FCA Art. 3",statute:"FCA 353.5(3)"},
  {id:341,front:"T/F: For a respondent over ten, the court may recommend restitution not to exceed $500.",back:"False",subject:"FCA",article:"FCA Art. 3",statute:"FCA 353.6"},
  {id:342,front:"T/F: A JD adjudication may not be denominated a criminal conviction, nor can the adjudicated person be denominated a criminal.",back:"True",subject:"FCA",article:"FCA Art. 3",statute:"FCA 380.1"},
  {id:343,front:"T/F: Except where required by statute, no person shall be required to divulge information pertaining to the respondent's arrest or subsequent proceeding.",back:"True",subject:"FCA",article:"FCA Art. 3",statute:"FCA 380.1(3)"},
  {id:344,front:"T/F: Where a JD finding has been entered, the record may, upon request, be made available to the commissioner of mental health/developmental disabilities, the case review panel, and the attorney general.",back:"False",subject:"FCA",article:"FCA Art. 3",statute:"FCA 380.1(4)"},
  {id:345,front:"The family court has exclusive original jurisdiction over proceedings: (1) for support (2) maintenance (3) under Art. 3A DRL (Uniform Support of Dependents Law) (4) under Art. 5B FCA (UIFSA)",back:"1, 2 & 4 only",subject:"FCA",article:"FCA Art. 4",statute:"FCA 411"},
  {id:346,front:"Parents are chargeable with the support of:",back:"a child under 21 years of age",subject:"FCA",article:"FCA Art. 4",statute:"FCA 413"},
  {id:347,front:"Child support percentage based on combined parental income for one child shall be:",back:"17%",subject:"FCA",article:"FCA Art. 4",statute:"FCA 413(1)(b)(3)"},
  {id:348,front:"Combined parental income shall mean:",back:"the sum of the 'income' of both parents.",subject:"FCA",article:"FCA Art. 4",statute:"FCA 413(1)(b)(4)"},
  {id:349,front:"In determining income, the court may attribute/impute income from other resources including:",back:"All of the above.",subject:"FCA",article:"FCA Art. 4",statute:"FCA 413(1)(b)(5)(iv)"},
  {id:350,front:"Upon proof that cash medical support would be unjust/inappropriate, the court shall:",back:"follow all or none of the above considerations",subject:"FCA",article:"FCA Art. 4",statute:"FCA 413(1)(c)(5)"},
  {id:351,front:"The court may allocate a portion of which sources to child support? (1) life insurance policies (2) recovery of bad debts (3) gifts and inheritances (4) discharges of indebtedness",back:"1, 2, 3 & 4",subject:"FCA",article:"FCA Art. 4",statute:"FCA 413(1)(c)(7),(e)"},
  {id:352,front:"Who may request review of a cost-of-living-adjustment order? (1) any party to a child support order (2) child support enforcement service (3) support collection unit (4) the court on its own motion",back:"1 & 2 only",subject:"FCA",article:"FCA Art. 4",statute:"FCA 413-a(1)"},
  {id:353,front:"An objection to a cost-of-living adjustment must be submitted within how many days of mailing of the adjusted order?",back:"35 days",subject:"FCA",article:"FCA Art. 4",statute:"FCA 413-a(3)"},
  {id:354,front:"The court shall conduct the hearing and determine an objection to a COLA no later than how many days from receiving the objection?",back:"45 days",subject:"FCA",article:"FCA Art. 4",statute:"FCA 413-a(3)(d)"},
  {id:355,front:"Which may be a requirement for an order of support? 1. Necessary shelter 2. Clothing 3. Expense of education 4. Funeral expenses",back:"1, 2, 3 & 4",subject:"FCA",article:"FCA Art. 4",statute:"FCA 416(a)"},
  {id:356,front:"Upon failure to provide a completed net worth affidavit, the SCU may review which to initiate a support adjustment? (1) federal tax return (2) state tax return (3) current pay stubs (4) representative pay stubs",back:"1, 2, 3 & 4",subject:"FCA",article:"FCA Art. 4",statute:"FCA 424-a(b)"},
  {id:357,front:"A rebuttable presumption of paternity is created by what percentage probability from a genetic marker/DNA test?",back:"95%",subject:"FCA",article:"FCA Art. 4",statute:"FCA 418(a)"},
  {id:358,front:"Venue in proceedings to compel support may be originated:",back:"in the county of residence of any party",subject:"FCA",article:"FCA Art. 4",statute:"FCA 421"},
  {id:359,front:"Which may NOT originate an article 4 support proceeding?",back:"a presentment agency",subject:"FCA",article:"FCA Art. 4",statute:"FCA 422"},
  {id:360,front:"A sworn net worth statement shall be filed with the clerk on a date fixed by the court no later than how many days after the return date of the petition?",back:"10 days",subject:"FCA",article:"FCA Art. 4",statute:"FCA 424-a"},
  {id:361,front:"The sworn net worth statement shall list assets transferred during what period preceding the statement's date?",back:"3 years",subject:"FCA",article:"FCA Art. 4",statute:"FCA 424-a"},
  {id:362,front:"An agreement for the support of the petitioner is not effective unless:",back:"it is reduced to writing and submitted to the family court or a support magistrate",subject:"FCA",article:"FCA Art. 4",statute:"FCA 425 (New, 2026)"},
  {id:363,front:"Personal service of a summons/petition may be made at least how many days before the appearance time stated therein?",back:"8 days",subject:"FCA",article:"FCA Art. 4",statute:"FCA 427(a)-(c)"},
  {id:364,front:"Which method of service under Article 4 requires a court order?",back:"substituted service",subject:"FCA",article:"FCA Art. 4",statute:"FCA 427(b)"},
  {id:365,front:"A certificate of a warrant expires how many days after the date of issue?",back:"90 days",subject:"FCA",article:"FCA Art. 4",statute:"FCA 428"},
  {id:366,front:"Which are most correct concerning a temporary order of protection? (1) not a finding of wrongdoing (2) may be issued on notice (3) may not be issued ex parte (4) may not be issued with a warrant",back:"1 & 2 only",subject:"FCA",article:"FCA Art. 4",statute:"FCA 430"},
  {id:367,front:"When respondent is brought before the court on a warrant: (1) shall be informed of the petition's contents (2) may not present witnesses at this time (3) shall be advised of right to counsel (4) court may not exclude the public",back:"1 & 3 only",subject:"FCA",article:"FCA Art. 4",statute:"FCA 433"},
  {id:368,front:"Which is least correct concerning support magistrate authority?",back:"are empowered to hear contested paternity involving claims of equitable estoppel",subject:"FCA",article:"FCA Art. 4",statute:"FCA 439(a)"},
  {id:369,front:"In a paternity proceeding, a support magistrate must:",back:"Both a and b",subject:"FCA",article:"FCA Art. 4",statute:"FCA 439(b)"},
  {id:370,front:"Support magistrates shall be appointed by the chief administrator on a full time basis for a term of:",back:"3 years",subject:"FCA",article:"FCA Art. 4",statute:"FCA 439(f)"},
  {id:371,front:"Support magistrates shall:",back:"have the power to issue subpoenas and administer oaths.",subject:"FCA",article:"FCA Art. 4",statute:"FCA 439(d)"},
  {id:372,front:"Written objections to a support magistrate's final order may be filed within how many days of receipt of the order in court?",back:"30 days",subject:"FCA",article:"FCA Art. 4",statute:"FCA 439(e)"},
  {id:373,front:"Regarding the court's continuing jurisdiction under article 4:",back:"the court's jurisdiction continues until its judgment is completely satisfied",subject:"FCA",article:"FCA Art. 4",statute:"FCA 451(1)"},
  {id:374,front:"Upon a violation of a support order, the court: (1) may enter a money judgment (2) may make an order of sequestration (3) shall suspend respondent's state professional license (4) may require respondent to post an undertaking",back:"2 & 4 only",subject:"FCA",article:"FCA Art. 4",statute:"FCA 454(2)"},
  {id:375,front:"In addition to other penalties for failure to obey a lawful order, the court may commit respondent to jail for a term not exceeding:",back:"6 months",subject:"FCA",article:"FCA Art. 4",statute:"FCA 454(3)(a)"},
  {id:376,front:"The period of probation under article 4:",back:"may continue as long as an order of support/protection applies to the probationer",subject:"FCA",article:"FCA Art. 4",statute:"FCA 456"},
  {id:377,front:"Regarding sequestration for failure to pay support: (1) court may sequester property real/personal WITHIN the state (2) WITHIN OR WITHOUT the state (3) when respondent leaves the state (4) when respondent threatens to leave the state",back:"1,3, & 4 only",subject:"FCA",article:"FCA Art. 4",statute:"FCA 457"},
  {id:378,front:"Select the least correct statement regarding suspension of driving privileges for support noncompliance:",back:"court must order the suspension of respondent's driving privileges",subject:"FCA",article:"FCA Art. 4",statute:"FCA 458-a"},
  {id:379,front:"In addition to driving-privilege suspension, the court may: (1) suspend business/trade license (2) suspend professional state license (3) terminate suspension upon compliance (4) hold suspension in abeyance for one year",back:"1,2,3 & 4",subject:"FCA",article:"FCA Art. 4",statute:"FCA 458-b"},
  {id:380,front:"In a support proceeding, the court may require respondent to post an undertaking for:",back:"a definite period not to exceed 3 years",subject:"FCA",article:"FCA Art. 4",statute:"FCA 471"},
  {id:381,front:"T/F: The family court has exclusive original jurisdiction over support/maintenance in divorce, separation, or annulment actions.",back:"False",subject:"FCA",article:"FCA Art. 4",statute:"FCA 461(c)"},
  {id:382,front:"T/F: The court shall multiply combined parental income up to $80,000 by the appropriate child support percentage to determine basic child support.",back:"False",subject:"FCA",article:"FCA Art. 4",statute:"FCA 413(1)(c)(2)"},
  {id:383,front:"T/F: The court may allocate a portion of lottery winnings to child support.",back:"True",subject:"FCA",article:"FCA Art. 4",statute:"FCA 413(1)(e)"},
  {id:384,front:"T/F: The court shall calculate the basic child support obligation as well as the non-custodial parent's pro rata share.",back:"False",subject:"FCA",article:"FCA Art. 4",statute:"FCA 413(1)(f)"},
  {id:385,front:"T/F: Where the non-custodial parent's pro rata share is found unjust/inappropriate, the court shall order an amount it finds just and appropriate.",back:"False",subject:"FCA",article:"FCA Art. 4",statute:"FCA 413(1)(g)"},
  {id:386,front:"T/F: If no specific written objections are received to an adjusted support order within 35 days of mailing, the clerk shall immediately issue the order without further review.",back:"True",subject:"FCA",article:"FCA Art. 4",statute:"FCA 413(3)(b)(6)"},
  {id:387,front:"T/F: Any party to a child support order issued prior to September 15, 1989, on behalf of a child receiving public assistance, may request a review for a COLA.",back:"True",subject:"FCA",article:"FCA Art. 4",statute:"FCA 413(4)"},
  {id:388,front:"T/F: An objection to a COLA adjusted order shall be submitted within 45 days from the mailing date.",back:"False",subject:"FCA",article:"FCA Art. 4",statute:"FCA 413-a(3)"},
  {id:389,front:"T/F: If an order under review by the court doesn't provide for health insurance, the court shall make a determination regarding such benefits.",back:"True",subject:"FCA",article:"FCA Art. 4",statute:"FCA 413-a(3)(d)"},
  {id:390,front:"T/F: The court may include in support requirements that a party purchase, maintain, or assign accident insurance or life insurance on either party.",back:"True",subject:"FCA",article:"FCA Art. 4",statute:"FCA 416(b)"},
  {id:391,front:"T/F: Upon a finding that a legally responsible relative willfully failed to obtain required health insurance, that relative is presumptively liable for all health care expenses incurred.",back:"True",subject:"FCA",article:"FCA Art. 4",statute:"FCA 416(k)"},
  {id:392,front:"T/F: A child born of parents prior to their ceremonial marriage shall not be deemed the legitimate child of both parents.",back:"False",subject:"FCA",article:"FCA Art. 4",statute:"FCA 417"},
  {id:393,front:"T/F: If DNA/genetic marker test results indicate at least 95% probability of paternity, this creates a rebuttable presumption of paternity.",back:"True",subject:"FCA",article:"FCA Art. 4",statute:"FCA 418(a)"},
  {id:394,front:"T/F: Compulsory financial disclosure in support proceedings does not apply to a social service official who is a party.",back:"True",subject:"FCA",article:"FCA Art. 4",statute:"FCA 424-a"},
  {id:395,front:"T/F: Financial compulsory disclosure may be waived by the court.",back:"False",subject:"FCA",article:"FCA Art. 4",statute:"FCA 424-a"},
  {id:396,front:"T/F: All sworn net worth statements shall be accompanied by the most recently filed federal/state tax returns including W-2 copies.",back:"True",subject:"FCA",article:"FCA Art. 4",statute:"FCA 424-a"},
  {id:397,front:"T/F: A support agreement between petitioner and respondent may only be approved by the court.",back:"False",subject:"FCA",article:"FCA Art. 4",statute:"FCA 425"},
  {id:398,front:"T/F: Petitioner may not serve a warrant on respondent unless the court grants permission upon petitioner's application.",back:"True",subject:"FCA",article:"FCA Art. 4",statute:"FCA 428(b)"},
  {id:399,front:"T/F: Family court rules shall provide that a record of all unserved warrants be kept and periodic reports made.",back:"True",subject:"FCA",article:"FCA Art. 4",statute:"FCA 428(d)"},
  {id:400,front:"T/F: Should income/profits from sequestered property be insufficient, the court may direct mortgage or sale of the real estate.",back:"True",subject:"FCA",article:"FCA Art. 4",statute:"FCA 429"},
  {id:401,front:"T/F: If the initial return of a summons/warrant is before a judge when support is an issue, the judge MAY make an immediate order.",back:"False",subject:"FCA",article:"FCA Art. 4",statute:"FCA 433(a)"},
  {id:402,front:"T/F: A deposition/testimony under article 4 taken by electronic means shall be recorded and may be preserved for transcription.",back:"False",subject:"FCA",article:"FCA Art. 4",statute:"FCA 433(c)&(d)"},
  {id:403,front:"T/F: Wives and husbands are competent witnesses against each other and may testify as to non-access at a hearing on the return of a summons or warrant.",back:"True",subject:"FCA",article:"FCA Art. 4",statute:"FCA 436"},
  {id:404,front:"T/F: A respondent is not presumed to have sufficient means to support a child under 21.",back:"False",subject:"FCA",article:"FCA Art. 4",statute:"FCA 437"},
  {id:405,front:"T/F: In any article 4 proceeding, the court may allow counsel fees to the attorney representing spouse, former spouse, or person on behalf of children.",back:"True",subject:"FCA",article:"FCA Art. 4",statute:"FCA 438(a)"},
  {id:406,front:"T/F: Where an order of filiation is issued by a judge and child support is in issue, only the judge shall make a temporary or final order of support.",back:"False",subject:"FCA",article:"FCA Art. 4",statute:"FCA 439(b)"},
  {id:407,front:"T/F: If a neglect petition was filed in a support proceeding and the court dismisses the support petition, the court retains jurisdiction over the neglect petition.",back:"True",subject:"FCA",article:"FCA Art. 4",statute:"FCA 441"},
  {id:408,front:"T/F: An order of protection may be entered against a member of the same family/household as defined in §812(1)(e) FCA Family Offenses.",back:"True",subject:"FCA",article:"FCA Art. 4",statute:"FCA 446"},
  {id:409,front:"T/F: Any order of spousal support shall be effective as of the date of the filing of the petition.",back:"True",subject:"FCA",article:"FCA Art. 4",statute:"FCA 449"},
  {id:410,front:"T/F: A violation of a support order may only be originated by the original petitioner or a person to whom the order is expressly payable.",back:"False",subject:"FCA",article:"FCA Art. 4",statute:"FCA 453(a)"},
  {id:411,front:"T/F: Upon a finding that respondent failed to comply with a lawful support order, the court has limited options.",back:"False",subject:"FCA",article:"FCA Art. 4",statute:"FCA 454(2)"},
  {id:412,front:"T/F: A certified copy of the order directing entry of a money judgment shall be entered in the office of the clerk of the county in which the proceeding was commenced.",back:"True",subject:"FCA",article:"FCA Art. 4",statute:"FCA 460(2)"},
  {id:413,front:"T/F: When the supreme court makes a support order in a matrimonial action, the family court order terminates unless the supreme court continues it.",back:"True",subject:"FCA",article:"FCA Art. 4",statute:"FCA 462"},
  {id:414,front:"T/F: A supreme court separation order precludes the filing of a family court petition for spousal support where the spouse is likely to need public assistance.",back:"False",subject:"FCA",article:"FCA Art. 4",statute:"FCA 463"},
  {id:415,front:"T/F: The supreme court, on its own motion or motion of either spouse, may refer a support application to the family court.",back:"True",subject:"FCA",article:"FCA Art. 4",statute:"FCA 464(a)"},
  {id:416,front:"T/F: After a final supreme court adjudication denying spousal support, the family court may not entertain a spousal support petition.",back:"False",subject:"FCA",article:"FCA Art. 4",statute:"FCA 465"},
  {id:417,front:"T/F: Upon issuance/violation of an order of protection, the court shall determine firearm license suspension/revocation, ineligibility, and surrender, per FCA §842-a.",back:"True",subject:"FCA",article:"FCA Art. 4",statute:"FCA 446-a"},
  {id:418,front:"T/F? The FC has exclusive original jurisdiction over family offenses.",back:"False",subject:"FCA",article:"FCA Art. 1",statute:"FCA 115"},
  {id:419,front:"T/F? A \"duly authorized agency\" may be a foreign corporation that has a place of business in NYS.",back:"False",subject:"FCA",article:"FCA Art. 1",statute:"FCA 119"},
  {id:420,front:"T/F? FC judge may dispense with formality of placing a minor under oath.",back:"True",subject:"FCA",article:"FCA Art. 1",statute:"FCA 152"},
  {id:421,front:"T/F? Clerk of FC shall use discretion in giving out petition forms to persons requesting them.",back:"False",subject:"FCA",article:"FCA Art. 2",statute:"FCA 216-b"},
  {id:422,front:"The court shall file or direct the filing of an order within___days of the decision of the court, OR within ___days of settlement of the order on notice.",back:"20…20",subject:"FCA",article:"FCA Art. 2",statute:"FCA 217"},
  {id:423,front:"T/F? In making an appointment of an attorney for a child pursuant to this section, the court shall, to the extent practicable and appropriate, appoint the same attorney who has previously represented the child.",back:"True",subject:"FCA",article:"FCA Art. 2",statute:"FCA 249"},
  {id:424,front:"T/F? A petitioner and respondent, if indigent, are entitled to free counsel in an article 8 proceeding.",back:"True",subject:"FCA",article:"FCA Art. 2",statute:"FCA 262"},
  {id:425,front:"T/F? A petitioner, if indigent, is entitled to free counsel in an article 5 proceeding.",back:"False",subject:"FCA",article:"FCA Art. 2",statute:"FCA 262"},
  {id:426,front:"Administrative forms for use in family court shall be promulgated by:",back:"the chief administrator of the courts.",subject:"FCA",article:"FCA Art. 2",statute:"FCA 214"},
  {id:427,front:"Any court employee assisting a petitioner who is not represented by counsel must:",back:"list all allegations, even if the person seems intoxicated",subject:"FCA",article:"FCA Art. 2",statute:"FCA 216-c"},
  {id:428,front:"Which of the following persons does NOT have the right to free counsel if unable to afford counsel?",back:"petitioner in an article 5 proceeding",subject:"FCA",article:"FCA Art. 2",statute:"FCA 262"},
  {id:429,front:"A certificate of warrant expires ____ days from date of issue.",back:"90",subject:"FCA",article:"FCA Art. 4",statute:"FCA 428"},
  {id:430,front:"T/F? Support hearings are conducted with a jury.",back:"False",subject:"FCA",article:"FCA Art. 4",statute:"FCA 435"},
  {id:431,front:"FCA 454 — Where there is a failure to comply with a support order, is the court's entry of a money judgment mandatory (MUST) or discretionary (MAY)?",back:"MUST",subject:"FCA",article:"FCA Art. 4",statute:"FCA 454"},
  {id:432,front:"According to the definitions, what is the term for conduct for which a sentence to a term of imprisonment or a fine is provided by a law of the state?",back:"offense",subject:"PL",article:"PL Art. 10",statute:"PL 10.10"},
  {id:433,front:"What is defined as an offense, not a traffic infraction, for which a sentence of imprisonment up to and including 15 days can be imposed?",back:"violation",subject:"PL",article:"PL Art. 10",statute:"PL 10.10"},
  {id:434,front:"Which of the following is classified as an offense for which a sentence of imprisonment in excess of 1 year can be imposed?",back:"felony",subject:"PL",article:"PL Art. 10",statute:"PL 10.10"},
  {id:435,front:"_________________ refers to either a misdemeanor or a felony.",back:"crime",subject:"PL",article:"PL Art. 10",statute:"PL 10.10"},
  {id:436,front:"SELECT ALL CORRECT ANSWERS. Misdemeanors are classified as: 1. Class A Misdemeanors 2. Class B Misdemeanors 3. Class C Misdemeanors 4. Unclassified Misdemeanors",back:"1,2,4",subject:"PL",article:"PL Art. 55",statute:"PL 55.05"},
  {id:437,front:"Any offense declared to be a felony without specifying class, or for which law provides sentence greater than 1 year (outside of Penal Law) is considered:",back:"Class E Felony",subject:"PL",article:"PL Art. 55",statute:"PL 55.10"},
  {id:438,front:"Any offense declared to be a misdemeanor without specifying class is considered:",back:"Class A Misdemeanor",subject:"PL",article:"PL Art. 55",statute:"PL 55.10"},
  {id:439,front:"Fine for a Felony is:",back:"$5,000 or double defendant's gain",subject:"PL",article:"PL Art. 80",statute:"PL 80.00"},
  {id:440,front:"Which of the following is not a correct fine? Fine for felony (controlled substance, and not a corporation) is:",back:"For a felony (controlled substance, not a corporation) $100,000",subject:"PL",article:"PL Art. 80",statute:"PL 80.00"},
  {id:441,front:"Which of the following is a correct fine? Fines for misdemeanors and violations (not Corporation) are:",back:"all the above",subject:"PL",article:"PL Art. 80",statute:"PL 80.05"},
  {id:442,front:"Which of the following is not a correct fine? Fines for Corporations are:",back:"all the above",subject:"PL",article:"PL Art. 80",statute:"PL 80.10"},
  {id:443,front:"\"Traffic infraction\" means any offense defined as a traffic infraction by which law?",back:"the Vehicle and Traffic Law, section 155",subject:"PL",article:"PL Art. 10",statute:"PL 10.00(2)"},
  {id:444,front:"A \"violation\" is an offense, other than a traffic infraction, for which a sentence to a term of imprisonment cannot be imposed in excess of:",back:"15 days",subject:"PL",article:"PL Art. 10",statute:"PL 10.00(3)"},
  {id:445,front:"A \"misdemeanor\" is an offense, other than a traffic infraction, for which imprisonment may exceed 15 days but cannot exceed:",back:"1 year",subject:"PL",article:"PL Art. 10",statute:"PL 10.00(4)"},
  {id:446,front:"A \"felony\" is an offense for which a sentence to a term of imprisonment may be imposed:",back:"in excess of 1 year",subject:"PL",article:"PL Art. 10",statute:"PL 10.00(5)"},
  {id:447,front:"\"Deadly physical force\" means physical force which, under the circumstances in which it is used, is:",back:"readily capable of causing death or other serious physical injury",subject:"PL",article:"PL Art. 10",statute:"PL 10.00(11)"},
  {id:448,front:"\"Drug trafficking felony\" refers to offenses defined in which Article of the Penal Law?",back:"Article 220",subject:"PL",article:"PL Art. 10",statute:"PL 10.00(21)"},
  {id:449,front:"T/F: Under PL 10.00, \"crime\" is a broader term than \"felony\" alone — it includes both misdemeanors and felonies.",back:"True",subject:"PL",article:"PL Art. 10",statute:"PL 10.00(6)"},
  {id:450,front:"T/F: Under PL 10.00, a \"person\" can never include a governmental instrumentality — only human beings and private entities qualify.",back:"False",subject:"PL",article:"PL Art. 10",statute:"PL 10.00(7)"},
  {id:451,front:"A person is convicted of an offense (not a traffic infraction) where imprisonment of exactly 15 days was imposed. Under the statutory thresholds, this offense is classified as a:",back:"violation, since 15 days does not exceed the violation cap",subject:"PL",article:"PL Art. 10",statute:"PL 10.00(3) vs (4)"},
  {id:452,front:"The provisions of Article 55 govern the classification and designation of:",back:"every offense, whether defined within or outside of the Penal Law",subject:"PL",article:"PL Art. 55",statute:"PL 55.00"},
  {id:453,front:"Felonies are classified, for the purpose of sentence, into how many categories?",back:"5",subject:"PL",article:"PL Art. 55",statute:"PL 55.05(1)"},
  {id:454,front:"Class A felonies are subclassified into subclass I and subclass II, known respectively as:",back:"Class A-I and Class A-II",subject:"PL",article:"PL Art. 55",statute:"PL 55.05(1)"},
  {id:455,front:"Misdemeanors are classified, for the purpose of sentence, into how many categories, and what are they?",back:"3: Class A, Class B, and Unclassified misdemeanors",subject:"PL",article:"PL Art. 55",statute:"PL 55.05(2)"},
  {id:456,front:"The particular classification/subclassification of each felony defined within the Penal Law is determined by:",back:"express designation in the section or article defining the offense",subject:"PL",article:"PL Art. 55",statute:"PL 55.10(1)(a)"},
  {id:457,front:"An offense defined OUTSIDE the Penal Law that is declared a felony without specifying its class, or for which the law provides a sentence exceeding 1 year, is deemed:",back:"a Class E felony",subject:"PL",article:"PL Art. 55",statute:"PL 55.10(1)(b)"},
  {id:458,front:"Each misdemeanor defined WITHIN the Penal Law is either a Class A or Class B misdemeanor, as designated by:",back:"the section or article defining it",subject:"PL",article:"PL Art. 55",statute:"PL 55.10(2)(a)"},
  {id:459,front:"An offense defined OUTSIDE the Penal Law and declared a misdemeanor without specifying its classification or sentence is deemed:",back:"a Class A misdemeanor",subject:"PL",article:"PL Art. 55",statute:"PL 55.10(2)(b)"},
  {id:460,front:"If a law or ordinance OUTSIDE the Penal Law defines an offense and provides a sentence of imprisonment in excess of 15 days but not in excess of 1 year (without further classification), that offense is deemed:",back:"an unclassified misdemeanor",subject:"PL",article:"PL Art. 55",statute:"PL 55.10(2)(b)"},
  {id:461,front:"T/F: An offense defined as a \"traffic infraction\" can, under some circumstances, be deemed a misdemeanor or violation by virtue of the sentence prescribed for it.",back:"False",subject:"PL",article:"PL Art. 55",statute:"PL 55.10(3)"},
  {id:462,front:"Which of the following is NOT one of the five statutory felony classes?",back:"Class F",subject:"PL",article:"PL Art. 55",statute:"PL 55.05"},
  {id:463,front:"T/F: Whether an offense is classified within the Penal Law itself or in an outside statute/ordinance, Article 55 provides a mechanism for determining its class.",back:"True",subject:"PL",article:"PL Art. 55",statute:"PL 55.10"},
  {id:464,front:"For a felony conviction under Penal Law Article 496 (corrupting the government), the fine may be up to:",back:"three times the amount of the defendant's gain from the offense",subject:"PL",article:"PL Art. 80",statute:"PL 80.00(1)(b)"},
  {id:465,front:"Under the special Article 220/221 (controlled substance) felony fine schedule, the maximum fine for a Class A-I felony is:",back:"$100,000",subject:"PL",article:"PL Art. 80",statute:"PL 80.00(1)(c)"},
  {id:466,front:"T/F: The general felony fine provisions of PL 80.00 apply equally to corporate and individual defendants.",back:"False",subject:"PL",article:"PL Art. 80",statute:"PL 80.00(4)"},
  {id:467,front:"The maximum fine for a Class A misdemeanor (non-corporate) is:",back:"$1,000",subject:"PL",article:"PL Art. 80",statute:"PL 80.05(1)"},
  {id:468,front:"The maximum fine for a Class B misdemeanor (non-corporate) is:",back:"$500",subject:"PL",article:"PL Art. 80",statute:"PL 80.05(2)"},
  {id:469,front:"For an UNCLASSIFIED misdemeanor, the fine amount is fixed by the court:",back:"in accordance with the provisions of the law or ordinance that defines the crime",subject:"PL",article:"PL Art. 80",statute:"PL 80.05(3)"},
  {id:470,front:"The maximum fine for a violation (non-corporate) is:",back:"$250",subject:"PL",article:"PL Art. 80",statute:"PL 80.05(4)"},
  {id:471,front:"As an alternative sentence for a misdemeanor or violation where the person gained money/property, the court may instead impose a fine not exceeding:",back:"double the amount of the defendant's gain from the offense",subject:"PL",article:"PL Art. 80",statute:"PL 80.05(5)"},
  {id:472,front:"T/F: The provisions of PL 80.05 (misdemeanor/violation fines) apply to corporations.",back:"False",subject:"PL",article:"PL Art. 80",statute:"PL 80.05(6)"},
  {id:473,front:"T/F: New York increased the maximum fines that may be imposed on a corporation in 2025, marking the first such increase in roughly 60 years.",back:"True",subject:"PL",article:"PL Art. 80",statute:"PL 80.10(1)"},
  {id:474,front:"Under current law, a corporation's maximum fine for a felony conviction (absent the special higher schedule for certain homicide-related offenses) is:",back:"$80,000",subject:"PL",article:"PL Art. 80",statute:"PL 80.10(1)"},
  {id:475,front:"CPLR 203 In the Supreme and County Courts, the statute of limitations is computed from the time the cause of action ________to the time the claim is _____",back:"accrues..... interposed",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 203(a"},
  {id:476,front:"CPLR 203 For statute of limitations purposes, a defense or counterclaim is inter posed when:",back:"a pleading containing it is served.",subject:"CPLR",article:"CPLR",statute:"CPLR Art. 2"},
  {id:477,front:"CPLR 204 When commencement of an action has been stayed by a court or by statutory prohibition, the duration of the stay is:",back:"not part of the time within which the action must be commenced.",subject:"CPLR",article:"CPLR",statute:"CPLR Art. 2"},
  {id:478,front:"CPLR 205 An action that is otherwise timely brought and later terminated may be recommenced within six months of the termination if the action was terminated for any reason except:",back:"(a), (b), (c), or (d).",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 205(a"},
  {id:479,front:"CPLR 205(a) Where dismissal is one for neglect to prosecute (CPLR 3216), the judge:",back:"must set forth on the record the specific conduct constituting the neglect",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 205(a"},
  {id:480,front:"CPLR 206 In an action based upon a mutual, open and current account, where there have been reciprocal demands between the parties, the time within which the action must be commenced shall be computed from:",back:"the last transaction in the account on either side",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 206(d"},
  {id:481,front:"CPLR 208(b) For an action against a defendant for injury suffered as a result of a sexual offense when the plaintiff was previously less than 18 years of age, the statute of limitations expires when the plaintiff reaches age:",back:"fifty-five.",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 208(b"},
  {id:482,front:"CPLR 210 If a person entitled to commence an action dies before the time has expired within which to bring the action, and the action survives, the action may be commenced by his representative:",back:"within one year after the person's death",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 210(a"},
  {id:483,front:"CPLR 210 If a person against whom a cause of action exists dies, the time limited for commencement of an action against his executor or administrator is tolled by:",back:"eighteen months",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 210(b"},
  {id:484,front:"CPLR 211 A money judgment is conclusively presumed to be paid and satisfied after the expiration of ______ years from the time when the party obtaining the judgment was first entitled to enforce it.",back:"twenty.",subject:"CPLR",article:"CPLR",statute:"CPLR Art. 2"},
  {id:485,front:"CPLR 212 An action to recover real property or its possession cannot be commenced more than _____ years after plaintiff was seized of or possessed the property.",back:"ten",subject:"CPLR",article:"CPLR",statute:"CPLR Art. 2"},
  {id:486,front:"CPLR 213 An action for which no limitation as to commencement is specifically prescribed by law must be commenced within:",back:"six years after the cause of action accrues",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 213(1"},
  {id:487,front:"CPLR 213 An action by or on behalf of a corporation against a present or former director, officer or stockholder for an accounting (a statement of financial condition) must be commenced within:",back:"six years",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 213(7"},
  {id:488,front:"CPLR 213 There is a six-year statute of limitations for which of the following: I An action based upon mistake II An action upon a mortgage of real property III An action based upon fraud",back:"one.",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 213"},
  {id:489,front:"CPLR 213-b In an action against a person who was criminally convicted of assault, the relevant statute of limitations for the plaintiff (\"crime victim\") to commence an action for damages suffered during the assault is:",back:"seven years.",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 213-b"},
  {id:490,front:"CPLR 213-c Generally, the statute of limitations in a civil action by a victim of rape (PL 130.35) may be brought within _________ years:",back:"twenty years",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 213-c"},
  {id:491,front:"CPLR 214 An action to recover a chattel must be commenced within:",back:"three years",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 214(3"},
  {id:492,front:"CPLR 214-f The statute of limitations for toxic exposure to a Superfund Site is the later of three years discovery (or reasonable discovery) of the injury and",back:"the designation of such an area as a Superfund Site.",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 214-f"},
  {id:493,front:"CPLR 215 The period limited for commencement of a civil action for libel or slander is:",back:"one year.",subject:"CPLR",article:"CPLR",statute:"CPLR Art. 2"},
  {id:494,front:"CPLR 215 The period within which a civil action for assault or battery usually must be commenced is:",back:"one year",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 215(3"},
  {id:495,front:"CPLR 215 An action to recover on an arbitration award must be commenced within:",back:"one year",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 215(5"},
  {id:496,front:"CPLR 217 Unless a shorter time is provided, a proceeding against a body or officer (Article 78) generally must be commenced within _________ after the determination to be reviewed becomes final and binding.",back:"four months",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 217"},
  {id:497,front:"CPLR 217-a An affirmation by which of the following made in accordance with the statutory language has the same effect as an affidavit:",back:"a person located outside the U.S. or any of its commonwealth territories, or possessions.",subject:"CPLR",article:"CPLR",statute:"CPLR Art. 2"},
  {id:498,front:"CPLR 301 The traditional basis by which the courts of a state may exercise jurisdiction over a person (i.e., in personam jurisdiction) is:",back:"presence of the person within the state",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 301"},
  {id:499,front:"CPLR 302 If a nondomiciliary makes a contract outside New York to supply goods or services in New York:",back:"a New York court has a statutory basis for exercising personal jurisdiction",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 302(a)(l"},
  {id:500,front:"CPLR 302 A nondomiciliary who regularly does business within New York State commits a tort outside the state which injures a person within the State. As to this:",back:"New York courts have a statutory basis for exercising personal jurisdiction",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 302(a)(3"},
  {id:501,front:"CPLR 302 In which one of the following would a New York court have no statutory basis for exercising personal jurisdiction over a nondomiciliary of the state, where the alleged torturous conduct occurred inside the state:",back:"defamation of character",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 302(a)(2"},
  {id:502,front:"CPLR 303 A person not subject to personal jurisdiction who commences an action in New York State and on whose behalf no attorney has appeared is deemed to designate the ________ as his agent for the service of a summons by the defendant.",back:"clerk of the court",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 303"},
  {id:503,front:"CPLR 304 Under the CPLR, an action is commenced by:",back:"filing a summons and complaint (or summons and notice)",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 304"},
  {id:504,front:"CPLR 304 A special proceeding may be commenced by: I. filing a petition II. serving a notice of petition and a petition III. filing a summons and complaint.",back:"I, only",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 304"},
  {id:505,front:"CPLR 305 If a court directs that a new party be joined in an action and the order is not made upon the new party's motion, which of the following shall be filed with the clerk and served upon the new party:",back:"a supplemental summons",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 305(a"},
  {id:506,front:"CPLR 305 With respect to proof of service of a summons:",back:"it may only be amended in a court's discretion",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 305(c"},
  {id:507,front:"CPLR 306 Proof of service shall be:",back:"in the form of a certificate, when made by an authorized public officer.",subject:"CPLR",article:"CPLR",statute:"CPLR Art. 3"},
  {id:508,front:"CPLR 306-a Select the correct answer. Upon an action commenced in the Supreme or County Court by the filing of the summons and complaint.",back:"an index number shall be assigned and the index number fee shall be paid",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 306-a"},
  {id:509,front:"CPLR 307 Personal service upon the State of New York shall be made by delivering the summons to:",back:"an Assistant Attorney-General at an office of the Attorney- General.",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 307(1"},
  {id:510,front:"CPLR 307 If personal service on a state officer sued solely in an official capacity is made to obtain personal jurisdiction, such service:",back:"may be made on the official.",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 307(2"},
  {id:511,front:"CPLR 308 Select the best answer. Personal service on a nondomiciliary when long-arm jurisdiction does not exist may be made by which one of the following:",back:"delivery of the summons to him personally, within the State",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 308"},
  {id:512,front:"CPLR 309 With regard to a person age seventeen who is married, personal service may be properly effectuated by serving:",back:"the seventeen year old and her adult spouse with whom she resides",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 309(a"},
  {id:513,front:"CPLR 309 In a civil action, a fifteen year old infant is named as a defendant. At the time service is made, the infant is home with his father and mother. In order to make proper service, the following should be served:",back:"either parent and infant.",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 309(a"},
  {id:514,front:"CPLR 310-a Personal service upon a domestic limited partnership may be made upon:",back:"any managing or general agent",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 310-a"},
  {id:515,front:"CPLR 311 Personal service of a summons on the City of New York may be made on the:",back:"Corporation Counsel",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 311(a"},
  {id:516,front:"CPLR 312 Personal service on a court of three or more judges is made by:",back:"delivering the summons to any one of the judges",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 312"},
  {id:517,front:"CPLR 312-a If a defendant properly acknowledges receipt of service of a mailed summons and complaint, he must serve an answer within _________ days after the ________ was mailed.",back:"twenty..... signed acknowledgment of receipt",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 312-a(b"},
  {id:518,front:"CPLR 312-a If a defendant refuses or fails to return the signed acknowledgment of receipt, the plaintiff is entitled to:",back:"the reasonable expense of alternative service on defendant",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 312-a(f"},
  {id:519,front:"CPLR 313 Service of a summons outside New York may be used to acquire personal jurisdiction over a person domiciled in New York if the service is made:",back:"anywhere in the world.",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 313"},
  {id:520,front:"CPLR 316 With regard to service by publication in a non-matrimonial action, service is deemed complete on a specified number of days after the first publication. The correct number of days is:",back:"twenty-eight",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 316(c"},
  {id:521,front:"CPLR 316 Where there has been service by publication in a matrimonial action, service is deemed complete on ________________ after the first publication.",back:"the twenty-first day",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 316(c"},
  {id:522,front:"CPLR 318 The designation of an agent to accept service of a summons may be made by:",back:"a natural person, corporation or partnership",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 318"},
  {id:523,front:"CPLR 320 As a general rule, the appearance of a defendant in a case without any other action on her part is most nearly equivalent to:",back:"personal service in the State of the summons upon the defendant",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 320(b"},
  {id:524,front:"CPLR 320 A defendant upon whom personal service of a summons and complaint has been made within the State has _____ days after service to appear in the action:",back:"twenty",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 320(a"},
  {id:525,front:"CPLR 320 A defendant appears in an action by:",back:"serving an answer or notice of appearance",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 320(a"},
  {id:526,front:"CPLR 321 If a party appears in an action by an attorney, the party:",back:"may also act in person with consent of the court",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 321(a"},
  {id:527,front:"CPLR 321(d) An attorney may appear on behalf of a party in a civil action or proceeding for limited purposes:",back:"unless otherwise directed by the court;",subject:"CPLR",article:"CPLR",statute:"CPLR Art. 3"},
  {id:528,front:"CPLR 325 If an action is pending in one court but it appears that the damages sustained are less than demanded and within the jurisdictional limits of a court of lower jurisdiction, a waiver of jury trial in the first court:",back:"is inoperative after removal to the lower court",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 325(c"},
  {id:529,front:"CPLR 325 \"Removal\" of an action most nearly means:",back:"the transfer of the action from one court to another",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 325"},
  {id:530,front:"CPLR 326 An order to stay proceedings for the purpose of removing an action may be made:",back:"by the court in which the action is pending or the court to which removal is sought",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 326(a"},
  {id:531,front:"CPLR 327 When a court finds that in the interest of substantial justice the action should be heard in another forum, the court may:",back:"none of the above.",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 327(a"},
  {id:532,front:"CPLR 328 In connection with a proceeding in a tribunal outside the State a New York court may order service of any document upon any person who is domiciled or can be found within the State. This order may be issued by:",back:"either the Supreme Court or a County Court",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 328(a"},
  {id:533,front:"CPLR 401 After a special proceeding is commenced, as to third party practice or intervention:",back:"leave of court is required",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 401"},
  {id:534,front:"CPLR 401 The opposing parties in a special proceeding are styled:",back:"petitioner and respondent",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 401"},
  {id:535,front:"CPLR 402 The pleading in which a cause of action for a special proceeding is stated is called a:",back:"petition",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 402"},
  {id:536,front:"CPLR 402 In a special proceeding the party against whom the claim is made (i.e., the respondent) states his defense in:",back:"an answer",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 402"},
  {id:537,front:"CPLR 403 In a special proceeding, the party bringing the proceeding must serve the papers on any adverse party at least _______ days before the time the matter is noticed to be heard:",back:"eight",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 403(b"},
  {id:538,front:"CPLR 403 In a special proceeding, if the petition is served eight days before the return date, the answer and supporting affidavits shall be served at least _______ days before such return date:",back:"two",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 403(b"},
  {id:539,front:"CPLR 403 In a special proceeding, a notice of petition shall be served:",back:"in the same manner as a summons",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 403(c"},
  {id:540,front:"CPLR 404 In a special proceeding, an objection in point of law, made by the respondent, may:",back:"be raised by a motion to dismiss the petition, or by setting it forth in the answer",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 404(a"},
  {id:541,front:"CPLR 404 In a special proceeding, an objection in point of law may:",back:"be raised by respondent or petitioner",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 404"},
  {id:542,front:"CPLR 405 The time in which a party in a special proceeding must make a motion to strike prejudicial matters unnecessarily inserted in a pleading is:",back:"within the time allowed for his responsive pleading.",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 405(b"},
  {id:543,front:"CPLR 406 In a special proceeding, motions made before the time at which the petition is noticed to be heard shall be heard",back:"on the return date of the petition",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 406"},
  {id:544,front:"CPLR 407 In a special proceeding, if the court orders severance as to any claim or party, as to such claim or party the special proceeding:",back:"may continue as an action or as a separate special proceeding",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 407"},
  {id:545,front:"CPLR 409 At a hearing conducted for a special proceeding:",back:"both (b) and (c) are correct.",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 409(a"},
  {id:546,front:"CPLR 410 At the hearing of a special proceeding:",back:"trial by jury is available only for issues triable as a matter of right by a jury",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 410"},
  {id:547,front:"CPLR 411 At the end of a special proceeding, the rights of the parties are determined by entry of:",back:"a judgment",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 411"},
  {id:548,front:"CPLR 501 A written agreement by two parties fixing venue should:",back:"be enforced, because generally the parties may agree to the place of the trial",subject:"CPLR",article:"CPLR Art. 5",statute:"CPLR 501"},
  {id:549,front:"CPLR Article 5 The venue in an action refers to:",back:"the place of trial",subject:"CPLR",article:"CPLR",statute:"CPLR Art. 5"},
  {id:550,front:"CPLR 502 Where because of joinder of claims or parties there is a conflict as to venue, the court, upon motion, shall order as the place of trial:",back:"one proper as to at least one of the parties or claims",subject:"CPLR",article:"CPLR Art. 5",statute:"CPLR 502"},
  {id:551,front:"CPLR 503 For venue purposes, an executor, administrator or testamentary guardian shall be deemed a resident of:",back:"both the county in which he resides and the county of his appointment",subject:"CPLR",article:"CPLR Art. 5",statute:"CPLR 503(b"},
  {id:552,front:"CPLR 503 For venue purposes, a foreign corporation authorized to transact business in the State shall be deemed a resident of:",back:"the county in which its principal office is located",subject:"CPLR",article:"CPLR Art. 5",statute:"CPLR 503"},
  {id:553,front:"CPLR 503 A domestic corporation, for venue purposes, is deemed a resident of any county:",back:"in which its principal office is located",subject:"CPLR",article:"CPLR Art. 5",statute:"CPLR 503(c"},
  {id:554,front:"CPLR 504 For venue purposes, the place of trial for an action against the City of New York which arose in Kings County shall be:",back:"Kings County",subject:"CPLR",article:"CPLR Art. 5",statute:"CPLR 504(3"},
  {id:555,front:"CPLR 505 When a cause of action arises against the New York City Transit Authority in one of the five counties of New York City, proper venue lies in:",back:"the county in New York City where the cause of action arose",subject:"CPLR",article:"CPLR Art. 5",statute:"CPLR 505(b"},
  {id:556,front:"CPLR 507 Venue in actions affecting title to real property lies in the county:",back:"where the property is located",subject:"CPLR",article:"CPLR Art. 5",statute:"CPLR 507"},
  {id:557,front:"CPLR 509 Except in matrimonial actions, unless venue is changed by a court order upon motion or by consent of the parties, the choice of venue which will prevail is that of the:",back:"plaintiff (c) majority of the parties",subject:"CPLR",article:"CPLR Art. 5",statute:"CPLR 509"},
  {id:558,front:"CPLR 511 A demand made to change the place of trial on the ground that the designated county is not a proper county shall be served:",back:"with or before service of the answer",subject:"CPLR",article:"CPLR Art. 5",statute:"CPLR 511(a"},
  {id:559,front:"CPLR 511 An appeal from an order changing the place of trial shall:",back:"be taken in the department in which the motion for the order was heard and determined",subject:"CPLR",article:"CPLR Art. 5",statute:"CPLR 511(d"},
  {id:560,front:"CPLR 1001 If a person who should be a plaintiff refuses to join in an action:",back:"he may be made a defendant if the court can exercise personal jurisdiction over him",subject:"CPLR",article:"CPLR Art. 10",statute:"CPLR 1001(a"},
  {id:561,front:"CPLR 1002 Select the best statement:",back:"Neither (a) nor (b) is correct.",subject:"CPLR",article:"CPLR Art. 10",statute:"CPLR 1002(c"},
  {id:562,front:"CPLR 1002 If several plaintiffs injured in a truck accident sue the trucking company in one action, this is said to be an example of:",back:"joinder.",subject:"CPLR",article:"CPLR Art. 10",statute:"CPLR 1002(a"},
  {id:563,front:"CPLR 1003 Select the correct statement:",back:"Parties may be dropped by the court at any stage of the action.",subject:"CPLR",article:"CPLR Art. 10",statute:"CPLR 1003"},
  {id:564,front:"CPLR 1003 Select the best answer. If there is a misjoinder of parties, the case should be:",back:"continued, and the improperly joined party dropped",subject:"CPLR",article:"CPLR Art. 10",statute:"CPLR 1003"},
  {id:565,front:"CPLR 1006 A person who may be exposed to multiple liability as a result of adverse claims and who utilizes the interpleader statute is called a:",back:"stakeholder",subject:"CPLR",article:"CPLR Art. 10",statute:"CPLR 1006(a"},
  {id:566,front:"CPLR 1007 A defendant serving a third-party complaint shall be known as",back:"a third-party plaintiff",subject:"CPLR",article:"CPLR Art. 10",statute:"CPLR 1007"},
  {id:567,front:"CPLR 1008 A third-party defendant responds to the claim asserted against him by serving:",back:"an answer",subject:"CPLR",article:"CPLR Art. 10",statute:"CPLR 1008"},
  {id:568,front:"CPLR 1011 A third-party defendant may proceed:",back:"against any person who may be liable to him for all or part of the third-party claim",subject:"CPLR",article:"CPLR Art. 10",statute:"CPLR 1011"},
  {id:569,front:"CPLR 1012 If the constitutionality of a statute of the State is involved in an action, the court must notify which of the following, if not already a party to the action:",back:"the Attorney-General",subject:"CPLR",article:"CPLR Art. 10",statute:"CPLR 1012(b"},
  {id:570,front:"CPLR 1015(b) If one or more of the defendants in an action dies, and the right sought to be enforced survives against the remaining defendants, the action shall:",back:"proceed",subject:"CPLR",article:"CPLR Art. 10",statute:"CPLR 1015(b"},
  {id:571,front:"CPLR 1021 Select the correct statement as to a motion for substitution:",back:"It may be made by the successors or representatives of a party, or by any party.",subject:"CPLR",article:"CPLR Art. 10",statute:"CPLR 1021"},
  {id:572,front:"CPLR 1023 Select the best statement:",back:"Only (b) and (c) are correct",subject:"CPLR",article:"CPLR Art. 10",statute:"CPLR 1023"},
  {id:573,front:"CPLR 1026 With regard to an action brought to review an administrative or operational determination of the Court of Appeals, the proper party to name as defendant is:",back:"the Chief Administrator of the Courts, in his representative capacity",subject:"CPLR",article:"CPLR Art. 10",statute:"CPLR 1026"},
  {id:574,front:"CPLR 1102 Within two days of filing a court order, permitting waiver of costs, fees and expenses in an appeal, the court clerk must:",back:"notify the court stenographer.",subject:"CPLR",article:"CPLR Art. 11",statute:"CPLR 1102(b"},
  {id:575,front:"CPLR 2101 What is the point size requirement for all papers served or filed except for the summons or exhibits?",back:"at least 10 point",subject:"CPLR",article:"CPLR Art. 21",statute:"CPLR 2101(a"},
  {id:576,front:"CPLR 2102 Except where otherwise prescribed, papers required to be filed:",back:"must be filed with the clerk of the court in which the action is triable",subject:"CPLR",article:"CPLR Art. 21",statute:"CPLR 2102"},
  {id:577,front:"CPLR 2103 Where a period of time prescribed by law is measured from the service of a paper and service is by mailing made within the state, _____ day(s) shall be added to the prescribed period.",back:"five.",subject:"CPLR",article:"CPLR Art. 21",statute:"CPLR 2103(b)(2"},
  {id:578,front:"CPLR 2103 Except where otherwise prescribed by law, papers may be served by:",back:"any non-party age eighteen or over",subject:"CPLR",article:"CPLR Art. 21",statute:"CPLR 2103(a"},
  {id:579,front:"CPLR 2103 As a general rule, a paper served on one party:",back:"must be served on every other party who has appeared",subject:"CPLR",article:"CPLR Art. 21",statute:"CPLR 2103(e"},
  {id:580,front:"CPLR 2104 Which of the following agreements between parties or their attorneys relating to a matter in an action is not binding:",back:"all of the above are binding.",subject:"CPLR",article:"CPLR Art. 21",statute:"CPLR 2104"},
  {id:581,front:"CPLR 2104 Select the best answer. A signed, written and binding agreement between parties or their attorneys relating to any matter in an action is according to the CPLR called a:",back:"stipulation",subject:"CPLR",article:"CPLR",statute:"CPLR Art. 21"},
  {id:582,front:"CPLR 2104 Which of the following is the appropriate person to file a stipulation of settlement:",back:"defendant",subject:"CPLR",article:"CPLR Art. 21",statute:"CPLR 2104"},
  {id:583,front:"CPLR 2105 Which of the following is authorized to certify a copy of a paper:",back:"any attorney admitted to practice in the courts of the State",subject:"CPLR",article:"CPLR Art. 21",statute:"CPLR 2105"},
  {id:584,front:"CPLR 2106 Ch.564,L.2025) Where permitted by law, an affirmation in lieu of an affidavit may be used:",back:"by anyone",subject:"CPLR",article:"CPLR",statute:"CPLR Art. 21"},
  {id:585,front:"CPLR 2211 An application to a court by one of the parties to an action, or by his counsel, in order to obtain an order of the court resolving a preliminary matter in the action, is most properly known as:",back:"a motion",subject:"CPLR",article:"CPLR Art. 22",statute:"CPLR 2211"},
  {id:586,front:"CPLR 2212 An ex parte motion in an action in the Supreme Court may be made to a justice out of court:",back:"anywhere in the state",subject:"CPLR",article:"CPLR Art. 22",statute:"CPLR 2212(b"},
  {id:587,front:"CPLR 2214 Generally answering affidavits to a notice of motion must be served at least _______ days before the time at which the motion is noticed to be heard (i.e., the return date).",back:"two",subject:"CPLR",article:"CPLR Art. 22",statute:"CPLR 2214(b"},
  {id:588,front:"CPLR 2214 A notice of motion and supporting affidavits must be served at least __________ days before the time at which the motion is noticed to be heard (i.e., the return date).",back:"eight",subject:"CPLR",article:"CPLR Art. 22",statute:"CPLR 2214(b"},
  {id:589,front:"CPLR 2214 An order to show cause shall be served:",back:"as specified in the order",subject:"CPLR",article:"CPLR Art. 22",statute:"CPLR 2214(d"},
  {id:590,front:"CPLR 2215 At least ______ days prior to the time at which a motion is noticed to be heard, a party may serve upon the moving party a notice of cross-motion, assuming no demand for it was made under CPLR 2214(b).",back:"three",subject:"CPLR",article:"CPLR Art. 22",statute:"CPLR 2215"},
  {id:591,front:"CPLR 2219 Generally, an order determining a motion other than one relating to a provisional remedy shall be made within ______ days after the motion is submitted for decision.",back:"sixty (d) one hundred and eighty.",subject:"CPLR",article:"CPLR Art. 22",statute:"CPLR 2219(a"},
  {id:592,front:"CPLR 2220 An order determining a motion should be entered and filed in the office of:",back:"the clerk of the court where the action is triable",subject:"CPLR",article:"CPLR Art. 22",statute:"CPLR 2220(a"},
  {id:593,front:"CPLR 2222 Select the best answer.",back:"(a), (b), and (c) are all correct.",subject:"CPLR",article:"CPLR",statute:"CPLR Art. 22"},
  {id:594,front:"CPLR 2301 A subpoena requires that:",back:"a witness attend to testify",subject:"CPLR",article:"CPLR Art. 23",statute:"CPLR 2301"},
  {id:595,front:"CPLR 2301 A subpoena duces tecum can be issued to require which of the following:",back:"the production of a negative of a photograph",subject:"CPLR",article:"CPLR Art. 23",statute:"CPLR 2301"},
  {id:596,front:"CPLR 2301 A trial subpoena duces tecum must state on its face that all papers or other items delivered to the court pursuant to the subpoena must be accompanied by:",back:"a copy of the subpoena",subject:"CPLR",article:"CPLR Art. 23",statute:"CPLR 2301"},
  {id:597,front:"CPLR 2302 If the attendance of a person is needed to give testimony but the person is confined in a penitentiary or jail the person's attendance and testimony:",back:"can be obtained by subpoena issued by the court",subject:"CPLR",article:"CPLR Art. 23",statute:"CPLR 2302(b"},
  {id:598,front:"CPLR 2302 A subpoena to compel production of an original record or document where a certified transcript or copy is admissible in evidence may be issued:",back:"by the court",subject:"CPLR",article:"CPLR Art. 23",statute:"CPLR 2302(b"},
  {id:599,front:"CPLR 2303 A person subpoenaed must be paid or tendered in advance:",back:"both (a) and (b)",subject:"CPLR",article:"CPLR Art. 23",statute:"CPLR 2303"},
  {id:600,front:"CPLR 2303 A subpoena (other than certain child support subpoenas) is generally served:",back:"in the same manner as a summons.",subject:"CPLR",article:"CPLR Art. 23",statute:"CPLR 2303"},
  {id:601,front:"CPLR 2304 Select the best answer. A motion to annul a subpoena is called a motion to:",back:"quash",subject:"CPLR",article:"CPLR Art. 23",statute:"CPLR 2304"},
  {id:602,front:"CPLR 2304 Except for certain child support subpoenas, a motion to quash a subpoena, returnable in a court:",back:"must be made in the court in which the subpoena is returnable",subject:"CPLR",article:"CPLR Art. 23",statute:"CPLR 2304"},
  {id:603,front:"CPLR 2305 Select the best answer.",back:"Both (a) and (b) are correct.",subject:"CPLR",article:"CPLR Art. 23",statute:"CPLR 2305(a"},
  {id:604,front:"CPLR 2305(b) A subpoena duces tecum may be joined with:",back:"a subpoena to testify",subject:"CPLR",article:"CPLR Art. 23",statute:"CPLR 2305(b)(1"},
  {id:605,front:"CPLR 2307 A subpoena duces tecum to be served on a department or bureau of the state requiring the production of any books, papers or other things may be issued by:",back:"both (a) and (b) are correct",subject:"CPLR",article:"CPLR Art. 23",statute:"CPLR 2307(a"},
  {id:606,front:"CPLR 2307 Unless the court orders otherwise, a motion for a subpoena duces tecum to be served on a department of a municipal corporation must be made on at least _________ notice to such department and the adverse party.",back:"one day's",subject:"CPLR",article:"CPLR Art. 23",statute:"CPLR 2307"},
  {id:607,front:"CPLR 2308 Select the best answer. A person who fails to comply with a subpoena issued by a judge, clerk, or officer of the court:",back:"all of the above are correct.",subject:"CPLR",article:"CPLR Art. 23",statute:"CPLR 2308(a"},
  {id:608,front:"CPLR 2308 If a subpoenaed person appears but unreasonably refuses to comply with the subpoena, the person may be committed to jail:",back:"until he does what is required, or is discharged according to law.",subject:"CPLR",article:"CPLR Art. 23",statute:"CPLR 2308(a"},
  {id:609,front:"CPLR 2309 Select the best answer.",back:"(a), (b) and (c) are all correct.",subject:"CPLR",article:"CPLR Art. 23",statute:"CPLR 2309(a"},
  {id:610,front:"CPLR 3004 If a party seeks to rescind a transaction that is void or voidable because of fraud:",back:"only (b) and (c) are correct",subject:"CPLR",article:"CPLR Art. 30",statute:"CPLR 3004"},
  {id:611,front:"CPLR 3011 Which of the following is not a pleading:",back:"a bill of particulars",subject:"CPLR",article:"CPLR Art. 30",statute:"CPLR 3011"},
  {id:612,front:"CPLR 3011 Select the correct statement.",back:"A defendant's pleading against another claimant is called an interpleader complaint.",subject:"CPLR",article:"CPLR Art. 30",statute:"CPLR 3011"},
  {id:613,front:"CPLR 3011 Which of the following is a pleading? I complaint II answer III reply IV answer with cross-claim V bill of particulars.",back:"I, II, III and IV, only",subject:"CPLR",article:"CPLR Art. 30",statute:"CPLR 3011"},
  {id:614,front:"CPLR 3011 A reply is served:",back:"by the plaintiff if the defendant sets up a counterclaim in his answer",subject:"CPLR",article:"CPLR Art. 30",statute:"CPLR 3011"},
  {id:615,front:"CPLR 3012 Select the best answer in connection with the service pleadings:",back:"options (a) through (d) are either all correct or all incorrect.",subject:"CPLR",article:"CPLR",statute:"CPLR Art. 30"},
  {id:616,front:"CPLR 3012 When a complaint is not served with the summons and the defendant serves a written demand for the complaint, service of the complaint must be made within _______ days after service of the demand.",back:"twenty",subject:"CPLR",article:"CPLR Art. 30",statute:"CPLR 3012(b"},
  {id:617,front:"CPLR 3013 Statements in a pleading shall be sufficiently particular to give the court and the parties notice of:",back:"(a), (b) and (c) are all correct.",subject:"CPLR",article:"CPLR Art. 30",statute:"CPLR 3013"},
  {id:618,front:"CPLR 3015 Select the best answer.",back:"Only (b) and (c) are correct.",subject:"CPLR",article:"CPLR Art. 30",statute:"CPLR 3015(a"},
  {id:619,front:"CPLR 3015 If the plaintiff is required to be licensed by the City of New York Department of Consumer Affairs, and the action stems from the licensed business conduct, the complaint must allege:",back:"(a) and (b) only.",subject:"CPLR",article:"CPLR Art. 30",statute:"CPLR 3015"},
  {id:620,front:"CPLR 3016 In an action for libel or slander:",back:"the particular words complained of must be set forth in the complaint",subject:"CPLR",article:"CPLR Art. 30",statute:"CPLR 3016(a"},
  {id:621,front:"CPLR 3016 In an action arising out of a consumer credit transaction, where a purchaser, borrower or debtor is a defendant, the contract or other written instrument on which the action is based shall be attached to the:",back:"summons",subject:"CPLR",article:"CPLR",statute:"CPLR Art. 30"},
  {id:622,front:"CPLR 3016 If the account in the preceding question was a revolving credit account, the charge-off statement may be attached to the ______________ instead of the __________________ or other ___________ _______________.",back:"complaint, contract, written instrument",subject:"CPLR",article:"CPLR",statute:"CPLR Art. 30"},
  {id:623,front:"CPLR 3017 Select the best statement.",back:"Only (a) and (c) are correct.",subject:"CPLR",article:"CPLR Art. 30",statute:"CPLR 3017(a"},
  {id:624,front:"CPLR 3018 If a party in a responsive pleading indicates that he lacks knowledge or information sufficient to form a belief as to the truth of a statement contained in the pleading to which he is responding:",back:"it has the effect of a denial as to the truth of the statement",subject:"CPLR",article:"CPLR Art. 30",statute:"CPLR 3018(a"},
  {id:625,front:"CPLR 3018 P brought suit against D. There was a final judgment for D on the merits. P is now barred from bringing a second suit against D on the same cause of action by the defense of:",back:"res judicata.",subject:"CPLR",article:"CPLR Art. 30",statute:"CPLR 3018(b"},
  {id:626,front:"CPLR 3019 Select the best answer.",back:"A counterclaim is generally asserted by a defendant against a plaintiff.",subject:"CPLR",article:"CPLR Art. 30",statute:"CPLR 3019(a"},
  {id:627,front:"CPLR 3020 Who may verify a pleading on behalf of New York State if New York State is a party to an action:",back:"any person acquainted with the facts",subject:"CPLR",article:"CPLR Art. 30",statute:"CPLR 3020(d"},
  {id:628,front:"CPLR 3022 Select the best answer.",back:"(a) and (b) are both correct.",subject:"CPLR",article:"CPLR Art. 30",statute:"CPLR 3022"},
  {id:629,front:"CPLR 3024 If a pleading is so vague or ambiguous that a party cannot reasonably frame a response he may move for a more definite statement. This motion shall be served within days after the challenged pleading is served.",back:"twenty.",subject:"CPLR",article:"CPLR Art. 30",statute:"CPLR 3024(c"},
  {id:630,front:"CPLR 3025 A supplemental pleading may be served:",back:"at any time by leave of court or by stipulation of all parties",subject:"CPLR",article:"CPLR Art. 30",statute:"CPLR 3025(b"},
  {id:631,front:"CPLR 3036 & 3037 Select the best answer with respect to the New York Simplified Procedure for Court Determination of Disputes:",back:"Generally the rules as to the admissibility of evidence do not apply.",subject:"CPLR",article:"CPLR Art. 30",statute:"CPLR 3037"},
  {id:632,front:"CPLR 3042 If a party served with a demand for a bill of particulars willfully fails to provide particulars that the court finds ought to have been provided, the court:",back:"may make a final or conditional order on the matter, as is just.",subject:"CPLR",article:"CPLR Art. 30",statute:"CPLR 3042"},
  {id:633,front:"CPLR 3042 Within how many days of service of a demand for a bill of particulars must the party so served respond to the demand?",back:"30",subject:"CPLR",article:"CPLR Art. 30",statute:"CPLR 3042(a"},
  {id:634,front:"CPLR 3044 Select the correct statement.",back:"In a negligence action, all bills of particulars must be verified.",subject:"CPLR",article:"CPLR Art. 30",statute:"CPLR 3044"},
  {id:635,front:"CPLR 3211 Select the best answer.",back:"A party may move to dismiss a defense on the ground that it has no merit.",subject:"CPLR",article:"CPLR Art. 30",statute:"CPLR 3211(b"},
  {id:636,front:"CPLR 3212 The CPLR provides that a motion for summary judgment may be generally made:",back:"after issue has been joined",subject:"CPLR",article:"CPLR Art. 30",statute:"CPLR 3212(a"},
  {id:637,front:"CPLR 3212 A motion for summary judgment may be made:",back:"by any party",subject:"CPLR",article:"CPLR Art. 30",statute:"CPLR 3212(a"},
  {id:638,front:"CPLR 3212 A motion for summary judgment shall be granted if, upon all the papers and proof submitted, ______ shall be established sufficiently to warrant the court as a matter of law in directing judgment in favor of any party.",back:"either a cause of action or a defense",subject:"CPLR",article:"CPLR Art. 30",statute:"CPLR 3212(b"},
  {id:639,front:"CPLR 3215 An application for a default judgment where plaintiff's claim is for a sum certain may be made to the clerk within _______ after default.",back:"one year . Answer ______",subject:"CPLR",article:"CPLR Art. 30",statute:"CPLR 3215(a"},
  {id:640,front:"CPLR 3221 An offer to compromise may be made:",back:"in other than a matrimonial action",subject:"CPLR",article:"CPLR Art. 30",statute:"CPLR 3221"},
  {id:641,front:"CPLR 3222 Which of the following actions may not be commenced by filing with the clerk a submission of the controversy, acknowledged by all parties in the form required to entitle a deed to be recorded:",back:"a matrimonial action",subject:"CPLR",article:"CPLR Art. 30",statute:"CPLR 3222"},
  {id:642,front:"CPLR 3401 Calendar practice and rules regulating the hearing of cases shall be adopted by the:",back:"Chief Administrator of the Courts",subject:"CPLR",article:"CPLR Art. 34",statute:"CPLR 3401"},
  {id:643,front:"CPLR 3402 A case may be placed upon the calendar by filing and serving:",back:"a note of issue",subject:"CPLR",article:"CPLR Art. 34",statute:"CPLR 3402(a"},
  {id:644,front:"CPLR 3403 Which of the following is not entitled to a trial preference:",back:"action to recover damages for chiropractic malpractice",subject:"CPLR",article:"CPLR Art. 34",statute:"CPLR 3403"},
  {id:645,front:"CPLR 3403(a)(7) A civil action which has been revived because it involves an accusation of child sexual abuse or sexual offenses:",back:"is entitled to a preference;",subject:"CPLR",article:"CPLR",statute:"CPLR Art. 34"},
  {id:646,front:"CPLR 3404 A case in the Supreme Court which has been struck from the calendar and not restored within ______ thereafter shall be deemed abandoned and shall be dismissed for neglect to prosecute.",back:"twelve months",subject:"CPLR",article:"CPLR Art. 34",statute:"CPLR 3404"},
  {id:647,front:"CPLR 3405 For all courts other than the New York City Civil Court, the Chief Judge of the Court of Appeals may promulgate rules for the arbitration of claims for the recovery of money not exceeding _________ dollars.",back:"six thousand.",subject:"CPLR",article:"CPLR Art. 34",statute:"CPLR 3405"},
  {id:648,front:"CPLR 3408 In the case of a residential foreclosure action involving a subprime home loan, any defendant appearing pro se shall be deemed to have made:",back:"a motion to proceed as a poor person",subject:"CPLR",article:"CPLR Art. 34",statute:"CPLR 3408(b"},
  {id:649,front:"CPLR 3408 At any mandatory settlement conference in a subprime residential foreclosure action, the plaintiffs counsel appearing:",back:"must be fully authorized to dispose of the case",subject:"CPLR",article:"CPLR Art. 34",statute:"CPLR 3408"},
  {id:650,front:"CPLR 4011 Who has the ultimate say in determining the sequence in which the issues at trial shall be tried:",back:"the court",subject:"CPLR",article:"CPLR Art. 40",statute:"CPLR 4011"},
