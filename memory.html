<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Memory Match — ClerkPrep</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<style>
html { overflow-x:hidden; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
body { overflow-x:hidden; min-width:0 !important; width:100% !important; max-width:100vw; }
@media screen and (max-width:768px) { * { max-width:100%; word-break:break-word; } }

:root{
  --navy:#1a1f3c;--navy-mid:#2d3561;
  --gold:#c9952a;--gold-light:#f5e6c8;
  --cream:#faf7f2;--text:#1a1f3c;--text-muted:#6b7194;
  --border:#e2ddd6;--white:#fff;
  --violet:#6b4fa0;--violet-light:#ede8f7;
  --green:#22c55e;--red:#ef4444;
  --fs-base:16px;--fs-h1:26px;
  --pad-h:20px;
}
@media(min-width:769px){ :root{--pad-h:32px;--fs-h1:30px;} }
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--text);font-family:'DM Sans',sans-serif;font-size:var(--fs-base);line-height:1.5;padding-bottom:80px}

.header{background:var(--navy);padding:20px var(--pad-h);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.header h1{font-family:'DM Serif Display',serif;color:#fff;font-size:var(--fs-h1)}
.header a.back{color:var(--gold-light);text-decoration:none;font-size:13px;font-weight:600}

.mode-tabs{display:flex;gap:8px;max-width:1000px;margin:16px auto 0;padding:0 var(--pad-h);flex-wrap:wrap}
.mode-tab{background:var(--white);border:1px solid var(--border);border-radius:20px;padding:9px 18px;font-size:13px;font-weight:700;color:var(--text-muted);cursor:pointer}
.mode-tab.active{background:var(--navy);color:var(--gold);border-color:var(--navy)}

.filter-row{max-width:1000px;margin:14px auto 0;padding:0 var(--pad-h);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter-chip{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:6px 14px;font-size:12px;font-weight:700;color:var(--text-muted);cursor:pointer}
.filter-chip.active{background:var(--violet-light);border-color:var(--violet);color:var(--violet)}

.container{max-width:1000px;margin:20px auto 0;padding:0 var(--pad-h)}

/* ── FLASHCARD MODE ── */
.card-stage{display:flex;flex-direction:column;align-items:center;gap:18px}
.flip-card{width:100%;max-width:520px;min-height:280px;height:auto;perspective:1200px;cursor:pointer}
.flip-inner{position:relative;width:100%;min-height:280px;transition:transform .5s;transform-style:preserve-3d}
.flip-card.flipped .flip-inner{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;box-shadow:0 8px 24px rgba(26,31,60,.12);overflow-y:auto;max-height:100%}
.flip-front{background:var(--white);border:1px solid var(--border)}
.flip-back{background:var(--navy);color:#fff;transform:rotateY(180deg)}
.card-article{font-family:Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--violet);margin-bottom:14px}
.flip-back .card-article{color:var(--gold-light)}
.card-text{font-family:'DM Serif Display',serif;font-size:clamp(15px,4vw,20px);line-height:1.4;overflow-wrap:break-word;word-break:break-word;max-width:100%}
.card-hint{position:absolute;bottom:14px;font-family:Arial,sans-serif;font-size:11px;color:var(--text-muted)}
.flip-back .card-hint{color:rgba(255,255,255,.5)}

.card-controls{display:flex;align-items:center;gap:14px}
.ctrl-btn{background:var(--white);border:1px solid var(--border);border-radius:50%;width:52px;height:52px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ctrl-btn:active{transform:scale(.92)}
.card-progress{font-family:Arial,sans-serif;font-size:13px;color:var(--text-muted);font-weight:700}
.know-row{display:flex;gap:10px;margin-top:6px}
.know-btn{border:none;border-radius:10px;padding:12px 22px;font-family:Arial,sans-serif;font-size:14px;font-weight:700;cursor:pointer}
.know-btn.no{background:var(--red);color:#fff}
.know-btn.yes{background:var(--green);color:#fff}
.shuffle-btn{background:var(--violet-light);color:var(--violet);border:1px solid var(--violet);border-radius:8px;padding:8px 16px;font-family:Arial,sans-serif;font-size:12px;font-weight:700;cursor:pointer}

/* ── MATCH GAME MODE ── */
.match-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-family:Arial,sans-serif}
.match-timer{font-size:22px;font-weight:800;color:var(--navy)}
.match-stats{font-size:13px;color:var(--text-muted)}
.match-hint{font-family:Arial,sans-serif;font-size:12px;color:var(--text-muted);margin-bottom:12px;text-align:center}
.match-columns{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.match-col{display:flex;flex-direction:column;gap:8px}
.match-col-head{font-family:Arial,sans-serif;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:6px;border-radius:6px;margin-bottom:2px}
.col-head-q{background:#4a86e8;color:#fff}
.col-head-a{background:#2fa360;color:#fff}
.match-tile{position:relative;background:var(--white);border:2px solid var(--border);border-radius:10px;padding:12px 10px;min-height:64px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;line-height:1.35;cursor:pointer;user-select:none}
.match-tile.tile-q{border-color:#8fb8e8;background:#eef5fd}
.match-tile.tile-a{border-color:#a8d5b5;background:#eefbf1}
.match-tile.selected{border-color:var(--violet);background:var(--violet-light)}
.match-tile.matched{background:rgba(34,197,94,.12);border-color:var(--green);color:var(--green);opacity:.55;cursor:default}
.match-tile.wrong{border-color:var(--red);background:rgba(239,68,68,.1);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.match-complete{text-align:center;padding:40px 20px}
.match-complete h2{font-family:'DM Serif Display',serif;font-size:26px;color:var(--navy);margin-bottom:10px}

.bottom-nav-bar{position:fixed;bottom:0;left:0;right:0;height:60px;background:#fff;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;padding:0 8px;z-index:999}
.bnb-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 12px;border-radius:10px;text-decoration:none;color:#9ca3af;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;min-width:56px}
.bnb-icon{font-size:20px;line-height:1}

/* iPhone safe-area (Dynamic Island + home indicator) support */
body{padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
.bottom-nav-bar{padding-bottom:env(safe-area-inset-bottom,0px)!important;height:auto!important;padding-top:10px!important}
</style>
</head>

<script>
const CARDS = [
  {id:1,front:"A criminal action against an Adolescent Offender must be commenced in a:",back:"youth part of a superior court",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.10"},
  {id:2,front:"An accusatory instrument against a 16-year-old charged with only petty offenses must be filed in a:",back:"local criminal court",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.10"},
  {id:3,front:"A criminal action may be commenced in a superior criminal court when the defendant:",back:"has never been held for grand jury action by a local criminal court",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.10"},
  {id:4,front:"Criminal courts and family courts have ____________ jurisdiction over family offenses:",back:"concurrent",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.07"},
  {id:5,front:"A Felony Complaint must: 1) specify the name of the court where it is filed 2) specify the title of the action 3) designate the offenses charged 4) be subscribed and verified by a person 5) be filed in a superior criminal court",back:"1, 2, 3 and 4",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.10"},
  {id:6,front:"A request for a supporting deposition must be made: 1) before arraignment 2) before a guilty plea is entered 3) before commencement of a trial 4) no more than 30 days after the court date on a simplified information 5) in person",back:"2, 3 and 4",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.25"},
  {id:7,front:"A person may verify (swear to) a supporting deposition before a desk officer at a police station.",back:"True",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.30"},
  {id:8,front:"The rules for joinder of offenses and joinder of defendants for a Prosecutor's Information are the same as the rules applicable to Indictments.",back:"True",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.35"},
  {id:9,front:"A Simplified Information becomes facially insufficient if the complainant fails to comply with an order to file a/an ____________ within the ____________ applicable time frame.",back:"supporting deposition",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.40"},
  {id:10,front:"The rules governing bills of particulars for a/an ____________ are also applicable to an Information, Prosecutor's Information, and Misdemeanor Complaint.",back:"indictment",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.45"},
  {id:11,front:"When the offenses charged in a local criminal court accusatory instrument were allegedly committed in New York City, it must be filed in a:",back:"New York City Criminal Court",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.55"},
  {id:12,front:"A Felony Complaint must be filed in a Town or Village Court in the same town where the offenses were allegedly committed.",back:"False",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.55"},
  {id:13,front:"A Youth Part accusatory instrument may be filed with the Superior Court in the ____________ where the offenses charged were allegedly committed.",back:"county",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.55"},
  {id:14,front:"If an accusatory instrument may be properly filed in two or more local criminal courts, it may be filed in more than one court.",back:"False",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.55"},
  {id:15,front:"A person may be compelled to appear for arraignment on an accusatory instrument that has not yet been filed with the court.",back:"True",subject:"CPL",article:"CPL Art. 110",statute:"CPL 110.10"},
  {id:16,front:"A warrant of arrest must be issued by a local criminal court.",back:"True",subject:"CPL",article:"CPL Art. 120",statute:"CPL 120.10"},
  {id:17,front:"A warrant of arrest must contain: 1) defendant's name 2) issuing court's name 3) judge's signature 4) date of execution 5) offenses charged",back:"1, 2, 3 and 5",subject:"CPL",article:"CPL Art. 120",statute:"CPL 120.10"},
  {id:18,front:"Only one copy of an arrest warrant may be issued.",back:"False",subject:"CPL",article:"CPL Art. 120",statute:"CPL 120.10"},
  {id:19,front:"A local criminal court cannot issue an arrest warrant against a defendant who has not been arraigned and come under the control of the court when the criminal action is commenced by filing a:",back:"simplified traffic information",subject:"CPL",article:"CPL Art. 120",statute:"CPL 120.20"},
  {id:20,front:"When a criminal action has been commenced in a local criminal court against a defendant who has not been arraigned and come under the control of the court, the court may issue a summons instead of an arrest warrant if:",back:"the court is satisfied that the defendant will respond to it",subject:"CPL",article:"CPL Art. 120",statute:"CPL 120.20"},
  {id:21,front:"When issuing an arrest warrant, the following court types may attach one or more copies of the accusatory instrument to the warrant: 1) City Court 2) District Court 3) Town Court 4) Village Court 5) NYC Criminal Court",back:"3 and 4",subject:"CPL",article:"CPL Art. 120",statute:"CPL 120.40"},
  {id:22,front:"An arrest warrant may be executed by a parole officer within their geographical area of employment when:",back:"the defendant is under parole supervision",subject:"CPL",article:"CPL Art. 120",statute:"CPL 120.55"},
  {id:23,front:"A warrant of arrest may be executed: 1) only between 6:00AM and 9:00PM 2) on any day of the week 3) on any day of the week, except Sunday 4) at any hour of the day or night 5) only on Monday through Friday",back:"2 and 4",subject:"CPL",article:"CPL Art. 120",statute:"CPL 120.80"},
  {id:24,front:"Upon arresting a defendant on an arrest warrant, a police officer must ____________ the defendant before bringing them before the local criminal court or youth part of a superior court where the arrest warrant is returnable.",back:"fingerprint",subject:"CPL",article:"CPL Art. 120",statute:"CPL 120.90"},
  {id:25,front:"The limiting period within which a prosecution for murder (class A felony) must be commenced is:",back:"none of the foregoing.",subject:"CPL",article:"CPL Art. 30",statute:"CPL 30.10"},
  {id:26,front:"Except as otherwise provided, prosecution for a misdemeanor charge must generally be commenced, after its commission, within:",back:"two years",subject:"CPL",article:"CPL Art. 30",statute:"CPL 30.10"},
  {id:27,front:"Prosecution for a crime must generally be commenced:",back:"within five years after commission, for some felonies",subject:"CPL",article:"CPL Art. 30",statute:"CPL 30.10-3"},
  {id:28,front:"According to New York CPL, a criminal action:",back:"has preference over other criminal actions, if the defendant is in sheriff's custody",subject:"CPL",article:"CPL Art. 30",statute:"CPL 30.20"},
  {id:29,front:"Zillions, a rich man, was arraigned and released on bail. Beggar, a poor man, committed a crime, was arraigned and committed to the sheriff's custody while awaiting trial.",back:"Beggar must be brought to trial before Zillions, if practicable",subject:"CPL",article:"CPL Art. 30",statute:"CPL 30.20-2"},
  {id:30,front:"Generally for a felony other than certain homicides, the indictment is subject to being dismissed if the People are not ready for trial within:",back:"six months",subject:"CPL",article:"CPL Art. 30",statute:"CPL 30.30-1(a)"},
  {id:31,front:"Bud was arrested and a criminal action was commenced against him for driving while intoxicated, a misdemeanor punishable by more than three months in jail. To meet speedy trial requirements the prosecution must be ready for trial within:",back:"ninety days.",subject:"CPL",article:"CPL Art. 30",statute:"CPL 30.30-1(b)"},
  {id:32,front:"(New, 2026) Whenever a prosecutor states or otherwise provides notice that the People are ready for trial, the court shall:",back:"make inquiry on the record as to their actual readiness",subject:"CPL",article:"CPL Art. 30",statute:"CPL 30.30(5)"},
  {id:33,front:"A criminal action may be commenced in a local criminal court:",back:"by filing either an information, misdemeanor complaint or felony complaint.",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.05"},
  {id:34,front:"A criminal action is generally commenced:",back:"by filing an accusatory instrument",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.05"},
  {id:35,front:"If more than one accusatory instrument is filed in the course of the same criminal action:",back:"the action is commenced when the first is filed",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.05"},
  {id:36,front:"A superior court action against an adult defendant who has never been held by a local criminal court on the same matter is commenced by:",back:"a grand jury indictment",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.05"},
  {id:37,front:"As to specified family offenses, a criminal court's jurisdiction:",back:"is concurrent with that of the family court",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.07"},
  {id:38,front:"An information is an accusation filed with a local criminal court:",back:"charging a person with an offense other than a felony",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.10-1"},
  {id:39,front:"A simplified traffic information is a written accusation filed with a local criminal court charging a defendant with a traffic offense, and which:",back:"can be made only by a police officer or other authorized person",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.10-2"},
  {id:40,front:"A prosecutor's information is an accusation by a district attorney, filed with a local criminal court:",back:"which may commence a criminal action in some cases",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.10-3"},
  {id:41,front:"An information charging a defendant with a crime must contain: 1. a designation of the crime 2. the names of the prosecutor's witnesses 3. the evidentiary allegations which support the charges 4. signature of the complainant",back:"1, 3 and 4, only",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.15"},
  {id:42,front:"A supporting deposition:",back:"is always a written instrument",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.20"},
  {id:43,front:"A supporting deposition is filed in connection with:",back:"an information or a misdemeanor complaint.",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.20"},
  {id:44,front:"The fact that an accusatory instrument is verified means:",back:"the statements contained therein are sworn to",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.30"},
  {id:45,front:"Tom will be going to trial in one month for a misdemeanor specified in a prosecutor's information. Prior to trial another prosecutor's information is filed against Tom for the same misdemeanor. In this situation:",back:"the second instrument supersedes the first",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.50-1"},
  {id:46,front:"A local criminal court accusatory instrument may be filed with the New York Criminal Court:",back:"for an offense allegedly committed in New York City",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.55-2"},
  {id:47,front:"Conduct in Town S within County A leads to a felony complaint against an adult. This felony complaint against the adult may be filed:",back:"in any town or village court within County A.",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.55-6"},
  {id:48,front:"A local criminal court accusatory instrument may be filed in the local criminal court where the offense allegedly occurred:",back:"with the court while it is duly operating an off-hours arraignment part",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.55-11"},
  {id:49,front:"The function of a warrant of arrest is:",back:"to bring a defendant into court for arraignment",subject:"CPL",article:"CPL Art. 120",statute:"CPL 120.10-1"},
  {id:50,front:"In a warrant of arrest, a defendant:",back:"may be identified by description, without using a name",subject:"CPL",article:"CPL Art. 120",statute:"CPL 120.10-2"},
  {id:51,front:"A warrant of arrest in a criminal case must include the: 1. name of the court where the warrant is returnable 2. time and place of the crime 3. date the warrant is issued",back:"1 and 3, but not 2.",subject:"CPL",article:"CPL Art. 120",statute:"CPL 120.10-2"},
  {id:52,front:"A defendant has been charged in a filed accusatory instrument, sufficient on its face, with a felony. The court is satisfied that the defendant will respond to the charge when he learns of it. In this situation the court:",back:"has no authority to issue a warrant of arrest",subject:"CPL",article:"CPL Art. 120",statute:"CPL 120.20-3"},
  {id:53,front:"An adult defendant is out on parole from a sentence in an earlier case. The local criminal court has just issued a warrant for his arrest on an unrelated charge. The warrant may be executed by:",back:"a parole officer or police officer",subject:"CPL",article:"CPL Art. 120",statute:"CPL 120.55"},
  {id:54,front:"When a police officer delegates another police officer to execute a warrant of arrest, the first police officer may do so:",back:"by mail or telecommunication",subject:"CPL",article:"CPL Art. 120",statute:"CPL 120.60-3"},
  {id:55,front:"A warrant of arrest issued by the District Court of Nassau County may be executed:",back:"anywhere in the state, without endorsement.",subject:"CPL",article:"CPL Art. 120",statute:"CPL 120.70"},
  {id:56,front:"A warrant of arrest issued by the town court of the Town of Hillsdale, New York (located in Columbia County) may be executed:",back:"in Columbia County or in an adjoining county.",subject:"CPL",article:"CPL Art. 120",statute:"CPL 120.70-2"},
  {id:57,front:"A warrant of arrest may be executed on any day of the week and at any hour of the day or night:",back:"regardless of the offense on which it is based",subject:"CPL",article:"CPL Art. 120",statute:"CPL 120.80-1"},
  {id:58,front:"The use of deadly physical force by a police officer in making an arrest pursuant to a warrant of arrest is:",back:"governed by Penal Law provisions",subject:"CPL",article:"CPL Art. 120",statute:"CPL 120.80-3"},
  {id:59,front:"A police officer has a warrant of arrest for Brown. When the officer arrives at Brown's residence, where Brown lives alone, and informs Brown of his authority and purpose, Brown refuses to let him in. According to CPL, the officer:",back:"may break into the premises.",subject:"CPL",article:"CPL Art. 120",statute:"CPL 120.80-4, 5"},
  {id:60,front:"(Replaced, 2026) A state or local law enforcement officer who arrests an individual legally charged with the care or custody of a child less than eighteen years old shall, to the extent practicable, at the time of the arrest:",back:"take appropriate action that is conducive to the child's safety and security",subject:"CPL",article:"CPL Art. 120",statute:"CPL 120.85 & 140.17"},
  {id:61,front:"Except for electronic arraignment, when authorized, when a defendant is arrested on a warrant of arrest, he must be brought before the issuing court:",back:"without unnecessary delay",subject:"CPL",article:"CPL Art. 120",statute:"CPL 120.90-1"},
  {id:62,front:"When a defendant is arrested pursuant to a warrant, fingerprinting and other preliminary police duties should be performed:",back:"without unnecessary delay.",subject:"CPL",article:"CPL Art. 120",statute:"CPL 120.90-6"},
  {id:63,front:"Upon arresting a juvenile offender or adolescent offender, a police officer must notify the parents:",back:"immediately",subject:"CPL",article:"CPL Art. 120",statute:"CPL 120.90-7"},
  {id:64,front:"When it is impossible to commit a particular crime without, at the same time, committing by the same conduct another offense of lesser grade or degree, the latter is with respect to the former:",back:"a lesser included offense",subject:"CPL",article:"CPL Art. 1",statute:"CPL 1.20-37"},
  {id:65,front:"A petition for extension of placement shall be filed at least __ days prior to the expiration of the period of placement, except for good cause shown, but in no event after original placement expiration date.",back:"60",subject:"FCA",article:"FCA Art. 3",statute:"FCA 355.3,7"},
  {id:66,front:"A Felony complaint: 1) is a verified written accusation by a person 2) may not serve as a basis for prosecution 3) must be filed with a superior court 4) may serve as a basis for prosecution",back:"1 and 2 only",subject:"CPL",article:"CPL Art. 1",statute:"CPL 1.20-8"},
  {id:67,front:"(Best answer) According to the CPL, insofar as is practicable, defendant John Doe, incarcerated for the offense of petit larceny and bail being set in the amount of $500.00, has trial preference over:",back:"defendant John Doe has trial preference as to all of the above",subject:"CPL",article:"CPL Art. 30",statute:"CPL 30.20-1"},
  {id:68,front:"A motion to dismiss must be granted for lack of a speedy trial where the people are not ready for trial within ____ wherein the defendant is charged with a misdemeanor punishable by a sentence of imprisonment of not more than 3 months.",back:"60 days",subject:"CPL",article:"CPL Art. 30",statute:"CPL 30.30-1(c)"},
  {id:69,front:"When a defendant is held for the action of a grand jury, all pertinent documents must be promptly transmitted from a local criminal court to:",back:"the superior court",subject:"CPL",article:"CPL Art. 180",statute:"CPL 180.30-2"},
  {id:70,front:"The felony complaint:",back:"is promptly transmitted to the superior court",subject:"CPL",article:"CPL Art. 180",statute:"CPL 180.75-3(a)"},
  {id:71,front:"At the defendant's arraignment upon a felony complaint, the court must inform him of the charge(s) against him:",back:"immediately",subject:"CPL",article:"CPL Art. 180",statute:"CPL 180.10-1"},
  {id:72,front:"The court must inform the defendant that the primary purpose of the proceedings upon such felony complaint is:",back:"to determine whether the defendant is to be held for the action of the grand jury",subject:"CPL",article:"CPL Art. 180",statute:"CPL 180.10-1"},
  {id:73,front:"That the defendant, has a right to a ______ to determine if there is sufficient evidence:",back:"a prompt hearing",subject:"CPL",article:"CPL Art. 180",statute:"CPL 180.10-2"},
  {id:74,front:"(Best answer) An information, a misdemeanor complaint or a felony complaint must contain:",back:"b and c above.",subject:"CPL",article:"CPL Art. 100",statute:"CPL 100.15"},
  {id:75,front:"Witnesses appearing before the grand jury may be given an oath or sworn by:",back:"the foreman or any grand juror",subject:"CPL",article:"CPL Art. 190",statute:"CPL 190.25-2"},
  {id:76,front:"A defendant may waive indictment and consent to be prosecuted by superior court information:",back:"at any time prior to the filing of an indictment",subject:"CPL",article:"CPL Art. 195",statute:"CPL 195.10-1,2b"},
  {id:77,front:"A defendant is not an \"eligible defendant\" for a judicial diversion program if he/she, within the preceding ten years, has previously been convicted of: 1) any crime 2) a violent felony offense 3) any felony 4) a class 'A' felony",back:"2 and 4 only",subject:"CPL",article:"CPL Art. 216",statute:"CPL 216.00-1a"},
  {id:78,front:"Statute of limitations for JD misdemeanors is 2 years or up to respondent's ____ birthday, whichever occurs earlier.",back:"18",subject:"FCA",article:"FCA Art. 3",statute:"FCA 302.2"},
  {id:79,front:"Restrictive placement (designated class A felony) shall be for a period of ____ years.",back:"5",subject:"FCA",article:"FCA Art. 3",statute:"FCA 353.5"},
  {id:80,front:"The court, in its discretion, may permit a defendant who has entered a plea of guilty to the entire indictment or to part of the indictment, to withdraw such plea:",back:"at any time before the imposition of sentence",subject:"CPL",article:"CPL Art. 220",statute:"CPL 220.60-3"},
  {id:81,front:"At the conclusion of the summations, the court must deliver a charge to the jury. Requests to charge may be made: 1) only in writing 2) only before the court's charge 3) both before and after the court's charge 4) orally or in writing",back:"3 and 4 only",subject:"CPL",article:"CPL Art. 300",statute:"CPL 300.10-1,5"},
  {id:82,front:"Upon the initial hearing of a defendant found not responsible by reason of mental disease or defect, the district attorney must establish that the defendant:",back:"has a dangerous mental disorder or is mentally ill",subject:"CPL",article:"CPL Art. 330",statute:"CPL 330.20-6"},
  {id:83,front:"T/F? Court may on its own motion substitute neglect petition for an abuse petition.",back:"True",subject:"FCA",article:"FCA Art. 10",statute:"FCA 1031"},
  {id:84,front:"Upon a single judge trial of an information, if the information contains more than one count the court must render a verdict upon each count not previously dismissed. A verdict which does not so dispose of each count:",back:"constitutes a verdict of not guilty as to each undisposed count",subject:"CPL",article:"CPL Art. 350",statute:"CPL 350.10-5"},
  {id:85,front:"In the jury trial of an information, the maximum combined number of peremptory challenges both sides may use in selecting the regular jurors and alternate jurors if the number of alternate jurors is to be two, is:",back:"8",subject:"CPL",article:"CPL Art. 360",statute:"CPL 360.30,35"},
  {id:86,front:"A document that constitutes the authority for execution of the sentence and serves as the order of commitment is:",back:"a sentence and commitment or certificate of conviction",subject:"CPL",article:"CPL Art. 380",statute:"CPL 380.60"},
  {id:87,front:"Willful failure to comply with Article 10 order can be punished by jail up to___:",back:"6 months",subject:"FCA",article:"FCA Art. 10",statute:"FCA 1072"},
  {id:88,front:"Which of the following statements relating to a child abuse proceeding is correct?",back:"FC and criminal court can have concurrent proceedings.",subject:"FCA",article:"FCA Art. 10",statute:"FCA 1014"},
  {id:89,front:"Which of the following is false? VENUE of a proceeding under article 10 of the FCA may be:",back:"county where child resided at time child abuse act occurred",subject:"FCA",article:"FCA Art. 10",statute:"FCA 1015"},
  {id:90,front:"If at any time during the period of a sentence of probation or conditional discharge the court receives a request for a declaration of delinquency by a probation officer, it shall make a decision on such request within:",back:"72 hours",subject:"CPL",article:"CPL Art. 410",statute:"CPL 410.30"},
  {id:91,front:"A fine, restitution or reparation imposed by a local criminal court shall be imposed by a written order of the court containing the amount to be paid by the defendant. The district attorney must file a certified copy of the order with:",back:"the county clerk",subject:"CPL",article:"CPL Art. 420",statute:"CPL 420.10-6"},
  {id:92,front:"(Incorrect answer) When a court imposes a fine upon an individual, the court may direct that the defendant:",back:"none of the above is correct",subject:"CPL",article:"CPL Art. 420",statute:"CPL 420.10"},
  {id:93,front:"When the court has imposed a sentence of imprisonment and such sentence is in accordance with law, such sentence may not be changed, suspended or interrupted:",back:"once the term or period of the sentence has commenced",subject:"CPL",article:"CPL Art. 430",statute:"CPL 430.10"},
  {id:94,front:"Evidence at an article 10 fact finding hearing must be: 1. Material 2. Relevant 3. Competent",back:"1 and 2 and 3",subject:"FCA",article:"FCA Art. 10",statute:"FCA 1046"},
  {id:95,front:"Subsequent permanency hearings shall be commenced no later than ____ after the completion of the previous permanency hearing and shall be completed within ____ of commencement.",back:"6 months-------30 days",subject:"FCA",article:"FCA Art. 10-A",statute:"FCA 1089"},
  {id:96,front:"Securing order means an order of a court: 1) committing a principal to the custody of the sheriff 2) fixing bail 3) releasing the defendant on his own recognizance 4) holding the defendant for the action of the grand jury",back:"1, 2 and 3 only",subject:"CPL",article:"CPL Art. 500",statute:"CPL 500.10-5"},
  {id:97,front:"A secured bail bond means a bond secured by personal property that has a value equal to or greater than the total amount of the undertaking, or real property having a value of:",back:"twice the amount of the undertaking",subject:"CPL",article:"CPL Art. 500",statute:"CPL 500.10-17"},
  {id:98,front:"The local social services district must serve the notice of the permanency hearing and the permanency hearing report at least ___ days before the scheduled hearing.",back:"14",subject:"FCA",article:"FCA Art. 10-A",statute:"FCA 1089"},
  {id:99,front:"Which is not correct? On application by presentment agency, court may issue a TOP against Respondent:",back:"on notice only",subject:"FCA",article:"FCA Art. 3",statute:"FCA 304.2"},
  {id:100,front:"Court may not revoke an order of probation or conditional discharge unless: 1. court finds that respondent violated condition 2. respondent has had an opportunity to be heard",back:"both 1 & 2",subject:"CPL",article:"CPL Art. 410",statute:"CPL 410.70-1"},
  {id:101,front:"When a superior court, following a hearing, finds that a defendant is not an incapacitated person:",back:"the action against the defendant must proceed",subject:"CPL",article:"CPL Art. 730",statute:"CPL 730.50-1"},
  {id:102,front:"A person committing the violation of driving while ability impaired shall be a traffic infraction and may be punishable by imprisonment in a penitentiary or county jail for not more than:",back:"15 days",subject:"MISC",article:"Uniform Rules",statute:"VTL 1193"},
  {id:103,front:"A timely motion to prevent removal by the prosecutor must be:",back:"all of the above.",subject:"MISC",article:"Uniform Rules",statute:"VTL 722.23-1B, C"},
  {id:104,front:"Each attorney appearing in a criminal action is required to file a written notice of appearance on or before the attorney's first appearance in court no later than:",back:"10 days after appointment or retainer",subject:"MISC",article:"Uniform Rules",statute:"Uniform Rules 200.5"},
  {id:105,front:"Any offense not defined in the Penal Law that is declared by law to be a misdemeanor shall be deemed a:",back:"unclassified misdemeanor",subject:"PL",article:"PL Art. 55",statute:"PL 55"},
  {id:106,front:"Any offense not defined in the Penal Law that is declared by law to be a felony shall be deemed a:",back:"E felony",subject:"PL",article:"PL Art. 55",statute:"PL 55"},
  {id:107,front:"Maximum period of placement for JD is: ____felony and ____for a misdemeanor",back:"18 months, 12 months",subject:"FCA",article:"FCA Art. 3",statute:"FCA 353.3"},
  {id:108,front:"Choose best answer: A proceeding where the alleged charge is ____, must be commenced within statute of limitations or respondent's 20th birthday, whichever occurs earlier.",back:"a designated felony",subject:"FCA",article:"FCA Art. 3",statute:"FCA 302.2"},
  {id:109,front:"A JD ____ be fingerprinted if he has committed an A or B felony and he is ____ or older.",back:"shall .... 11",subject:"FCA",article:"FCA Art. 3",statute:"FCA 306.1"},
  {id:110,front:"Restitution in a JD proceeding in a maximum amount up to can be ordered by the court.",back:"None of the above.",subject:"FCA",article:"FCA Art. 3",statute:"FCA 353.6"},
  {id:111,front:"Parent or child's attorney may request a hearing to determine whether a child removed from home should be returned. Such hearing shall be held within ____ of the request and shall not be adjourned.",back:"3 court days",subject:"FCA",article:"FCA Art. 10-C",statute:"FCA 1094"},
  {id:112,front:"Court may continue placement until child's ____ birthday without his consent. Placement cannot continue beyond the child's ____ birthday.",back:"18th -----21st",subject:"FCA",article:"FCA Art. 10-A",statute:"FCA 1089"},
  {id:113,front:"A motion to return to foster care placement cannot be made by a youth over the age of ____.",back:"21 years old",subject:"FCA",article:"FCA Art. 10-B",statute:"FCA 1091"},
  {id:114,front:"Petition to extend PINS placement shall be filed at least ____ days before expiration of placement.",back:"60",subject:"FCA",article:"FCA Art. 7",statute:"FCA 756"},
  {id:115,front:"The age requirement for a PINS is:",back:"under the age of 18",subject:"FCA",article:"FCA Art. 7",statute:"FCA 712"},
  {id:116,front:"T/F? To be considered members of the same family or household, persons who have a child in common must have lived together at some time.",back:"False",subject:"FCA",article:"FCA Art. 8",statute:"FCA 812"},
  {id:117,front:"T/F? When the FC is not in session, an arrest or initial appearance of a respondent may be in a CC.",back:"True",subject:"FCA",article:"FCA Art. 8",statute:"FCA 821"},
  {id:118,front:"Restitution in a family offense proceeding can be up to _________",back:"$10,000",subject:"FCA",article:"FCA Art. 8",statute:"FCA 841"},
  {id:119,front:"T/F: Amount of interest awarded on a verdict, report, or decision shall be computed by the clerk of the court.",back:"True",subject:"CPLR",article:"CPLR Art. 50",statute:"CPLR 5001"},
  {id:120,front:"The 3 general time periods for the calculation of interest on a judgment are:",back:"all of the above",subject:"CPLR",article:"CPLR Art. 50",statute:"CPLR 5001"},
  {id:121,front:"Request for relief from a judgment based on excusable default must be made within ____ after service of a copy of order or judgment with written notice of entry.",back:"1 year",subject:"CPLR",article:"CPLR Art. 50",statute:"CPLR 5015"},
  {id:122,front:"Interest is recoverable from:",back:"all of the above.",subject:"CPLR",article:"CPLR Art. 50",statute:"CPLR 5001"},
  {id:123,front:"The current rate of interest on a judgment is:",back:"9 percent per year, on original amount.",subject:"CPLR",article:"CPLR",statute:"CPLR Art. 50"},
  {id:124,front:"A motion for relief from judgment or order based on excusable default must be made within _____ of service of copy of judgment or order.",back:"1 year",subject:"CPLR",article:"CPLR",statute:"CPLR Art. 50"},
  {id:125,front:"Wedding ring is exempt from application to satisfaction of judgment if it doesn't exceed $:",back:"$1,000",subject:"CPLR",article:"CPLR Art. 52",statute:"CPLR 5205"},
  {id:126,front:"T/F: Seat or pew in place of worship is exempt from application to satisfaction of a judgment.",back:"True",subject:"CPLR",article:"CPLR Art. 52",statute:"CPLR 5205"},
  {id:127,front:"T/F: The procedures in CPLR art 52 relating to enforcement of money judgments are applicable to judgments against NYS.",back:"False",subject:"CPLR",article:"CPLR Art. 52",statute:"CPLR 5207"},
  {id:128,front:"A receiver shall be entitled to necessary expenses and to a commission not exceeding _____ percent of the sums received and disbursed by him.",back:"5%",subject:"CPLR",article:"CPLR Art. 52",statute:"CPLR 5228"},
  {id:129,front:"T/F: The party who appeals is known as the appellant.",back:"True",subject:"CPLR",article:"CPLR Art. 55",statute:"CPLR 5511"},
  {id:130,front:"A notice of appeal must be served and filed within _____ days after service upon appellant of a copy or order and written notice of its entry.",back:"30",subject:"CPLR",article:"CPLR Art. 55",statute:"CPLR 5513"},
  {id:131,front:"T/F: A habeas corpus proceeding is not a special proceeding.",back:"False",subject:"CPLR",article:"CPLR Art. 70",statute:"CPLR 7001"},
  {id:132,front:"T/F: Petition for writ of habeas corpus may be made to any supreme court justice.",back:"True",subject:"CPLR",article:"CPLR Art. 70",statute:"CPLR 7002"},
  {id:133,front:"Where detention is by virtue of a mandate, court shall not adjudicate the issues in proceeding until written notice of hearing has been served personally _____ days prior to hearing, or as court may order.",back:"8",subject:"CPLR",article:"CPLR Art. 70",statute:"CPLR 7009"},
  {id:134,front:"Family Court has exclusive original jurisdiction over all of the following proceedings, except:",back:"Custody",subject:"FCA",article:"FCA Art. 1",statute:"FCA 115"},
  {id:135,front:"Which of the following statements are true: I. Each Family Court must have a Child Abuse Part; II. Each Family Court must have a Designated Felony Part.",back:"I. is correct, but not II.",subject:"FCA",article:"FCA",statute:"Uniform Rules / FCA (Parts)"},
  {id:136,front:"NYC has __ Family Court Judges.",back:"63",subject:"FCA",article:"FCA",statute:"NYC Family Court roster (headcount-based)"},
  {id:137,front:"Counter-claims on Orders of Protection must be served and filed at least __ days before the hearing date.",back:"5",subject:"FCA",article:"FCA",statute:"Uniform Rules (Orders of Protection — counter-claims)"},
  {id:138,front:"Outside NYC, upon Family Court warrant, police desk officer can take specified bail against Respondent's appearance in Family Court on next session day, as long as arrest was between the hours of:",back:"11:00 AM & 8:00 AM",subject:"FCA",article:"FCA",statute:"FCA (Family Court warrant — desk officer bail)"},
  {id:139,front:"Material witness under 16 years old may be placed in protective custody up to maximum total of __ days.",back:"42",subject:"FCA",article:"FCA",statute:"FCA (Material witness — protective custody)"},
  {id:140,front:"Chief Administrator may eliminate consent requirement for electronic filing in up to __ Family Courts.",back:"6",subject:"FCA",article:"FCA",statute:"Uniform Rules (electronic filing consent)"},
  {id:141,front:"For Family Court Custody cases, Probation Department is entitled to fee for investigation, up to:",back:"$500",subject:"FCA",article:"FCA",statute:"FCA (Custody — probation investigation fee)"},
  {id:142,front:"Indigent parent petitioner is entitled to free counsel for any of the following Family Court proceedings, except:",back:"Article 5 – Paternity",subject:"FCA",article:"FCA Art. 2",statute:"FCA 262(a)(viii)"},
  {id:143,front:"In the Supreme and County Courts, the statute of limitations is computed from the time the cause of action ________ to the time the claim is _____",back:"accrues.…. interposed",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 203"},
  {id:144,front:"For statute of limitations purposes, a defense or counterclaim is interposed when:",back:"a pleading containing it is served.",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 203"},
  {id:145,front:"When commencement of an action has been stayed by a court or by statutory prohibition, the duration of the stay is:",back:"not part of the time within which the action must be commenced.",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 204"},
  {id:146,front:"An action that is otherwise timely brought and later terminated may be recommenced within six months of the termination if the action was terminated for any reason except:",back:"(a), (b), (c), or (d).",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 205"},
  {id:147,front:"Where dismissal is one for neglect to prosecute (CPLR 3216), the judge:",back:"must set forth on the record the specific conduct constituting the neglect",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 205(a)"},
  {id:148,front:"In an action based upon a mutual, open and current account, where there have been reciprocal demands between the parties, the time within which the action must be commenced shall be computed from:",back:"the last transaction in the account on either side",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 206"},
  {id:149,front:"For an action against a defendant for injury suffered as a result of a sexual offense when the plaintiff was previously less than 18 years of age, the statute of limitations expires when the plaintiff reaches age:",back:"fifty-five.",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 208(b)"},
  {id:150,front:"If a person entitled to commence an action dies before the time has expired within which to bring the action, and the action survives, the action may be commenced by his representative:",back:"within one year after the person's death",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 210"},
  {id:151,front:"If a person against whom a cause of action exists dies, the time limited for commencement of an action against his executor or administrator is tolled by:",back:"eighteen months",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 210"},
  {id:152,front:"A money judgment is conclusively presumed to be paid and satisfied after the expiration of ______ years from the time when the party obtaining the judgment was first entitled to enforce it.",back:"twenty.",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 211"},
  {id:153,front:"An action to recover real property or its possession cannot be commenced more than _____ years after plaintiff was seized of or possessed the property.",back:"ten",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 212"},
  {id:154,front:"An action for which no limitation as to commencement is specifically prescribed by law must be commenced within:",back:"six years after the cause of action accrues",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 213"},
  {id:155,front:"An action by or on behalf of a corporation against a present or former director, officer or stockholder for an accounting (a statement of financial condition) must be commenced within:",back:"six years",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 213"},
  {id:156,front:"There is a six-year statute of limitations for which of the following: I An action based upon mistake II An action upon a mortgage of real property III An action based upon fraud",back:"I, II and III.",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 213"},
  {id:157,front:"An action on a residential rent overcharge must be commenced within _____ year(s) of the first overcharge alleged.",back:"six",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 213-a"},
  {id:158,front:"In an action against a person who was criminally convicted of assault, the relevant statute of limitations for the plaintiff ('crime victim') to commence an action for damages suffered during the assault is:",back:"seven years.",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 213-b"},
  {id:159,front:"Generally, the statute of limitations in a civil action by a victim of rape (PL 130.35) may be brought within _________ years:",back:"twenty years",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 213-c"},
  {id:160,front:"An action to recover a chattel must be commenced within:",back:"three years",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 214"},
  {id:161,front:"An action to recover damages for malpractice other than medical, dental or podiatric malpractice must be commenced within:",back:"three years.",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 214"},
  {id:162,front:"An action for medical, dental or podiatric malpractice, not involving a foreign object left in the patient's body, must be commenced generally within ________ after the alleged act, omission or failure.",back:"two years and six months",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 214-a"},
  {id:163,front:"The statute of limitations for toxic exposure to a Superfund Site is the later of three years discovery (or reasonable discovery) of the injury and:",back:"the designation of such an area as a Superfund Site.",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 214-f"},
  {id:164,front:"The period limited for commencement of a civil action for libel or slander is:",back:"one year.",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 215"},
  {id:165,front:"The period within which a civil action for assault or battery usually must be commenced is:",back:"one year",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 215"},
  {id:166,front:"An action to recover on an arbitration award must be commenced within:",back:"one year",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 215"},
  {id:167,front:"Unless a shorter time is provided, a proceeding against a body or officer (Article 78) generally must be commenced within _________ after the determination to be reviewed becomes final and binding.",back:"four months",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 217"},
  {id:168,front:"In the case in which a negligence action is brought against a political subdivision of the State, and in which a notice of claim is required, the statute of limitations for injury to person or property, except for wrongful death, is:",back:"one year and 90 days",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 217-a"},
  {id:169,front:"An affirmation by which of the following, made in accordance with the statutory language, has the same effect as an affidavit:",back:"a person located outside the U.S. or any of its commonwealth territories, or possessions.",subject:"CPLR",article:"CPLR Art. 2",statute:"CPLR 217-a"},
  {id:170,front:"The traditional basis by which the courts of a state may exercise jurisdiction over a person (i.e., in personam jurisdiction) is:",back:"presence of the person within the state",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 301"},
  {id:171,front:"If a nondomiciliary makes a contract outside New York to supply goods or services in New York:",back:"a New York court has a statutory basis for exercising personal jurisdiction",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 302"},
  {id:172,front:"A nondomiciliary who regularly does business within New York State commits a tort outside the state which injures a person within the State. As to this:",back:"New York courts have a statutory basis for exercising personal jurisdiction",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 302"},
  {id:173,front:"In which one of the following would a New York court have no statutory basis for exercising personal jurisdiction over a nondomiciliary of the state, where the alleged tortious conduct occurred inside the state:",back:"defamation of character",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 302"},
  {id:174,front:"A person not subject to personal jurisdiction who commences an action in New York State and on whose behalf no attorney has appeared is deemed to designate the ________ as his agent for the service of a summons by the defendant.",back:"clerk of the court",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 303"},
  {id:175,front:"Under the CPLR, an action is commenced by:",back:"filing a summons and complaint (or summons and notice)",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 304"},
  {id:176,front:"A special proceeding may be commenced by: I. filing a petition II. serving a notice of petition and a petition III. filing a summons and complaint.",back:"I, only",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 304"},
  {id:177,front:"If a court directs that a new party be joined in an action and the order is not made upon the new party's motion, which of the following shall be filed with the clerk and served upon the new party:",back:"a supplemental summons",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 305"},
  {id:178,front:"With respect to proof of service of a summons:",back:"it may only be amended in a court's discretion",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 305"},
  {id:179,front:"Proof of service shall be:",back:"in the form of a certificate, when made by an authorized public officer.",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 306"},
  {id:180,front:"Select the correct answer. Upon an action commenced in the Supreme or County Court by the filing of the summons and complaint:",back:"an index number shall be assigned and the index number fee shall be paid",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 306-a"},
  {id:181,front:"Personal service upon the State of New York shall be made by delivering the summons to:",back:"an Assistant Attorney-General at an office of the Attorney-General.",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 307"},
  {id:182,front:"If personal service on a state officer sued solely in an official capacity is made to obtain personal jurisdiction, such service:",back:"may be made on the official.",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 307"},
  {id:183,front:"Select the best answer. Personal service on a nondomiciliary when long-arm jurisdiction does not exist may be made by which one of the following:",back:"delivery of the summons to him personally, within the State",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 308"},
  {id:184,front:"With regard to a person age seventeen who is married, personal service may be properly effectuated by serving:",back:"the seventeen year old and her adult spouse with whom she resides",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 309"},
  {id:185,front:"In a civil action, a fifteen year old infant is named as a defendant. At the time service is made, the infant is home with his father and mother. In order to make proper service, the following should be served:",back:"either parent and infant.",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 309"},
  {id:186,front:"Personal service upon a domestic limited partnership may be made upon:",back:"any managing or general agent",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 310-a"},
  {id:187,front:"Personal service on a corporation may be made by delivery of the summons to: 1. an assistant cashier 2. a director 3. a security guard 4. an administrative assistant",back:"1 or 2 only",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 311"},
  {id:188,front:"Personal service of a summons on the City of New York may be made on the:",back:"Corporation Counsel",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 311"},
  {id:189,front:"Personal service on a court of three or more judges is made by:",back:"delivering the summons to any one of the judges",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 312"},
  {id:190,front:"If a defendant properly acknowledges receipt of service of a mailed summons and complaint, he must serve an answer within _________ days after the ________ was mailed.",back:"twenty.…. signed acknowledgment of receipt",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 312-a"},
  {id:191,front:"If a defendant refuses or fails to return the signed acknowledgment of receipt, the plaintiff is entitled to:",back:"the reasonable expense of alternative service on defendant",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 312-a"},
  {id:192,front:"Service of a summons outside New York may be used to acquire personal jurisdiction over a person domiciled in New York if the service is made:",back:"anywhere in the world.",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 313"},
  {id:193,front:"With regard to service by publication in a non-matrimonial action, service is deemed complete on a specified number of days after the first publication. The correct number of days is:",back:"twenty-eight",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 316"},
  {id:194,front:"Where there has been service by publication in a matrimonial action, service is deemed complete on ________________ after the first publication.",back:"the twenty-first day",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 316"},
  {id:195,front:"The designation of an agent to accept service of a summons may be made by:",back:"a natural person, corporation or partnership",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 318"},
  {id:196,front:"As a general rule, the appearance of a defendant in a case without any other action on her part is most nearly equivalent to:",back:"personal service in the State of the summons upon the defendant",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 320"},
  {id:197,front:"A defendant upon whom personal service of a summons and complaint has been made within the State has _____ days after service to appear in the action:",back:"twenty",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 320"},
  {id:198,front:"A defendant appears in an action by:",back:"serving an answer or notice of appearance",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 320"},
  {id:199,front:"If a party appears in an action by an attorney, the party:",back:"may also act in person with consent of the court",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 321"},
  {id:200,front:"An attorney may appear on behalf of a party in a civil action or proceeding for limited purposes:",back:"unless otherwise directed by the court;",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 321(d)"},
  {id:201,front:"If an action is pending in one court but it appears that the damages sustained are less than demanded and within the jurisdictional limits of a court of lower jurisdiction, a waiver of jury trial in the first court:",back:"is inoperative after removal to the lower court",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 325"},
  {id:202,front:"'Removal' of an action most nearly means:",back:"the transfer of the action from one court to another",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 325"},
  {id:203,front:"An order to stay proceedings for the purpose of removing an action may be made:",back:"by the court in which the action is pending or the court to which removal is sought",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 326"},
  {id:204,front:"When a court finds that in the interest of substantial justice the action should be heard in another forum, the court may:",back:"none of the above.",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 327"},
  {id:205,front:"In connection with a proceeding in a tribunal outside the State, a New York court may order service of any document upon any person who is domiciled or can be found within the State. This order may be issued by:",back:"either the Supreme Court or a County Court",subject:"CPLR",article:"CPLR Art. 3",statute:"CPLR 328"},
  {id:206,front:"After a special proceeding is commenced, as to third party practice or intervention:",back:"leave of court is required",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 401"},
  {id:207,front:"The opposing parties in a special proceeding are styled:",back:"petitioner and respondent",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 401"},
  {id:208,front:"The pleading in which a cause of action for a special proceeding is stated is called a:",back:"petition",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 402"},
  {id:209,front:"In a special proceeding the party against whom the claim is made (i.e., the respondent) states his defense in:",back:"an answer",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 402"},
  {id:210,front:"In a special proceeding, the party bringing the proceeding must serve the papers on any adverse party at least _______ days before the time the matter is noticed to be heard:",back:"eight",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 403"},
  {id:211,front:"In a special proceeding, if the petition is served eight days before the return date, the answer and supporting affidavits shall be served at least _______ days before such return date:",back:"two",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 403"},
  {id:212,front:"In a special proceeding, a notice of petition shall be served:",back:"in the same manner as a summons",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 403"},
  {id:213,front:"In a special proceeding, an objection in point of law, made by the respondent, may:",back:"be raised by a motion to dismiss the petition, or by setting it forth in the answer",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 404"},
  {id:214,front:"In a special proceeding, an objection in point of law may:",back:"be raised by respondent or petitioner",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 404"},
  {id:215,front:"The time in which a party in a special proceeding must make a motion to strike prejudicial matters unnecessarily inserted in a pleading is:",back:"within the time allowed for his responsive pleading.",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 405"},
  {id:216,front:"In a special proceeding, motions made before the time at which the petition is noticed to be heard shall be heard:",back:"on the return date of the petition",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 406"},
  {id:217,front:"In a special proceeding, if the court orders severance as to any claim or party, as to such claim or party the special proceeding:",back:"may continue as an action or as a separate special proceeding",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 407"},
  {id:218,front:"In a special proceeding, except for (i) admissions as to matters of fact, papers, documents and photographs, (ii) proceedings in a Surrogate's Court and (iii) proceedings relating to express trusts pursuant to Article 77, disclosure:",back:"requires leave of court.",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 408"},
  {id:219,front:"At a hearing conducted for a special proceeding:",back:"both (b) and (c) are correct.",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 409"},
  {id:220,front:"At the hearing of a special proceeding:",back:"trial by jury is available only for issues triable as a matter of right by a jury",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 410"},
  {id:221,front:"At the end of a special proceeding, the rights of the parties are determined by entry of:",back:"a judgment",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 411"},
  {id:222,front:"A written agreement by two parties fixing venue should:",back:"be enforced, because generally the parties may agree to the place of the trial",subject:"CPLR",article:"CPLR Art. 5",statute:"CPLR 501"},
  {id:223,front:"The venue in an action refers to:",back:"the place of trial",subject:"CPLR",article:"CPLR",statute:"CPLR Article 5"},
  {id:224,front:"Where because of joinder of claims or parties there is a conflict as to venue, the court, upon motion, shall order as the place of trial:",back:"one proper as to at least one of the parties or claims",subject:"CPLR",article:"CPLR Art. 5",statute:"CPLR 502"},
  {id:225,front:"For venue purposes, an executor, administrator or testamentary guardian shall be deemed a resident of:",back:"both the county in which he resides and the county of his appointment",subject:"CPLR",article:"CPLR Art. 5",statute:"CPLR 503"},
  {id:226,front:"For venue purposes, a foreign corporation authorized to transact business in the State shall be deemed a resident of:",back:"the county in which its principal office is located",subject:"CPLR",article:"CPLR Art. 5",statute:"CPLR 503"},
  {id:227,front:"A domestic corporation, for venue purposes, is deemed a resident of any county:",back:"in which its principal office is located",subject:"CPLR",article:"CPLR Art. 5",statute:"CPLR 503"},
  {id:228,front:"For venue purposes, the place of trial for an action against the City of New York which arose in Kings County shall be:",back:"Kings County",subject:"CPLR",article:"CPLR Art. 5",statute:"CPLR 504"},
  {id:229,front:"When a cause of action arises against the New York City Transit Authority in one of the five counties of New York City, proper venue lies in:",back:"the county in New York City where the cause of action arose",subject:"CPLR",article:"CPLR Art. 5",statute:"CPLR 505"},
  {id:230,front:"Venue in actions affecting title to real property lies in the county:",back:"where the property is located",subject:"CPLR",article:"CPLR Art. 5",statute:"CPLR 507"},
  {id:231,front:"Except in matrimonial actions, unless venue is changed by a court order upon motion or by consent of the parties, the choice of venue which will prevail is that of the:",back:"plaintiff",subject:"CPLR",article:"CPLR Art. 5",statute:"CPLR 509"},
  {id:232,front:"A demand made to change the place of trial on the ground that the designated county is not a proper county shall be served:",back:"with or before service of the answer",subject:"CPLR",article:"CPLR Art. 5",statute:"CPLR 511"},
  {id:233,front:"An appeal from an order changing the place of trial shall:",back:"be taken in the department in which the motion for the order was heard and determined",subject:"CPLR",article:"CPLR Art. 5",statute:"CPLR 511"},
  {id:234,front:"If a person who should be a plaintiff refuses to join in an action:",back:"he may be made a defendant if the court can exercise personal jurisdiction over him",subject:"CPLR",article:"CPLR Art. 10",statute:"CPLR 1001"},
  {id:235,front:"Select the best statement:",back:"Neither (a) nor (b) is correct.",subject:"CPLR",article:"CPLR Art. 10",statute:"CPLR 1002"},
  {id:236,front:"If several plaintiffs injured in a truck accident sue the trucking company in one action, this is said to be an example of:",back:"joinder.",subject:"CPLR",article:"CPLR Art. 10",statute:"CPLR 1002"},
  {id:237,front:"Select the correct statement:",back:"Parties may be dropped by the court at any stage of the action.",subject:"CPLR",article:"CPLR Art. 10",statute:"CPLR 1003"},
  {id:238,front:"Select the best answer. If there is a misjoinder of parties, the case should be:",back:"continued, and the improperly joined party dropped",subject:"CPLR",article:"CPLR Art. 10",statute:"CPLR 1003"},
  {id:239,front:"A person who may be exposed to multiple liability as a result of adverse claims and who utilizes the interpleader statute is called a:",back:"stakeholder",subject:"CPLR",article:"CPLR Art. 10",statute:"CPLR 1006"},
  {id:240,front:"A defendant serving a third-party complaint shall be known as:",back:"a third-party plaintiff",subject:"CPLR",article:"CPLR Art. 10",statute:"CPLR 1007"},
  {id:241,front:"A third-party defendant responds to the claim asserted against him by serving:",back:"an answer",subject:"CPLR",article:"CPLR Art. 10",statute:"CPLR 1008"},
  {id:242,front:"A third-party defendant may proceed:",back:"against any person who may be liable to him for all or part of the third-party claim",subject:"CPLR",article:"CPLR Art. 10",statute:"CPLR 1011"},
  {id:243,front:"If the constitutionality of a statute of the State is involved in an action, the court must notify which of the following, if not already a party to the action:",back:"the Attorney-General",subject:"CPLR",article:"CPLR Art. 10",statute:"CPLR 1012"},
  {id:244,front:"If one or more of the defendants in an action dies, and the right sought to be enforced survives against the remaining defendants, the action shall:",back:"proceed",subject:"CPLR",article:"CPLR Art. 10",statute:"CPLR 1015(b)"},
  {id:245,front:"Select the correct statement as to a motion for substitution:",back:"It may be made by the successors or representatives of a party, or by any party.",subject:"CPLR",article:"CPLR Art. 10",statute:"CPLR 1021"},
  {id:246,front:"Select the best statement:",back:"Only (b) and (c) are correct",subject:"CPLR",article:"CPLR Art. 10",statute:"CPLR 1023"},
  {id:247,front:"With regard to an action brought to review an administrative or operational determination of the Court of Appeals, the proper party to name as defendant is:",back:"the Chief Administrator of the Courts, in his representative capacity",subject:"CPLR",article:"CPLR Art. 10",statute:"CPLR 1026"},
  {id:248,front:"A motion for permission to waive costs, fees and expenses may be made:",back:"at either the trial or appellate stages.",subject:"CPLR",article:"CPLR Art. 11",statute:"CPLR 1101 (Amended, 2026)"},
  {id:249,front:"Within two days of filing a court order permitting waiver of costs, fees and expenses in an appeal, the court clerk must:",back:"notify the court stenographer.",subject:"CPLR",article:"CPLR Art. 11",statute:"CPLR 1102"},
  {id:250,front:"In a special proceeding a __________________________________ are used.",back:"notice of petition and petition",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 402"},
  {id:251,front:"Notice of petition must be served at least _______ days before hearing time.",back:"8",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 403"},
  {id:252,front:"T/F? In a special proceeding, the court shall make a summary determination upon the pleadings, papers and admissions to the extent that no triable issues of fact are raised.",back:"True",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 409"},
  {id:253,front:"If notice of petition is served at least 12 days before hearing time, answer must be served at least ______ day before hearing if notice of petition so specifies.",back:"7",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 403"},
  {id:254,front:"T/F? Motions in a special proceeding, made before the time at which the petition is noticed to be heard, shall be noticed to be heard at that time.",back:"True",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 406"},
  {id:255,front:"The parties in a special proceeding are:",back:"petitioner and respondent",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 401"},
  {id:256,front:"Pursuant to CPLR 406, motions in a special proceeding, made before the time at which the petition is noticed to be heard, shall be noticed to be heard:",back:"at the same time the petition is noticed to be heard",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 406"},
  {id:257,front:"Under CPLR 403, in a special proceeding, the party bringing the proceeding must serve the papers on any adverse party at least _______ days before the time the matter is noticed to be heard:",back:"8",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 403"},
  {id:258,front:"In a special proceeding, if the petition is served 8 days before the return date, the answer and supporting affidavits shall be served at least _______ days before such return date:",back:"2",subject:"CPLR",article:"CPLR Art. 4",statute:"CPLR 403"},
  {id:259,front:"Pursuant to CPLR 5, the venue in an action refers to:",back:"the place of trial",subject:"CPLR",article:"CPLR Art. 5",statute:"CPLR 5 (Venue)"},
  {id:260,front:"For venue purposes, a foreign corporation authorized to transact business in the State shall be deemed a resident of:",back:"the county in which its principal office is located",subject:"CPLR",article:"CPLR Art. 5",statute:"CPLR 503"},
  {id:261,front:"Pursuant to CPLR 505, when a cause of action arises against the New York City Transit Authority in one of the 5 counties of New York City, proper venue is in:",back:"the county in New York City where the cause of action arose",subject:"CPLR",article:"CPLR Art. 5",statute:"CPLR 505"},
  {id:262,front:"Pursuant to CPLR 507, venue in actions affecting title to real property lies in the county:",back:"where the property is located",subject:"CPLR",article:"CPLR Art. 5",statute:"CPLR 507"},
  {id:263,front:"Unless venue is changed by a court order upon motion or by consent of the parties, the choice of venue which will prevail is that of the:",back:"plaintiff",subject:"CPLR",article:"CPLR Art. 5",statute:"CPLR 509"},
  {id:264,front:"Administrative forms for use in the family court shall be promulgated by:",back:"the chief administrator of the courts.",subject:"FCA",article:"FCA Art. 2",statute:"FCA 214"},
  {id:265,front:"Papers and documents which are electronically filed in the family court:",back:"are not available for public inspection online.",subject:"FCA",article:"FCA Art. 2",statute:"FCA 214(f)"},
  {id:266,front:"The court shall file or direct the filing of an order within how many days of the decision of the court?",back:"20 days",subject:"FCA",article:"FCA Art. 2",statute:"FCA 217"},
  {id:267,front:"Under the family court act the term \"attorney for the child\" refers to:",back:"an attorney admitted to practice in New York state.",subject:"FCA",article:"FCA Art. 2",statute:"FCA 242"},
  {id:268,front:"An attorney for the child may be designated to serve from which sources? (1) any qualified attorney (2) legal aid society (3) a panel designated by the appellate division (4) bar association's recommendations to the appellate division",back:"1, 2 & 3 only",subject:"FCA",article:"FCA Art. 2",statute:"FCA 243(a),(b),(c)"},
  {id:269,front:"In making an appointment of an attorney for a child in a proceeding under articles 3, 7, 10, 10-A or 10-C, the court to the extent practicable and appropriate shall:",back:"appoint the same attorney who has previously represented the child.",subject:"FCA",article:"FCA Art. 2",statute:"FCA 249(b)"},
  {id:270,front:"Which of the following shall promulgate court rules prescribing workload standards for attorneys representing children?",back:"Chief administrator of the courts",subject:"FCA",article:"FCA Art. 2",statute:"FCA 249-b"},
  {id:271,front:"Who is entitled to assignment of counsel, if indigent? (1) any party under article 5 (2) the respondent under article 10, 10-A, or 10-C (3) the petitioner and respondent under article 8 (4) the petitioner and respondent under article 6",back:"2 & 3 only",subject:"FCA",article:"FCA Art. 2",statute:"FCA 262"},
  {id:272,front:"T/F: The court shall appoint an attorney for the child in any case which is before it, if independent legal counsel is not available to the child.",back:"True",subject:"FCA",article:"FCA Art. 2",statute:"FCA 249-a"},
  {id:273,front:"T/F: The presumption [that a JD/PINS-subject minor lacks capacity to waive counsel] may be rebutted only after the appointment of an attorney for the child.",back:"True",subject:"FCA",article:"FCA Art. 2",statute:"FCA 249-a"},
  {id:274,front:"T/F: The court shall make a determination after a hearing at which the standard of proof is by a preponderance of the evidence.",back:"False",subject:"FCA",article:"FCA Art. 2",statute:"FCA 249-a"},
  {id:275,front:"T/F: The attorney for the child shall appear and may participate in the hearing.",back:"False",subject:"FCA",article:"FCA Art. 2",statute:"FCA 249-a"},
  {id:276,front:"T/F: The court may determine that a waiver of counsel is in the best interest of the minor.",back:"True",subject:"FCA",article:"FCA Art. 2",statute:"FCA 249-a"},
  {id:277,front:"T/F: The Family Court probation service may include volunteer probation officers who shall receive pay from public funds.",back:"False",subject:"FCA",article:"FCA Art. 2",statute:"FCA 252(a)"},
  {id:278,front:"T/F: In all cases involving abuse, the corporation counsel of the city of New York and, outside the city, the appropriate county attorney shall be a necessary party.",back:"False",subject:"FCA",article:"FCA Art. 2",statute:"FCA 254(b)"},
  {id:279,front:"T/F: The corporation counsel of NYC and the district attorney of any county in NYC may agree that the DA presents the case where a designated felony act is alleged.",back:"True",subject:"FCA",article:"FCA Art. 2",statute:"FCA 254(a)"},
  {id:280,front:"T/F: In a proceeding under Article 10-C (Destitute Children), a 'parent' or 'caretaker' does not have the right to the assistance of counsel.",back:"False",subject:"FCA",article:"FCA Art. 2",statute:"FCA 262"},
  {id:281,front:"T/F: Both the respondent and the petitioner in any family offense proceeding have the right to counsel assigned by the court when financially unable to obtain same.",back:"True",subject:"FCA",article:"FCA Art. 2",statute:"FCA 262"},
  {id:282,front:"Select the least correct statement. A Juvenile Delinquent under Article 3 is a person:",back:"Who is not criminally responsible by reason of infancy.",subject:"FCA",article:"FCA Art. 3",statute:"FCA 301.2(1)"},
  {id:283,front:"Which is correct? (1) a 'designated felony act' is essentially an act which, if done by an adult, would be a crime. (2) there are only a small limited number of offenses which can be deemed a designated felony act.",back:"only option 1 is correct",subject:"FCA",article:"FCA Art. 3",statute:"FCA 301.2(8)"},
  {id:284,front:"Which of the following may originate a juvenile delinquency proceeding:",back:"a presentment agency",subject:"FCA",article:"FCA Art. 3",statute:"FCA 301.2(12)"},
  {id:285,front:"In determining jurisdiction over an alleged juvenile delinquent, which is the controlling time factor?",back:"at the time the delinquent act allegedly was committed",subject:"FCA",article:"FCA Art. 3",statute:"FCA 302.1/2"},
  {id:286,front:"Regarding transfer of proceedings originated in the county where the acts occurred:",back:"the court may order transfer upon motion of the presentment agency or the respondent",subject:"FCA",article:"FCA Art. 3",statute:"FCA 302.3"},
  {id:287,front:"1. CPL provisions don't apply to JD proceedings unless specifically prescribed. 2. CPL Article 40 double jeopardy provisions DO apply to JD proceedings.",back:"Both statements are correct.",subject:"FCA",article:"FCA Art. 3",statute:"FCA 303.1 & 303.2"},
  {id:288,front:"T/F: The detention of a child under 13 years of age in a secure detention facility shall not be directed under any provisions of Article 3.",back:"True",subject:"FCA",article:"FCA Art. 3",statute:"FCA 304.1(3)"},
  {id:289,front:"A family court appearance ticket directs a child and responsible person to appear: (1) at a designated probation service (2) without security (3) is issued/subscribed by a police or peace officer",back:"1, 2 & 3",subject:"FCA",article:"FCA Art. 3",statute:"FCA 307.1(1)"},
  {id:290,front:"If the crime is a designated felony under FCA 301.2, the return date of the appearance ticket shall be:",back:"72 hours excluding Saturdays, Sundays and public holidays.",subject:"FCA",article:"FCA Art. 3",statute:"FCA 307.1(2)"},
  {id:291,front:"Efforts at adjustment in a JD case by probation service may not extend beyond what period without leave of court?",back:"3 months",subject:"FCA",article:"FCA Art. 3",statute:"FCA 308.1(9)"},
  {id:292,front:"When two or more respondents are charged in separate petitions with the same crime(s), the court shall conduct:",back:"a single or a consolidated fact finding hearing.",subject:"FCA",article:"FCA Art. 3",statute:"FCA 311.3"},
  {id:293,front:"A petition may NOT be amended for curing which of the following? (1) matters of form, time, place, names, etc. (2) failure to charge/state a crime (3) legal insufficiency of factual allegations (4) misjoinder of crimes",back:"2, 3 & 4 only",subject:"FCA",article:"FCA Art. 3",statute:"FCA 311.5"},
  {id:294,front:"Service of a summons and petition must be made at least how many hours before the time stated for appearance?",back:"24 hours",subject:"FCA",article:"FCA Art. 3",statute:"FCA 312.1"},
  {id:295,front:"An adjournment in contemplation of dismissal (ACD) may not exceed which period?",back:"6 months",subject:"FCA",article:"FCA Art. 3",statute:"FCA 315.3"},
  {id:296,front:"Which is least correct regarding the initial appearance of an alleged JD?",back:"the court may appoint an attorney to represent the respondent.",subject:"FCA",article:"FCA Art. 3",statute:"FCA 320.2/320.3"},
  {id:297,front:"Upon receipt of an incapacity examination report, the court shall comply with each EXCEPT:",back:"Notify parties at least 7 business days prior to hearing.",subject:"FCA",article:"FCA Art. 3",statute:"FCA 322.2"},
  {id:298,front:"If the court finds probable cause that respondent... (1) committed a misdemeanor, commitment to custody not to exceed 90 days (2) committed a felony, commitment for an initial period not to exceed one year",back:"Both statements are correct.",subject:"FCA",article:"FCA Art. 3",statute:"FCA 322.2"},
  {id:299,front:"If probable cause exists that respondent committed a ________, treatment shall be in a _________ facility within the Dept. of ________ ________, or an _________ facility if the commissioner petitions and the court approves.",back:"specified criminal act; residential; Mental Hygiene; outpatient",subject:"FCA",article:"FCA Art. 3",statute:"FCA 322.2"},
  {id:300,front:"The probable cause hearing may be adjourned for good cause shown, for how many court days?",back:"3 court days",subject:"FCA",article:"FCA Art. 3",statute:"FCA 325.1"},
  {id:301,front:"A request for a bill of particulars by respondent shall be timely if made within how many days after the conclusion of the initial appearance?",back:"30 days",subject:"FCA",article:"FCA Art. 3",statute:"FCA 330.1(3)"},
  {id:302,front:"If respondent is not in detention, a demand to produce discoverable material shall be made within how many days after the initial appearance?",back:"15 days",subject:"FCA",article:"FCA Art. 3",statute:"FCA 331.7(2)"},
  {id:303,front:"Notice of intention to rely on a mental disease/defect defense must be served within what period after the initial appearance and before the fact finding hearing?",back:"30 days",subject:"FCA",article:"FCA Art. 3",statute:"FCA 335.1"},
  {id:304,front:"Which is least correct as to the order of procedure at the fact finding hearing?",back:"respondent must offer evidence in his defense.",subject:"FCA",article:"FCA Art. 3",statute:"FCA 342.1"},
